<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap the Beat — Lovely Rita Adventures</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0a;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Georgia,serif;}
#phone-outer{display:flex;justify-content:center;padding:20px 0 40px;width:100%;}
#phone{background:var(--bg,#1a0040);overflow:hidden;position:relative;display:flex;flex-direction:column;width:393px;height:852px;border-radius:48px;box-shadow:0 0 0 10px #1a1a1a,0 0 0 12px #333,0 30px 80px rgba(0,0,0,.8);}
#phone::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#0a0a0a;border-radius:0 0 20px 20px;z-index:100;}
.theme-youngsters{--bg:#1a0040;--accent:#ff6ef7;--accent2:#ffde59;--glow:#ff6ef7;--btn-grad:linear-gradient(135deg,#ff6ef7,#a855f7);--title-glow:0 0 24px #ff6ef7,0 0 48px #a855f7;}
.theme-grownups{--bg:#1a1200;--accent:#ffde59;--accent2:#fff3a0;--glow:#ffde59;--btn-grad:linear-gradient(135deg,#ffde59,#c8860a);--title-glow:0 0 24px #ffde59,0 0 50px #c8860a;}
.theme-experts{--bg:#0d0d1e;--accent:#c8a96e;--accent2:#e8d5b0;--glow:#c8a96e;--btn-grad:linear-gradient(135deg,#c8a96e,#6677aa);--title-glow:0 0 20px #c8a96e,0 0 40px #6677aa;}
#phone-scroll{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;padding-top:34px;}
#phone-scroll::-webkit-scrollbar{width:0;}
#header{padding:16px 16px 10px;display:flex;flex-direction:column;align-items:center;background:var(--bg);}
#main-title{font-size:20px;font-weight:bold;letter-spacing:2px;color:var(--accent);text-shadow:var(--title-glow);text-align:center;}
#subtitle{font-size:9px;color:var(--accent2);letter-spacing:1.5px;margin-top:4px;opacity:.8;text-align:center;}
#content{flex:1;padding:12px 16px;display:flex;flex-direction:column;gap:12px;align-items:center;}
#phase-display{font-size:16px;font-weight:bold;color:var(--accent);text-align:center;letter-spacing:1px;text-shadow:var(--title-glow);}
#round-info{font-size:11px;color:rgba(255,255,255,.5);text-align:center;letter-spacing:1px;}
#message{font-size:13px;color:#ddd;font-style:italic;text-align:center;line-height:1.5;min-height:40px;padding:0 8px;}
/* 2x2 Beat Pad Grid */
#beat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:260px;margin:10px 0;}
.beat-pad{width:110px;height:110px;border-radius:20px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:32px;transition:transform .1s,box-shadow .1s;position:relative;box-shadow:0 6px 20px rgba(0,0,0,.5);}
.beat-pad:active{transform:scale(.92);}
.beat-pad.lit{transform:scale(1.08);filter:brightness(1.6);}
.pad-pink{background:radial-gradient(circle at 40% 35%,#ff6ef7,#a855f7);}
.pad-blue{background:radial-gradient(circle at 40% 35%,#60a5fa,#1d4ed8);}
.pad-green{background:radial-gradient(circle at 40% 35%,#4ade80,#16a34a);}
.pad-gold{background:radial-gradient(circle at 40% 35%,#fbbf24,#b45309);}
/* Result */
#result-panel{display:none;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:20px;text-align:center;width:100%;}
#result-title{font-size:22px;font-weight:bold;color:var(--accent);text-shadow:var(--title-glow);margin-bottom:6px;}
#result-score{font-size:28px;font-weight:bold;color:var(--accent2);margin:10px 0;}
#result-label{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:1px;}
#result-msg{font-size:12px;color:#ddd;font-style:italic;margin-top:8px;line-height:1.5;}
#bc-display-hidden-wrap{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;width:100%;}
.bc-label{font-size:10px;color:#fff;}.bc-count{font-size:15px;font-weight:bold;color:var(--accent);}
#nav-bar{display:flex;justify-content:space-around;align-items:center;padding:10px 0 14px;background:rgba(0,0,0,.4);border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.nav-btn{background:none;border:none;color:rgba(255,255,255,.4);font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 16px;transition:color .2s;font-family:Georgia,serif;}
.nav-btn:hover{color:var(--accent);}.nav-icon{font-size:18px;}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;font-family:Georgia,serif;}
</style>
</head>
<body>
<div id="phone-outer">
<div id="phone" class="theme-youngsters">
<div id="phone-scroll">
<div id="header">
  <div id="main-title">🎵 TAP THE BEAT</div>
  <div id="subtitle">BONUS ROUND — FOLLOW THE RHYTHM</div>
</div>
<div id="content">
  <div id="round-info">ROUND 1 OF 3</div>
  <div id="phase-display">👀 WATCH RITA PLAY</div>
  <div id="message">Rita is playing you a melody love! Watch carefully and repeat it!</div>
  <div id="beat-grid">
    <button class="beat-pad pad-pink" id="pad0" onpointerdown="playerTap(0)">🎵</button>
    <button class="beat-pad pad-blue"  id="pad1" onpointerdown="playerTap(1)">🎶</button>
    <button class="beat-pad pad-green" id="pad2" onpointerdown="playerTap(2)">🎼</button>
    <button class="beat-pad pad-gold"  id="pad3" onpointerdown="playerTap(3)">🎹</button>
  </div>
  <div id="result-panel">
    <div id="result-title">🎵 Brilliant!</div>
    <div id="result-score">+0</div>
    <div id="result-label">EDUCATIONAL BEATCOINS EARNED</div>
    <div id="result-msg">Amazing rhythm!</div>
    <div style="margin-top:14px;">
      <button onclick="goChooseWorld()" style="background:var(--btn-grad);border:none;border-radius:20px;padding:12px 20px;color:#000;font-weight:bold;font-size:13px;cursor:pointer;font-family:Georgia,serif;width:100%;">🛍️ Go to Beat Shop!</button>
    </div>
  </div>
  <div id="bc-display-wrap">
    <span class="bc-label">Educational BeatCoins Total</span>
    <span class="bc-count" id="bc-display">25,000</span>
  </div>
</div>
</div>
<nav id="nav-bar">
  <button class="nav-btn nav-home" onclick="goHome()"><span class="nav-icon">🏠</span><span>Home</span></button>
  <button class="nav-btn" onclick="goChooseWorld()"><span class="nav-icon">🌍</span><span>Choose World</span></button>
</nav>
</div>
</div>
<div id="toast"></div>
<script>
const params=new URLSearchParams(window.location.search);
const level=params.get('level')||localStorage.getItem('askLovelyRitaV4_level')||'youngsters';
document.getElementById('phone').className='theme-'+level;

const REWARD_PER_ROUND={youngsters:50,grownups:65,experts:80};
const SHOW_DELAY={youngsters:700,grownups:550,experts:450}; // ms per beat shown

let S={round:0,sequence:[],playerSeq:[],phase:'watch',earned:0,locked:true};
const rounds=[3,4,5]; // sequence lengths per round
const reward=REWARD_PER_ROUND[level];
const showDelay=SHOW_DELAY[level];

const PAD_COLORS=['#ff6ef7','#60a5fa','#4ade80','#fbbf24'];
const PAD_EMOJIS=['🎵','🎶','🎼','🎹'];

function litPad(idx,on){
  const pad=document.getElementById('pad'+idx);
  if(on){pad.classList.add('lit');pad.style.boxShadow=`0 0 30px ${PAD_COLORS[idx]}, 0 0 60px ${PAD_COLORS[idx]}40`;}
  else{pad.classList.remove('lit');pad.style.boxShadow='';}
}

function generateSeq(len){
  const seq=[];
  for(let i=0;i<len;i++) seq.push(Math.floor(Math.random()*4));
  return seq;
}

function disablePads(disabled){
  for(let i=0;i<4;i++) document.getElementById('pad'+i).disabled=disabled;
}

function playSequence(seq, onDone){
  disablePads(true);
  let i=0;
  function playNext(){
    if(i>=seq.length){setTimeout(onDone,500);return;}
    const idx=seq[i];
    litPad(idx,true);
    playBeep(idx);
    setTimeout(()=>{litPad(idx,false);i++;setTimeout(playNext,showDelay*0.5);},showDelay);
  }
  setTimeout(playNext,600);
}

function playBeep(idx){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const freqs=[523,659,784,880]; // C5,E5,G5,A5
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=freqs[idx]; o.type='sine';
    g.gain.setValueAtTime(0.15,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);
    o.start(); o.stop(ctx.currentTime+0.35);
  }catch(e){}
}

function startRound(){
  if(S.round>=3){showResult();return;}
  const len=rounds[S.round];
  S.sequence=generateSeq(len);
  S.playerSeq=[];
  S.phase='watch';
  S.locked=true;
  document.getElementById('round-info').textContent='ROUND '+(S.round+1)+' OF 3 — '+len+' BEATS';
  document.getElementById('phase-display').textContent='👀 WATCH RITA PLAY';
  document.getElementById('message').textContent={
    youngsters:"Watch the pads light up love! Then repeat the pattern!",
    grownups:"Memorise the sequence darling — then show me your rhythm!",
    experts:"Concentrate love — the sequence gets trickier each round!"
  }[level];
  speak({youngsters:"Watch carefully love!",grownups:"Here is your sequence darling!",experts:"Concentrate!"}[level]);
  playSequence(S.sequence,()=>{
    S.phase='play';S.locked=false;
    disablePads(false);
    document.getElementById('phase-display').textContent='🎹 YOUR TURN!';
    document.getElementById('message').textContent='Now repeat the pattern love! Tap the pads in the same order!';
    speak("Your turn love! Repeat the melody!");
  });
}

function playerTap(idx){
  if(S.locked||S.phase!=='play')return;
  litPad(idx,true); playBeep(idx);
  setTimeout(()=>litPad(idx,false),200);
  S.playerSeq.push(idx);
  const pos=S.playerSeq.length-1;
  if(S.playerSeq[pos]!==S.sequence[pos]){
    // Wrong!
    disablePads(true); S.locked=true;
    speak("Oh not quite love! Let me play it again!");
    toast('❌ Not quite! Watch again...');
    document.getElementById('phase-display').textContent='👀 WATCH AGAIN';
    setTimeout(()=>{
      S.playerSeq=[];S.phase='watch';
      playSequence(S.sequence,()=>{
        S.phase='play';S.locked=false;disablePads(false);
        document.getElementById('phase-display').textContent='🎹 YOUR TURN!';
        document.getElementById('message').textContent='Try again love! You can do it!';
        speak("Try again love!");
      });
    },1000);
    return;
  }
  if(S.playerSeq.length===S.sequence.length){
    // Round complete!
    disablePads(true); S.locked=true;
    S.earned+=reward; saveEBC(reward); postGlobalScore(reward);
    document.getElementById('bc-display').textContent=Number(localStorage.getItem('askLovelyRitaV4_bc')||25000).toLocaleString();
    const msgs=['Brilliant love! Round 1 perfect!','Smashing! Round 2 nailed it!','Outstanding! All 3 rounds complete!'];
    speak(msgs[S.round]);
    toast('⚡ Beat Burst! +'+reward+' EBCs for the Beat Shop!');
    document.getElementById('phase-display').textContent='✅ ROUND '+(S.round+1)+' COMPLETE!';
    S.round++;
    setTimeout(startRound,2000);
  }
}

function showResult(){
  document.getElementById('beat-grid').style.opacity='0.3';
  document.getElementById('beat-grid').style.pointerEvents='none';
  const r=document.getElementById('result-panel');r.style.display='block';
  document.getElementById('result-score').textContent='+'+S.earned;
  const msgs={youngsters:"Incredible rhythm love! You are a natural music star! Taking you to the Beat Shop in a moment!",grownups:"Sensational darling! Rita is so proud of your timing! Off to the Beat Shop we go!",experts:"Extraordinary! A true musical genius! Heading to the Beat Shop now love!"};
  document.getElementById('result-msg').textContent=msgs[level];
  document.getElementById('result-title').textContent=S.earned>=(reward*2)?'🎵 Music Master!':'🎶 Well Done!';
  speak(msgs[level]);
  // Auto-advance to Beat Shop after 4 seconds
  const _msg=msgs[level]||msgs.youngsters;
const _dur=Math.min(Math.max(_msg.length*75,5000),14000);
  let sec=Math.ceil(_dur/1000);
  const btn=document.querySelector('#result-panel button');
  if(btn){btn.textContent='🛍️ Going to Beat Shop in '+sec+'s...';}
  const iv=setInterval(()=>{
    sec--;
    if(btn) btn.textContent=sec>0?'🛍️ Going to Beat Shop in '+sec+'s...':'🛍️ Going now!';
    if(sec<=0){clearInterval(iv);goChooseWorld();}
  },1000);
}


// Calculate speech duration: 75ms per character, min 4000ms, max 12000ms
function speechDuration(text) {
  return Math.min(Math.max(text.length * 75, 4000), 12000);
}

function speak(text){if(localStorage.getItem('askLovelyRitaV4_mute')==='1'||!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=0.92;u.pitch=1.1;const v=window.speechSynthesis.getVoices();const voice=v.find(x=>x.lang==='en-GB'&&/female|woman/i.test(x.name))||v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang.startsWith('en'));if(voice)u.voice=voice;window.speechSynthesis.speak(u);}
function saveLadBC(amount){const lad=localStorage.getItem('askLovelyRitaV4_chosen_lad')||'smart';const k='askLovelyRitaV4_bc_'+lad;localStorage.setItem(k,Number(localStorage.getItem(k)||0)+amount);const t=Number(localStorage.getItem('askLovelyRitaV4_bc')||25000);localStorage.setItem('askLovelyRitaV4_bc',t+amount);}
function saveEBC(amount){const cur=Number(localStorage.getItem('lra_ebc_balance')||0);localStorage.setItem('lra_ebc_balance',cur+amount);}
function postGlobalScore(amount){const lad=localStorage.getItem('askLovelyRitaV4_chosen_lad')||'smart';fetch('https://empty-leaf-6e4b.alexmonteironeto.workers.dev/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lad,amount})}).catch(()=>{});}
function goBack(){window.location.href='page10_rita.html';}
function goHome(){window.location.href='page1_landing.html';}
function goChooseWorld(){const lv=localStorage.getItem('askLovelyRitaV4_level')||'youngsters';localStorage.setItem('lra_current_world','rita');localStorage.setItem('lra_shop_visit','1');window.location.href='page_shop.html?world=rita&visit=1&level='+lv;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',3000);}

window.addEventListener('load',()=>{
  disablePads(true);
  document.getElementById('bc-display').textContent=Number(localStorage.getItem('askLovelyRitaV4_bc')||25000).toLocaleString();
  const go=()=>{speak("Welcome to Tap the Beat love! Watch Rita play and then copy the melody!");setTimeout(startRound,2500);};
  if(window.speechSynthesis.getVoices().length>0)go();
  else window.speechSynthesis.onvoiceschanged=go;
});
</script>
<!-- ADMIN TEST NAV -->
<div id="admin-nav" style="position:fixed;top:4px;right:4px;z-index:9999;display:flex;gap:4px;opacity:0.4;">
  <button onclick="history.back()" style="background:#333;border:none;color:#fff;padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;">◀ Back</button>
  <button onclick="document.getElementById('admin-nav').style.opacity=document.getElementById('admin-nav').style.opacity>'0.5'?'0.15':'1'" style="background:#555;border:none;color:#fff;padding:4px 6px;border-radius:6px;font-size:9px;cursor:pointer;">👁</button>
</div>
</body>
</html>
