<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Lovely Rita — VW Beetle Match</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a14;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
  }

  /* ── DEVICE BAR ── */
  #device-bar {
    display: flex; gap: 8px; margin-bottom: 16px;
    flex-wrap: wrap; justify-content: center;
  }
  #device-bar button {
    background: #1a1a2e; border: 1px solid #333; color: #aaa;
    padding: 6px 12px; border-radius: 20px; font-size: 11px;
    cursor: pointer; transition: all .2s;
  }
  #device-bar button:hover, #device-bar button.active {
    background: #333; color: #fff; border-color: #666;
  }

  /* ── PHONE ── */
  #phone-outer {
    background: #1c1c1c; border-radius: 50px; padding: 12px;
    box-shadow: 0 0 0 2px #333, 0 20px 60px rgba(0,0,0,.8);
  }
  #phone {
    width: 369px; height: 828px; border-radius: 40px;
    overflow: hidden; position: relative;
    display: flex; flex-direction: column;
    transition: background .4s, width .3s, height .3s;
  }
  #notch {
    position: absolute; top: 0; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 30px; background: #1c1c1c;
    border-radius: 0 0 20px 20px; z-index: 20;
  }
  #scroll-area {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 36px 12px 8px; scrollbar-width: none;
  }
  #scroll-area::-webkit-scrollbar { display: none; }

  /* ── NAV BAR ── */
  #nav-bar {
    flex-shrink: 0; display: flex; align-items: center;
    justify-content: space-around; padding: 8px 20px 12px;
    border-top: 1px solid rgba(255,255,255,.08);
    background: rgba(0,0,0,.4); backdrop-filter: blur(10px);
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; background: none; border: none;
    color: rgba(255,255,255,.5); cursor: pointer;
    padding: 5px 14px; border-radius: 12px;
    transition: all .2s; font-size: 10px;
  }
  .nav-btn:hover { background: rgba(255,255,255,.08); color:#fff; }
  .nav-btn .nav-icon { font-size: 20px; line-height: 1; }
  .nav-btn.nav-home { color: var(--accent); }
  .nav-btn.nav-home .nav-icon { color: var(--accent); }

  /* ══ TEMAS ══ */
  body.theme-youngsters #phone { background: #1a0040; }
  body.theme-youngsters {
    --accent: #ff6ef7; --accent2: #ffde59;
    --btn-grad: linear-gradient(135deg,#ff6ef7,#a855f7); --glow: #ff6ef7;
  }
  body.theme-grownups #phone { background: #0d0d1e; }
  body.theme-grownups {
    --accent: #c8a96e; --accent2: #e8d5b0;
    --btn-grad: linear-gradient(135deg,#c8a96e,#6677aa); --glow: #c8a96e;
  }
  body.theme-experts #phone { background: #050510; }
  body.theme-experts {
    --accent: #ffd700; --accent2: #ffd700;
    --btn-grad: linear-gradient(135deg,#ffd700,#c8860a); --glow: #ffd700;
  }

  /* ── HEADER ── */
  #vw-header { text-align: center; margin-bottom: 8px; }
  #vw-header h1 {
    font-size: 18px; font-weight: 900; letter-spacing: 2px;
    color: var(--accent); text-shadow: 0 0 18px var(--glow);
    text-transform: uppercase;
  }
  #vw-header p { font-size: 10px; color: rgba(255,255,255,.35); margin-top: 2px; }

  /* ── LEVEL TABS ── */
  #level-tabs { display: flex; gap: 5px; justify-content: center; margin-bottom: 8px; }
  #level-tabs button {
    padding: 4px 10px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.05); color: rgba(255,255,255,.5);
    font-size: 9px; font-weight: 700; cursor: pointer;
    transition: all .2s; text-transform: uppercase;
  }
  #level-tabs button.active {
    background: var(--btn-grad); border-color: transparent; color: #fff;
  }

  /* ── STATUS BAR ── */
  #status-bar { display: flex; gap: 8px; margin-bottom: 8px; }
  .status-card {
    flex: 1; background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 10px; padding: 5px 10px;
  }
  .status-label { font-size: 8px; color: rgba(255,255,255,.3); text-transform: uppercase; letter-spacing:.5px; }
  .status-value { font-size: 15px; font-weight: 900; }
  #bc-val { color: #ffde59; }
  #timer-val { color: var(--accent); }
  #timer-card { display: none; }

  /* ── GARAGES ── */
  #garages {
    display: flex; gap: 5px; justify-content: center; margin-bottom: 10px;
  }
  .garage {
    width: 78px; background: rgba(255,255,255,.05);
    border: 2px dashed rgba(255,255,255,.18);
    border-radius: 14px; padding: 6px 4px;
    display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    transition: border-color .25s, background .25s, transform .2s;
    min-height: 108px; position: relative;
  }
  .garage.drag-over {
    border-color: var(--accent); background: rgba(255,255,255,.1);
    transform: scale(1.05); border-style: solid;
  }
  .garage.correct {
    border-color: #4ade80; background: rgba(74,222,128,.1); border-style: solid;
  }
  .garage.wrong { border-color: #f87171; animation: shake .35s ease; }
  @keyframes shake {
    0%,100% { transform:translateX(0); }
    25%      { transform:translateX(-5px); }
    75%      { transform:translateX(5px); }
  }
  .garage-lad {
    width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid var(--accent); box-shadow: 0 0 8px var(--glow);
    background: rgba(255,255,255,.1); overflow: hidden;
    display: flex; align-items:center; justify-content:center; font-size:20px;
  }
  .garage-lad img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .garage-lad-name { font-size: 9px; font-weight: 700; color: var(--accent); text-align:center; }
  .garage-slot {
    width: 60px; height: 40px; border-radius: 8px;
    background: rgba(255,255,255,.04);
    border: 1px dashed rgba(255,255,255,.1);
    display: flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .garage-slot img { width:100%; height:100%; object-fit:contain; }
  .garage-check {
    font-size: 16px; display: none;
    animation: popIn .3s ease;
  }
  @keyframes popIn {
    0%   { transform:scale(0); }
    70%  { transform:scale(1.3); }
    100% { transform:scale(1); }
  }

  /* ── CARS AREA ── */
  #cars-label {
    font-size: 10px; color: rgba(255,255,255,.32); text-align:center;
    letter-spacing:.5px; text-transform:uppercase; margin-bottom:6px;
  }
  #cars-area {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center; margin-bottom: 10px; min-height: 60px;
  }
  .vw-car {
    width: 68px; height: 48px; cursor: grab;
    user-select: none; -webkit-user-select: none; touch-action: none;
    display: flex; align-items:center; justify-content:center;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.5));
    transition: transform .15s, opacity .3s;
  }
  .vw-car:hover { transform: scale(1.1) translateY(-2px); }
  .vw-car.dragging { opacity: .45; transform: scale(1.1); }
  .vw-car.placed { opacity: 0; pointer-events: none; }
  .vw-car img { width:100%; height:100%; object-fit:contain; pointer-events:none; }

  /* ── DRAG GHOST ── */
  #drag-ghost {
    position: fixed; pointer-events: none; z-index: 999;
    width: 72px; height: 52px; display: none;
    filter: drop-shadow(0 8px 20px rgba(0,0,0,.7));
  }
  #drag-ghost img { width:100%; height:100%; object-fit:contain; }

  /* ── ACTION BTNS ── */
  #action-btns { display: flex; gap: 8px; margin-bottom: 8px; }
  .action-btn {
    flex:1; padding: 10px; border: none; border-radius: 28px;
    font-size: 12px; font-weight: 800; letter-spacing:.5px;
    text-transform: uppercase; cursor: pointer;
    transition: transform .15s, opacity .3s;
    position: relative; overflow: hidden;
  }
  .action-btn::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.14),transparent);
    border-radius:inherit;
  }
  .action-btn:hover:not(:disabled) { transform:scale(1.03); }
  .action-btn:disabled { opacity:.38; cursor:not-allowed; }
  #play-btn { background:var(--btn-grad); color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.4),0 0 12px var(--glow); }
  #next-btn { background:rgba(255,255,255,.07); border:1px solid var(--accent); color:var(--accent); display:none; }

  /* ── RESULT PANEL ── */
  #result-panel {
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09);
    border-radius: 14px; padding: 10px; margin-bottom: 8px;
    text-align:center; display:none; flex-direction:column;
    align-items:center; gap:4px; animation: slideIn .4s ease;
  }
  #result-panel.show { display:flex; }
  @keyframes slideIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
  #result-icon { font-size:26px; }
  #result-title { font-size:14px; font-weight:800; color:var(--accent); }
  #result-sub { font-size:10px; color:rgba(255,255,255,.45); }
  #result-pts { font-size:20px; font-weight:900; }

  /* ── RITA BOTTOM SECTION ── */
  #rita-section {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 0;
    margin-top: 4px;
    min-height: 130px;
  }

  /* Rita image */
  #rita-img-wrap {
    position: relative;
    width: 90px;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  #rita-img {
    width: 88px;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.6));
    transition: transform .3s ease;
  }
  #rita-img.wave {
    animation: rita-wave 0.6s ease-in-out infinite alternate;
    transform-origin: bottom center;
  }
  @keyframes rita-wave {
    0%   { transform: rotate(-4deg) translateY(0); }
    100% { transform: rotate(4deg) translateY(-4px); }
  }

  /* Checkered flag */
  #flag-wrap {
    position: absolute;
    top: -10px;
    right: -18px;
    width: 44px;
    height: 34px;
    display: none;
  }
  #flag-wrap.show { display: block; }
  #flag-canvas {
    width: 100%; height: 100%;
  }
  #flag-pole {
    position: absolute;
    left: 0; top: 0;
    width: 3px; height: 44px;
    background: linear-gradient(180deg, #ccc, #888);
    border-radius: 2px;
  }

  /* Rita speech bubble (bottom) */
  #rita-bubble-bottom {
    flex: 1;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 14px 14px 14px 4px;
    padding: 9px 10px;
    margin-bottom: 14px;
    position: relative;
  }
  #rita-bubble-bottom::before {
    content: '';
    position: absolute;
    left: -8px; bottom: 18px;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-right: 8px solid rgba(255,255,255,.13);
  }
  #rita-name-bottom {
    font-size: 9px; font-weight:700; color:var(--accent);
    text-transform:uppercase; letter-spacing:.8px; margin-bottom:3px;
  }
  #rita-text-bottom {
    font-size: 11px; color: rgba(255,255,255,.78); line-height:1.5;
  }
  #rita-speak-btn {
    position: absolute; top: 7px; right: 7px;
    background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
    border-radius:50%; width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; cursor:pointer; color:#fff; transition:all .2s;
  }
  #rita-speak-btn:hover { background:rgba(255,255,255,.2); }

  /* Rita face pulse while speaking */
  #rita-img.speaking {
    filter: drop-shadow(0 0 12px var(--glow)) drop-shadow(0 4px 12px rgba(0,0,0,.6));
  }

  /* ── CELEBRATE ── */
  #celebrate {
    position:absolute; inset:0; pointer-events:none;
    z-index:20; overflow:hidden; border-radius:40px;
  }
  .cp {
    position:absolute; border-radius:2px;
    animation:cf 1.5s ease-out forwards;
  }
  @keyframes cf {
    0%   { transform:translateY(-20px) rotate(0deg); opacity:1; }
    100% { transform:translateY(900px) rotate(720deg); opacity:0; }
  }

  /* ── TOAST ── */
  #toast {
    position:fixed; bottom:30px; left:50%;
    transform:translateX(-50%) translateY(80px);
    background:rgba(20,20,40,.95); border:1px solid var(--accent,#ff6ef7);
    border-radius:20px; padding:9px 18px; font-size:12px; color:#fff;
    z-index:1000; transition:transform .3s,opacity .3s;
    opacity:0; white-space:nowrap; pointer-events:none;
  }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body class="theme-youngsters">

<div id="drag-ghost"><img id="ghost-img" src="" alt=""/></div>

<div id="device-bar">
  <button onclick="setDevice(393,852,'iPhone 14 Pro')" class="active">iPhone 14 Pro</button>
  <button onclick="setDevice(375,667,'iPhone SE')">iPhone SE</button>
  <button onclick="setDevice(360,800,'Galaxy S23')">Galaxy S23</button>
  <button onclick="setDevice(412,915,'Pixel 7')">Pixel 7</button>
  <button onclick="setDevice(430,932,'iPhone 14 Max')">iPhone 14 Max</button>
</div>

<div id="phone-outer">
  <div id="phone">
    <div id="notch"></div>
    <div id="celebrate"></div>

    <div id="scroll-area">

      <!-- HEADER -->
      <div id="vw-header">
        <h1>VW Beetle Match</h1>
        <p>Match each Lad with their own car!</p>
      </div>

      <!-- LEVEL TABS -->
      <div id="level-tabs">
        <button onclick="setLevel('youngsters')" class="active">🟣 Youngsters</button>
        <button onclick="setLevel('grownups')">🟡 Grown Ups</button>
        <button onclick="setLevel('experts')">⭐ Experts</button>
      </div>

      <!-- STATUS -->
      <div id="status-bar">
        <div class="status-card" id="timer-card">
          <div class="status-label">Time Left</div>
          <div class="status-value" id="timer-val">30</div>
        </div>
      </div>

      <!-- GARAGES -->
      <div id="garages"></div>

      <!-- CARS -->
      <div id="cars-label">Drag each Lad to their own car!</div>
      <div id="cars-area"></div>

      <!-- ACTION BTNS -->
      <div id="action-btns">
        <button class="action-btn" id="play-btn" onclick="startGame()">Start Matching!</button>
        <button class="action-btn" id="next-btn" onclick="nextGame()">Continue to Question ♪</button>
      </div>

      <!-- RESULT -->
      <div id="result-panel">
        <div id="result-icon">🏁</div>
        <div id="result-title"></div>
        <div id="result-sub"></div>
        <div id="result-pts"></div>
      </div>

      <!-- RITA BOTTOM -->
      <div id="rita-section">
        <div id="rita-img-wrap">
          <img id="rita-img"
            src="https://alexmonteiro65.github.io/ask-lovely-rita/src/rita_beatcorps_clean.png"
            alt="Lovely Rita"
            onerror="this.style.display='none'"/>
          <div id="flag-wrap">
            <div id="flag-pole"></div>
            <canvas id="flag-canvas" width="44" height="34"></canvas>
          </div>
        </div>
        <div id="rita-bubble-bottom">
          <div id="rita-name-bottom">♪ Lovely Rita</div>
          <div id="rita-text-bottom">Loading...</div>
          <button id="rita-speak-btn" onclick="ritaSpeak()">🔊</button>
        </div>
      </div>

    </div><!-- /scroll-area -->

    <!-- NAV BAR -->
    <nav id="nav-bar">
      <button class="nav-btn" onclick="goBack()">
        <span class="nav-icon">◀️</span><span>Back</span>
      </button>
      <button class="nav-btn nav-home" onclick="goHome()">
        <span class="nav-icon">🏠</span><span>Home</span>
      </button>
      <button class="nav-btn" onclick="goForward()">
        <span class="nav-icon">▶️</span><span>Next</span>
      </button>
    </nav>

  </div>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════
//  CONFIG
// ════════════════════════════════

const BASE = 'https://alexmonteiro65.github.io/ask-lovely-rita/src/';

const LADS = [
  { key:'smart', name:'Smart', vw:'https://alexmonteiro65.github.io/ask-lovely-rita/src/lenny_vw_transparent.png', emoji:'🎸' },
  { key:'cute',  name:'Cute',  vw:'https://alexmonteiro65.github.io/ask-lovely-rita/src/macca_vw_transparent.png', emoji:'🎵' },
  { key:'quiet', name:'Quiet', vw:'https://alexmonteiro65.github.io/ask-lovely-rita/src/harry_vw_transparent.png', emoji:'🪕' },
  { key:'funny', name:'Funny', vw:'https://alexmonteiro65.github.io/ask-lovely-rita/src/billy_vw_transparent.png', emoji:'🥁' },
];

const LAD_IMG = {
  smart:  { regular:'https://alexmonteiro65.github.io/ask-lovely-rita/src/lad-smart-regular.png', pepper:'https://alexmonteiro65.github.io/ask-lovely-rita/src/lad-smart-regular.png', abbey:'https://alexmonteiro65.github.io/ask-lovely-rita/src/lad-smart-abbey.png' },
  cute:   { regular:'https://alexmonteiro65.github.io/ask-lovely-rita/src/lad-cute-regular.png',  pepper:'https://alexmonteiro65.github.io/ask-lovely-rita/src/lad-cute-regular.png',  abbey:'https://alexmonteiro65.github.io/ask-lovely-rita/src/lad-cute-abbey.png'  },
  quiet:  { regular:'https://alexmonteiro65.github.io/ask-lovely-rita/src/lad-quiet-regular.png', pepper:'https://alexmonteiro65.github.io/ask-lovely-rita/src/lad-quiet-pepper.png',  abbey:'https://alexmonteiro65.github.io/ask-lovely-rita/src/lad-quiet-abbey.png' },
  funny:  { regular:'https://alexmonteiro65.github.io/ask-lovely-rita/src/lad-funny-regular.png', pepper:'https://alexmonteiro65.github.io/ask-lovely-rita/src/lad-funny-regular.png', abbey:'https://alexmonteiro65.github.io/ask-lovely-rita/src/lad-funny-abbey.png' },
};

const LEVEL_CFG = {
  youngsters: { timer:0,  perCar:20, bonus:50,  suffix:'regular', label:'Youngsters' },
  grownups:   { timer:30, perCar:20, bonus:50,  suffix:'pepper',  label:'Grown Ups'  },
  experts:    { timer:15, perCar:20, bonus:100, suffix:'abbey',   label:'Experts'    },
};

// Rita speech — no commas on short phrases
const RITA_INTRO = {
  youngsters: "Welcome love! Choose your level then click Start Matching to play! Take your time darling. No rush at all!",
  grownups:   "Welcome love! Choose your level then click Start Matching to play! You have got 30 seconds love. Think fast!",
  experts:    "Welcome love! Choose your level then click Start Matching to play! Only 15 seconds on the clock. Are you ready?",
};
const RITA_GO = {
  youngsters: "Go! Match each Lad with their own car love! Drag them to the right spot!",
  grownups:   "Go! Match each Lad with their car! The clock is ticking love!",
  experts:    "Go go go! Match each Lad with their car as fast as you can love!",
};
const RITA_INTRO_DISPLAY = {
  youngsters: "Hello love! 🚗 Each Lad has his own Beetle. Drag each car to the right garage! Take your time darling — no rush at all!",
  grownups:   "Hello there! 🚗 You've got 30 seconds to drag each VW to the right Lad's garage. Think fast and think smart!",
  experts:    "Right then! ⭐ Only 15 seconds! Match all four Beetles to their Lads as fast as you can. Go go go!",
};
const RITA_WIN_ALL = [
  "Absolutely smashing! All four Beetles parked perfectly! The Fab Four would give you a standing ovation!",
  "Brilliant! Every single Beetle in the right garage! You know your Lads as well as Abbey Road knows its crosswalk!",
  "Wonderful! Perfect score! George Harrison once said the best things come to those who pay attention. And you certainly did!",
];
const RITA_WIN_PARTIAL = [
  "Well done! Not a perfect run but you got most of them right. Keep practising darling and you will be a Fab Four expert in no time!",
  "Good effort love! A few Beetles found the wrong garage but most made it home safely. Have another go!",
];
const RITA_LOSE = [
  "Oh never mind! The Beetles can be tricky little cars. No points lost. Have another go and show them who is boss!",
  "Not quite this time darling! But chin up. No penalty here. Just try again and park those Beetles properly!",
];
const RITA_GO = "Go! Drag the Beetles to their garages!";

// ════════════════════════════════
//  STATE
// ════════════════════════════════

let S = {
  level: 'youngsters',
  beatcoins: 80,
  gameActive: false,
  placed: {},
  correct: 0,
  timerInterval: null,
  timeLeft: 0,
  dragKey: null,
  flagAnim: null,
};

// ════════════════════════════════
//  STORAGE
// ════════════════════════════════

function loadStorage() {
  try {
    const d = JSON.parse(localStorage.getItem('askLovelyRitaV4')||'{}');
    if (d.theme && LEVEL_CFG[d.theme]) S.level = d.theme;
    if (typeof d.beatcoins==='number') S.beatcoins = d.beatcoins;
  } catch(e) {}
}
function saveStorage() {
  try {
    const d = JSON.parse(localStorage.getItem('askLovelyRitaV4')||'{}');
    d.beatcoins = S.beatcoins;
    localStorage.setItem('askLovelyRitaV4', JSON.stringify(d));
  } catch(e) {}
}

// ════════════════════════════════
//  INIT
// ════════════════════════════════

function init() {
  loadStorage();
  applyLevel(S.level);
  highlightTab(S.level);
  setTimeout(() => speak(RITA_INTRO[S.level]), 800);
}

// ════════════════════════════════
//  LEVEL
// ════════════════════════════════

function setLevel(lvl) {
  S.level = lvl;
  stopTimer();
  stopFlag();
  window.speechSynthesis && window.speechSynthesis.cancel();
  applyLevel(lvl);
  highlightTab(lvl);
  setTimeout(() => speak(RITA_INTRO[lvl]), 400);
}

function highlightTab(lvl) {
  document.querySelectorAll('#level-tabs button').forEach(b => {
    b.classList.toggle('active',
      (lvl==='youngsters'&&b.textContent.includes('Young'))||
      (lvl==='grownups'&&b.textContent.includes('Grown'))||
      (lvl==='experts'&&b.textContent.includes('Expert'))
    );
  });
}

function applyLevel(lvl) {
  const cfg = LEVEL_CFG[lvl];
  document.body.className = `theme-${lvl}`;
  document.getElementById('rita-text-bottom').textContent = RITA_INTRO_DISPLAY[lvl];
  document.getElementById('bc-val').textContent = S.beatcoins;

  // Rita image — use Beat Corps (abbey) image always for Rita
  document.getElementById('rita-img').src = BASE + 'https://alexmonteiro65.github.io/ask-lovely-rita/src/rita_beatcorps_clean.png';

  // Timer
  const tc = document.getElementById('timer-card');
  tc.style.display = cfg.timer > 0 ? 'block' : 'none';
  document.getElementById('timer-val').textContent = cfg.timer;

  buildGarages(cfg.suffix);
  buildCars();
  resetUI();
}

// ════════════════════════════════
//  BUILD GARAGES
// ════════════════════════════════

function buildGarages(suffix) {
  const container = document.getElementById('garages');
  container.innerHTML = '';
  LADS.forEach(lad => {
    const el = document.createElement('div');
    el.className = 'garage';
    el.dataset.key = lad.key;
    el.innerHTML = `
      <div class="garage-lad">
        <img src="${lad.vw}" alt="${lad.name} VW"
          onerror="this.style.display='none';this.parentElement.textContent='🚗'"/>
      </div>
      <div class="garage-lad-name">${lad.name}</div>
      <div class="garage-slot" id="slot-${lad.key}"></div>
      <div class="garage-check" id="check-${lad.key}">✅</div>
    `;
    el.addEventListener('dragover',  onDragOver);
    el.addEventListener('dragleave', onDragLeave);
    el.addEventListener('drop',      onDrop);
    container.appendChild(el);
  });
}

// ════════════════════════════════
//  BUILD CARS
// ════════════════════════════════

function buildCars() {
  const area = document.getElementById('cars-area');
  area.innerHTML = '';
  const cfg = LEVEL_CFG[S.level];
  const shuffled = [...LADS].sort(() => Math.random() - .5);
  shuffled.forEach(lad => {
    const el = document.createElement('div');
    el.className = 'vw-car';
    el.dataset.key = lad.key;
    el.id = `car-${lad.key}`;
    el.draggable = true;
    const ladImg = LAD_IMG[lad.key][cfg.suffix];
    el.innerHTML = `<img src="${BASE}${ladImg}" alt="${lad.name}"
      onerror="this.parentElement.style.cssText='background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px';this.parentElement.innerHTML='${lad.emoji}'"/>`;
    el.addEventListener('dragstart', onDragStart);
    el.addEventListener('dragend',   onDragEnd);
    el.addEventListener('pointerdown', onPointerDown);
    area.appendChild(el);
  });
}

// ════════════════════════════════
//  DESKTOP DRAG
// ════════════════════════════════

function onDragStart(e) {
  if (!S.gameActive) { e.preventDefault(); return; }
  S.dragKey = e.currentTarget.dataset.key;
  e.dataTransfer.setData('text/plain', S.dragKey);
  setTimeout(() => e.currentTarget.classList.add('dragging'), 0);
}
function onDragEnd(e) { e.currentTarget.classList.remove('dragging'); }
function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function onDrop(e) {
  e.preventDefault();
  const garage = e.currentTarget;
  garage.classList.remove('drag-over');
  const key = e.dataTransfer.getData('text/plain') || S.dragKey;
  if (key) handlePlace(key, garage.dataset.key);
}

// ════════════════════════════════
//  TOUCH / POINTER DRAG
// ════════════════════════════════

function onPointerDown(e) {
  if (!S.gameActive) return;
  const car = e.currentTarget;
  if (car.classList.contains('placed')) return;
  e.preventDefault();
  S.dragKey = car.dataset.key;
  const ghost = document.getElementById('drag-ghost');
  const src = car.querySelector('img');
  if (src) document.getElementById('ghost-img').src = src.src;
  ghost.style.display = 'block';
  moveGhost(e.clientX, e.clientY);
  car.classList.add('dragging');
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup',   onPointerUp);
}
function onPointerMove(e) {
  moveGhost(e.clientX, e.clientY);
  clearGarageHL();
  const g = garageAt(e.clientX, e.clientY);
  if (g) g.classList.add('drag-over');
}
function onPointerUp(e) {
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerup',   onPointerUp);
  document.getElementById('drag-ghost').style.display = 'none';
  clearGarageHL();
  const car = document.getElementById(`car-${S.dragKey}`);
  if (car) car.classList.remove('dragging');
  const g = garageAt(e.clientX, e.clientY);
  if (g && S.dragKey) handlePlace(S.dragKey, g.dataset.key);
  S.dragKey = null;
}
function moveGhost(x, y) {
  const g = document.getElementById('drag-ghost');
  g.style.left = (x-36)+'px'; g.style.top = (y-24)+'px';
}
function clearGarageHL() {
  document.querySelectorAll('.garage').forEach(g => g.classList.remove('drag-over'));
}
function garageAt(x, y) {
  for (const g of document.querySelectorAll('.garage')) {
    const r = g.getBoundingClientRect();
    if (x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) return g;
  }
  return null;
}

// ════════════════════════════════
//  HANDLE PLACE
// ════════════════════════════════

function handlePlace(carKey, garageKey) {
  if (S.placed[garageKey]) return;
  if (Object.values(S.placed).includes(carKey)) return;
  const isCorrect = carKey === garageKey;
  const garage = document.querySelector(`.garage[data-key="${garageKey}"]`);
  const car = document.getElementById(`car-${carKey}`);
  if (isCorrect) {
    S.placed[garageKey] = carKey;
    garage.classList.add('correct');
    const lad = LADS.find(l => l.key===carKey);
    document.getElementById(`slot-${garageKey}`).innerHTML =
      `<img src="${BASE}${lad.vw}" alt="${lad.name} VW"/>`;
    document.getElementById(`check-${garageKey}`).style.display = 'block';
    car.classList.add('placed');
    S.correct++;
    toast(`✅ ${lad.name}'s Beetle is home!`);
    if (S.correct === 4) finishGame('perfect');
  } else {
    garage.classList.add('wrong');
    setTimeout(() => garage.classList.remove('wrong'), 400);
    toast(`❌ That's not the right garage!`);
  }
}

// ════════════════════════════════
//  GAME FLOW
// ════════════════════════════════

function ritaSpeakText(text) {
  const el = document.getElementById('rita-text-bottom');
  if(el) el.textContent = text;
  speak(text);
}

function startGame() {
  S.gameActive = true;
  S.placed = {}; S.correct = 0;
  ritaSpeakText(RITA_GO[S.level]);
  document.getElementById('play-btn').style.display = 'none';
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('next-btn').style.display = 'none';
  document.querySelectorAll('.garage').forEach(g => g.classList.remove('correct','wrong'));
  document.querySelectorAll('.garage-slot').forEach(s => s.innerHTML='');
  document.querySelectorAll('.garage-check').forEach(c => c.style.display='none');
  buildCars();

  // Wave flag!
  startFlag();
  document.getElementById('rita-img').classList.add('wave');
  setTimeout(() => {
    document.getElementById('rita-img').classList.remove('wave');
    stopFlag();
  }, 3000);

  const cfg = LEVEL_CFG[S.level];
  if (cfg.timer > 0) {
    S.timeLeft = cfg.timer;
    document.getElementById('timer-val').textContent = S.timeLeft;
    S.timerInterval = setInterval(() => {
      S.timeLeft--;
      document.getElementById('timer-val').textContent = S.timeLeft;
      if (S.timeLeft <= 0) { stopTimer(); finishGame('timeout'); }
    }, 1000);
  }
  speak(RITA_GO);
}

function stopTimer() {
  if (S.timerInterval) { clearInterval(S.timerInterval); S.timerInterval = null; }
}

function finishGame(reason) {
  stopTimer();
  stopFlag();
  document.getElementById('rita-img').classList.remove('wave');
  S.gameActive = false;

  const cfg = LEVEL_CFG[S.level];
  const panel = document.getElementById('result-panel');
  let earned = 0; let ritaLine = '';

  if (reason === 'perfect' || (reason === 'timeout' && S.correct === 4)) {
    earned = S.correct * cfg.perCar + cfg.bonus;
    setResult('🏆','Perfect Match!','All 4 Beetles parked correctly!',`+${earned} BeatCoins!`,'#4ade80');
    ritaLine = pick(RITA_WIN_ALL);
    celebrate();
  } else if (S.correct > 0) {
    earned = S.correct * cfg.perCar;
    setResult('🚗',`${S.correct} out of 4!`,`${4-S.correct} Beetles didn't make it home.`,`+${earned} BeatCoins`,'#fbbf24');
    ritaLine = pick(RITA_WIN_PARTIAL);
  } else {
    setResult('🚧',"Time's Up!",'No Beetles parked — no points lost either!','+0 BeatCoins','rgba(255,255,255,.35)');
    ritaLine = pick(RITA_LOSE);
  }

  S.beatcoins += earned;
  document.getElementById('bc-val').textContent = S.beatcoins;
  saveStorage();
  panel.classList.add('show');
  document.getElementById('next-btn').style.display = 'block';
  setTimeout(() => speak(ritaLine), 500);
  setTimeout(() => document.getElementById('scroll-area').scrollTo({top:9999,behavior:'smooth'}), 300);
}

function setResult(icon, title, sub, pts, color) {
  document.getElementById('result-icon').textContent  = icon;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-sub').textContent   = sub;
  const p = document.getElementById('result-pts');
  p.textContent = pts; p.style.color = color;
}

function resetUI() {
  S.gameActive = false; S.placed = {}; S.correct = 0;
  stopTimer(); stopFlag();
  document.getElementById('rita-img').classList.remove('wave');
  document.getElementById('play-btn').style.display = 'block';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('result-panel').classList.remove('show');
  document.querySelectorAll('.garage').forEach(g=>g.classList.remove('correct','wrong'));
  document.querySelectorAll('.garage-slot').forEach(s=>s.innerHTML='');
  document.querySelectorAll('.garage-check').forEach(c=>c.style.display='none');
}

function nextGame() { toast('🎵 Off to the question! Coming soon...'); }

// ════════════════════════════════
//  CHECKERED FLAG ANIMATION
// ════════════════════════════════

function startFlag() {
  const wrap = document.getElementById('flag-wrap');
  wrap.classList.add('show');
  const canvas = document.getElementById('flag-canvas');
  const ctx = canvas.getContext('2d');
  let offset = 0;
  function drawFlag() {
    ctx.clearRect(0,0,44,34);
    const sq = 7;
    for (let row = 0; row < 5; row++) {
      for (let col = 0; col < 7; col++) {
        const wave = Math.sin((col + offset) * 0.5) * 2;
        const isBlack = (row + col) % 2 === 0;
        ctx.fillStyle = isBlack ? '#111' : '#eee';
        ctx.fillRect(col*sq, row*sq + wave, sq, sq);
      }
    }
    offset += 0.15;
  }
  drawFlag();
  S.flagAnim = setInterval(drawFlag, 40);
}

function stopFlag() {
  if (S.flagAnim) { clearInterval(S.flagAnim); S.flagAnim = null; }
  document.getElementById('flag-wrap').classList.remove('show');
}

// ════════════════════════════════
//  NAVIGATION
// ════════════════════════════════

function goBack()    { window.location.href = 'page3_turntable.html'; }
function goHome()    { window.location.href = 'page1_landing.html'; }
function goForward() { window.location.href = 'page5_worlds.html'; }

// ════════════════════════════════
//  RITA VOICE
// ════════════════════════════════

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=0.9; u.pitch=1.1;
  const voices = window.speechSynthesis.getVoices();
  const brit = voices.find(v=>v.lang==='en-GB'&&v.name.toLowerCase().includes('female'))
            || voices.find(v=>v.lang==='en-GB')
            || voices.find(v=>v.lang.startsWith('en'));
  if (brit) u.voice = brit;
  const img = document.getElementById('rita-img');
  img.classList.add('speaking');
  u.onend = () => img.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}
function ritaSpeak() { speak(RITA_INTRO[S.level]); }
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// ════════════════════════════════
//  CELEBRATE
// ════════════════════════════════

function celebrate() {
  const layer = document.getElementById('celebrate');
  layer.innerHTML = '';
  const cols = ['#ff6ef7','#ffde59','#a855f7','#4ade80','#fbbf24','#60a5fa','#fff'];
  for (let i=0;i<45;i++) {
    const el = document.createElement('div');
    el.className='cp';
    el.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*20}%;background:${cols[Math.floor(Math.random()*cols.length)]};animation-delay:${Math.random()*.7}s;animation-duration:${1.2+Math.random()*.9}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'};`;
    layer.appendChild(el);
  }
  setTimeout(()=>layer.innerHTML='',2800);
}

// ════════════════════════════════
//  TOAST
// ════════════════════════════════

let toastT;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('show'),3000);
}

// ════════════════════════════════
//  DEVICE + HELPERS
// ════════════════════════════════

function setDevice(w,h,name) {
  const p=document.getElementById('phone');
  p.style.width=w+'px'; p.style.height=h+'px';
  document.querySelectorAll('#device-bar button').forEach(b=>
    b.classList.toggle('active',b.textContent===name));
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

init();
</script>
