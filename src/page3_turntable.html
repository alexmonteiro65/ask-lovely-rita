<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Lovely Rita — The Turntable</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a14;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
  }

  /* ── DEVICE BAR ── */
  #device-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #device-bar button {
    background: #1a1a2e;
    border: 1px solid #333;
    color: #aaa;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 11px;
    cursor: pointer;
    transition: all .2s;
  }
  #device-bar button:hover, #device-bar button.active {
    background: #333; color: #fff; border-color: #666;
  }

  /* ── PHONE ── */
  #phone-outer {
    background: #1c1c1c;
    border-radius: 50px;
    padding: 12px;
    box-shadow: 0 0 0 2px #333, 0 20px 60px rgba(0,0,0,.8);
  }
  #phone {
    width: 369px;
    height: 828px;
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    transition: background .4s;
  }
  #notch {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 30px;
    background: #1c1c1c;
    border-radius: 0 0 20px 20px;
    z-index: 10;
  }

  /* ── SCROLL AREA ── */
  #scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 38px 14px 10px;
    scrollbar-width: none;
  }
  #scroll-area::-webkit-scrollbar { display: none; }

  /* ── NAV BAR (fixed bottom inside phone) ── */
  #nav-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px 20px 14px;
    border-top: 1px solid rgba(255,255,255,.08);
    background: rgba(0,0,0,.35);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .nav-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    color: rgba(255,255,255,.5);
    cursor: pointer;
    padding: 6px 14px;
    border-radius: 12px;
    transition: all .2s;
    font-size: 10px;
    letter-spacing: .3px;
  }
  .nav-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
  .nav-btn .nav-icon { font-size: 20px; line-height: 1; }
  .nav-btn.nav-home .nav-icon { color: var(--accent); }
  .nav-btn.nav-home { color: var(--accent); }

  /* ══ TEMAS ══ */
  body.theme-youngsters #phone { background: #1a0040; }
  body.theme-youngsters {
    --accent: #ff6ef7; --accent2: #ffde59;
    --btn-grad: linear-gradient(135deg,#ff6ef7,#a855f7);
    --glow: #ff6ef7;
  }
  body.theme-grownups #phone { background: #0d0d1e; }
  body.theme-grownups {
    --accent: #c8a96e; --accent2: #e8d5b0;
    --btn-grad: linear-gradient(135deg,#c8a96e,#6677aa);
    --glow: #c8a96e;
  }
  body.theme-experts #phone { background: #050510; }
  body.theme-experts {
    --accent: #ffd700; --accent2: #ffd700;
    --btn-grad: linear-gradient(135deg,#ffd700,#c8860a);
    --glow: #ffd700;
  }

  /* ── HEADER ── */
  #tt-header {
    text-align: center;
    margin-bottom: 10px;
  }
  #tt-header h1 {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--accent);
    text-shadow: 0 0 20px var(--glow);
    text-transform: uppercase;
  }
  #tt-header p {
    font-size: 13px;
    color: #c0e0ff;
    text-shadow: 0 0 8px rgba(160,200,255,.7);
    letter-spacing: .4px;
    font-weight: 600;
    margin-top: 3px;
  }

  /* ── LEVEL TABS ── */
  #level-tabs {
    display: flex;
    gap: 5px;
    justify-content: center;
    margin-bottom: 10px;
  }
  #level-tabs button {
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.05);
    color: rgba(255,255,255,.5);
    font-size: 9px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: .3px;
    transition: all .2s;
    text-transform: uppercase;
  }
  #level-tabs button.active {
    background: var(--btn-grad);
    border-color: transparent;
    color: #fff;
  }

  /* ── RITA GREETING ── */
  #rita-greeting {
    display: flex;
    gap: 10px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 16px;
    padding: 10px 12px;
    margin-bottom: 10px;
    position: relative;
    animation: slideIn .5s ease;
  }
  @keyframes slideIn {
    from { opacity:0; transform:translateY(-8px); }
    to   { opacity:1; transform:translateY(0); }
  }
  #rita-face {
    width: 64px; height: 80px;
    flex-shrink: 0;
    display: flex; align-items: flex-end; justify-content: center;
    overflow: visible;
  }
  #rita-face img { width:100%; height:100%; object-fit:contain; border-radius:0; }
  /* speaking pulse */
  #rita-face.speaking::after {
    content: '';
    position: absolute; inset: -4px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    animation: pulse-ring .8s ease-out infinite;
    opacity: .7;
  }
  @keyframes pulse-ring {
    0%   { transform:scale(1); opacity:.7; }
    100% { transform:scale(1.4); opacity:0; }
  }
  #rita-bubble { flex: 1; }
  #rita-name-tag {
    font-size: 9px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 3px;
  }
  #rita-speech {
    font-size: 11px;
    color: rgba(255,255,255,.75);
    line-height: 1.5;
  }
  #rita-speak-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 50%;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
    color: #fff;
  }
  #rita-speak-btn:hover { background: rgba(255,255,255,.18); }

  /* ── LAD BAR ── */
  #lad-bar {
    display: flex;
    align-items: center;
    gap: 9px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 13px;
    padding: 7px 11px;
    margin-bottom: 8px;
  }
  #lad-avatar {
    width: 64px; height: 80px;
    flex-shrink: 0;
    display: flex; align-items: flex-end; justify-content: center;
    overflow: visible;
  }
  #lad-avatar img { width:100%; height:100%; object-fit:contain; border-radius:0; }
  #lad-text { flex:1; }
  #lad-name { font-size: 12px; font-weight: 700; color: var(--accent); }
  #lad-instr { font-size: 13px; color: #e0e0ff; margin-top: 1px; font-weight: 600; text-shadow: 0 0 6px rgba(180,180,255,.5); }
  #level-badge {
    background: var(--btn-grad);
    border-radius: 20px;
    padding: 3px 8px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .4px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ── BEATCOINS ── */
  #bc-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; padding: 7px 14px; margin: 0 0 8px;
    position: relative; z-index: 2;
  }
  #bc-label { font-size: 9px; color: rgba(255,255,255,.5); text-transform: uppercase; letter-spacing:.5px; font-weight:600; }
  #bc-amount { font-size: 17px; font-weight: 900; color: #ffde59; }
  #bc-label { font-size: 9px; color: rgba(255,255,255,.32); text-transform: uppercase; letter-spacing: .5px; }
  #bc-amount { font-size: 15px; font-weight: 900; color: #ffde59; }

  /* ── ATTEMPTS ── */
  #attempts-bar {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 8px;
    min-height: 16px;
  }
  .attempt-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--glow);
    transition: all .3s;
  }
  .attempt-dot.used {
    background: rgba(255,255,255,.1);
    box-shadow: none;
  }

  /* ── TURNTABLE ── */
  #turntable-wrap {
    position: relative;
    width: 220px; height: 220px;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #turntable-wrap::before {
    content: '';
    position: absolute; inset: -7px;
    border-radius: 50%;
    background: conic-gradient(var(--accent), transparent 60%, var(--accent), transparent);
    animation: ring-spin 3s linear infinite;
    opacity: .3;
  }
  @keyframes ring-spin { to { transform:rotate(360deg); } }

  #wheel-border {
    position: relative;
    width: 200px; height: 200px;
    border-radius: 50%;
    border: 4px solid var(--accent);
    box-shadow: 0 0 26px var(--glow), inset 0 0 14px rgba(0,0,0,.6);
    overflow: hidden;
  }
  #roulette-wheel {
    width: 100%; height: 100%;
    border-radius: 50%;
    transition: transform 4s cubic-bezier(.17,.67,.12,.99);
  }
  #hub {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 36px; height: 36px;
    background: #111;
    border-radius: 50%;
    border: 3px solid var(--accent);
    z-index: 5;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    box-shadow: 0 0 10px var(--glow);
  }
  #needle {
    position: absolute;
    top: -13px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 24px solid var(--accent);
    filter: drop-shadow(0 0 5px var(--glow));
    z-index: 10;
  }

  /* ── SPIN BTN ── */
  #spin-btn {
    display: block;
    width: 82%;
    margin: 0 auto 10px;
    padding: 12px;
    background: var(--btn-grad);
    border: none;
    border-radius: 30px;
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.4), 0 0 16px var(--glow);
    transition: transform .15s, opacity .3s;
    position: relative; overflow: hidden;
  }
  #spin-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg,rgba(255,255,255,.14),transparent);
    border-radius: inherit;
  }
  #spin-btn:hover:not(:disabled) { transform: scale(1.04); }
  #spin-btn:active:not(:disabled) { transform: scale(.97); }
  #spin-btn:disabled { opacity: .38; cursor: not-allowed; }

  /* ── RESULT PANEL ── */
  #result-panel {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 10px;
    text-align: center;
    min-height: 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }
  #result-icon { font-size: 24px; line-height: 1; }
  #result-title { font-size: 16px; font-weight: 800; color: var(--accent); text-shadow: 0 0 12px var(--glow); }
  #result-sub { font-size: 13px; color: #a0f8ff; font-weight: 700; text-shadow: 0 0 8px rgba(160,248,255,.7); }
  #result-points { font-size: 18px; font-weight: 900; letter-spacing: 1px; display: none; }
  .points-win { color: #4ade80; text-shadow: 0 0 12px #22c55e; }

  /* ── CONTINUE BTN ── */
  #continue-btn {
    display: none;
    width: 82%;
    margin: 0 auto;
    padding: 11px;
    background: rgba(255,255,255,.07);
    border: 1px solid var(--accent);
    border-radius: 30px;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .5px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all .2s;
    text-align: center;
  }
  #continue-btn:hover { background: var(--btn-grad); color: #fff; border-color: transparent; }

  /* ── CONFETTI ── */
  #celebrate {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 20;
    overflow: hidden; border-radius: 40px;
  }
  .cp {
    position: absolute;
    border-radius: 2px;
    animation: cf 1.5s ease-out forwards;
  }
  @keyframes cf {
    0%   { transform:translateY(-20px) rotate(0deg); opacity:1; }
    100% { transform:translateY(900px) rotate(720deg); opacity:0; }
  }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(20,20,40,.95);
    border: 1px solid var(--accent, #ff6ef7);
    border-radius: 20px;
    padding: 9px 18px;
    font-size: 12px; color: #fff;
    z-index: 1000;
    transition: transform .3s, opacity .3s;
    opacity: 0; white-space: nowrap; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>

// ════════════════════════════════

function loadStorage() {
  try {
    const d = JSON.parse(localStorage.getItem('askLovelyRitaV4') || '{}');
    if (d.selectedLad && LADS[d.selectedLad]) S.lad = d.selectedLad;
    if (d.theme && ['youngsters','grownups','experts'].includes(d.theme)) S.level = d.theme;
    if (typeof d.beatcoins === 'number') S.beatcoins = d.beatcoins;
  } catch(e) {}
}

function saveStorage() {
  try {
    const d = JSON.parse(localStorage.getItem('askLovelyRitaV4') || '{}');
    d.beatcoins = S.beatcoins;
    localStorage.setItem('askLovelyRitaV4', JSON.stringify(d));
  } catch(e) {}
}

// ════════════════════════════════
//  HELPERS
// ════════════════════════════════

function shuffle(a) {
  const b = [...a];
  for (let i = b.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function buildSlices(level, ladKey) {
  const target = LADS[ladKey].instrument;
  const others = ['hootenanny','rickenbecker','lady_sharma','miss_ludwig'].filter(i => i !== target);
  // Odds por nível (8 fatias sempre):
  // Youngsters: 4 do instrumento certo + 2 outros + 2 notas = ~50% chance (justo para crianças)
  // Grown Ups:  2 do instrumento certo + 2 outros + 4 notas = ~25% chance
  // Experts:    1 do instrumento certo + 3 outros + 4 notas = ~12.5% chance
  if (level === 'youngsters') {
    // 4 fatias corretas = 50% — suficientemente fácil
    return shuffle([target, target, target, target, others[0], others[1], 'note1', 'note2']);
  } else if (level === 'grownups') {
    // 2 fatias corretas = 25%
    return shuffle([target, target, others[0], others[1], others[2], 'note1', 'note2', 'note3']);
  } else {
    // experts: 1 fatia correta = 12.5%
    return shuffle([target, others[0], others[1], others[2], 'note1', 'note2', 'note3', 'note4']);
  }
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

  const instrData = INSTR[lad.instrument];
  const instrImg = instrData && instrData[instrKey] ? instrData[instrKey] : BASE_URL + lad.instrument + '_transparent.png';

  document.getElementById('level-badge').textContent =
    lvl==='youngsters' ? 'Youngsters' : lvl==='grownups' ? 'Grown Ups' : 'Experts';

  // Instrumento do Lad na caixa (em vez da imagem do Lad)
  const instrKey2 = 'img_' + lvl;
  const instrData2 = INSTR[lad.instrument];
  const instrSrc = instrData2 && instrData2[instrKey2] ? instrData2[instrKey2] : BASE_URL + lad.instrument + '_transparent.png';
  const imgEl  = document.getElementById('lad-img');
  const emEl   = document.getElementById('lad-emoji');
  imgEl.style.display = 'block';
  emEl.style.display  = 'none';
  emEl.textContent    = lad.emoji;
  imgEl.src = instrSrc;

  // BeatCoins
  document.getElementById('bc-amount').textContent = S.beatcoins;

  if (resetRound) {
    S.slices       = buildSlices(lvl, S.lad);
    S.attempts     = lvl==='youngsters' ? 3 : lvl==='grownups' ? 2 : 1;
    S.attemptsLeft = S.attempts;
    S.roundOver    = false;
    S.currentDeg   = 0;

    w.style.transition = 'none';
    w.style.transform  = 'rotate(0deg)';

    drawWheel();
    renderAttempts();
    resetResult();

    sb.disabled    = false;
    sb.textContent = '🎵 Spin The Turntable!';
    }
}

// ════════════════════════════════
//  DRAW WHEEL
// ════════════════════════════════

function drawWheel() {
  const slices = S.slices;
  const n = slices.length;
  const R = 100;
  const step = 360 / n;
  const colors = SLICE_COLORS[S.level];
  const instrKey = 'img_' + S.level;
  let paths = '', labels = '', defs = '';

  // Pre-carrega imagens para o SVG
  const imgIds = {};
  for (let i = 0; i < n; i++) {
    const info = INSTR[slices[i]];
    if (info && info[instrKey]) {
      const imgId = 'wheel-img-' + slices[i];
      if (!imgIds[slices[i]]) {
        imgIds[slices[i]] = imgId;
        defs += `<image id="${imgId}" href="${info[instrKey]}" width="36" height="36" style="display:none"/>`;
      }
    }
  }

  for (let i = 0; i < n; i++) {
    const a1 = (i*step - 90) * Math.PI/180;
    const a2 = ((i+1)*step - 90) * Math.PI/180;
    const x1 = R + R*Math.cos(a1), y1 = R + R*Math.sin(a1);
    const x2 = R + R*Math.cos(a2), y2 = R + R*Math.sin(a2);
    const large = step > 180 ? 1 : 0;
    paths += `<path d="M${R} ${R} L${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2}Z" fill="${colors[i%colors.length]}" stroke="rgba(0,0,0,.3)" stroke-width="1.5"/>`;
    const mid = ((i+.5)*step - 90) * Math.PI/180;
    const lx = R + R*.65*Math.cos(mid);
    const ly = R + R*.65*Math.sin(mid);
    const info = INSTR[slices[i]] || { emoji:'🎵' };
    if (info[instrKey]) {
      // Usar imagem proprietária — centralizada na fatia
      const ix = lx - 18;
      const iy = ly - 18;
      const angle = (i + 0.5) * step;
      labels += `<image href="${info[instrKey]}" x="${ix}" y="${iy}" width="36" height="36" transform="rotate(${angle},${lx},${ly})" style="border-radius:4px"/>`;
    } else {
      labels += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="17" style="user-select:none">${info.emoji}</text>`;
    }
  }

  document.getElementById('roulette-wheel').innerHTML =
    `<svg viewBox="0 0 ${R*2} ${R*2}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;border-radius:50%">${paths}${labels}</svg>`;
}

// ════════════════════════════════
//  ATTEMPTS
// ════════════════════════════════

function renderAttempts() {
  const bar = document.getElementById('attempts-bar');
  bar.innerHTML = '';
  for (let i = 0; i < S.attempts; i++) {
    const d = document.createElement('div');
    d.className = 'attempt-dot' + (i >= S.attemptsLeft ? ' used' : '');
    bar.appendChild(d);
  }
}

function resetResult() {
  document.getElementById('result-icon').textContent  = '';
  document.getElementById('result-title').textContent = 'Spin to find out!';
  document.getElementById('result-sub').textContent   = "Land on your Lad's instrument for a bonus";
  const p = document.getElementById('result-points');
  p.style.display = 'none'; p.className = ''; p.textContent = '';
}

// ════════════════════════════════
//  SPIN
// ════════════════════════════════

function spinWheel() {
  if (S.spinning || S.roundOver || S.attemptsLeft <= 0) return;
  S.spinning = true;
  window.speechSynthesis && window.speechSynthesis.cancel();
  document.getElementById('spin-btn').disabled = true;
  playRandomTrack();

  const n = S.slices.length;
  const step = 360 / n;
  const landIdx = Math.floor(Math.random() * n);
  // Fix: fatias SVG têm offset -90, então para pousar a fatia landIdx no topo (270° no SVG):
  // centro da fatia no SVG = (landIdx+0.5)*step - 90
  // rotação necessária para chegar a 270°: 360 - (landIdx+0.5)*step
  const targetOffset = (360 - (landIdx + 0.5) * step + 360) % 360;
  const spins = 5 + Math.floor(Math.random() * 3);
  const finalDeg = S.currentDeg + spins*360 + ((targetOffset - S.currentDeg%360 + 360)%360);
  S.currentDeg = finalDeg;

  const w = document.getElementById('roulette-wheel');
  w.style.transition = 'transform 4s cubic-bezier(.17,.67,.12,.99)';
  w.style.transform  = `rotate(${finalDeg}deg)`;

  setTimeout(() => {
    S.spinning = false;
    S.attemptsLeft--;
    renderAttempts();
    // Calculate which slice is actually under the needle after rotation
    // Needle points to top (0deg). SVG slices start at -90deg offset.
    // Normalise finalDeg to 0-360, then find which slice centre is at the top.
    const normDeg = ((finalDeg % 360) + 360) % 360;
    // Correct formula: find which slice is under the needle (top of wheel)
    // Needle is at top = 270deg in SVG. After CW rotation of normDeg,
    // the unrotated angle under needle = (270 - normDeg + 36000) % 360
    // Slice i spans: (i*step - 90) to ((i+1)*step - 90)
    // So idx = floor((needleAngle + 90) / step) % n
    const needleAngle = (270 - normDeg + 36000) % 360;
    const actualIdx = Math.floor((needleAngle + 90) / step) % n;
    showResult(((actualIdx % n) + n) % n);
  }, 4300);
  // Música continua por +10 segundos após o spin
  setTimeout(() => stopAudio(), 14300);
}

// ════════════════════════════════
//  RESULT
// ════════════════════════════════

function showResult(idx) {
  // Sem penalidade em nenhum nível — apenas bônus ou zero
  const bonusMap = { youngsters: 50, grownups: 100, experts: 200 };
  const bonus    = bonusMap[S.level];
  const lad      = LADS[S.lad];
  const landed   = S.slices[idx];
  const isWin    = landed === lad.instrument;
  const info     = INSTR[landed] || { label: landed, emoji:'🎵' };

  const iconEl  = document.getElementById('result-icon');
  const titleEl = document.getElementById('result-title');
  const subEl   = document.getElementById('result-sub');
  const ptsEl   = document.getElementById('result-points');

  if (isWin) {
    const winKey = 'img_' + S.level;
    const winInfo = INSTR[lad.instrument];
    if (winInfo && winInfo[winKey]) {
      iconEl.innerHTML = `<img src="${winInfo[winKey]}" style="width:56px;height:56px;object-fit:contain;" onerror="this.parentElement.textContent='🎉'"/>`;
    } else {
      iconEl.innerHTML = '🎉';
    }
    titleEl.textContent = `${info.label}!`;
    subEl.textContent   = `That's ${lad.name}'s instrument — BONUS!`;
    ptsEl.style.display = 'block';
    ptsEl.className     = 'points-win';
    ptsEl.textContent   = `+${bonus} BeatCoins!`;
    S.beatcoins        += bonus;
    document.getElementById('bc-amount').textContent = S.beatcoins;
    saveStorage();
    S.roundOver = true;
    celebrate();
    toast(`🎉 BONUS! +${bonus} BeatCoins!`);
    setTimeout(() => speak(pick(RITA_WIN)), 500);
    showContinue();

  } else if (S.attemptsLeft > 0) {
    // Miss mas ainda tem tentativas
    iconEl.innerHTML  = '';
    titleEl.textContent = info.label;
    subEl.textContent   = `Not your instrument! ${S.attemptsLeft} spin${S.attemptsLeft>1?'s':''} left — try again!`;
    ptsEl.style.display = 'none';
    document.getElementById('spin-btn').disabled = false;
    setTimeout(() => speak(`Not quite! You've got ${S.attemptsLeft} spin${S.attemptsLeft>1?'s':''} left. Have another go love!`), 500);

  } else {
    // Sem tentativas — sem penalidade
    iconEl.textContent  = info.emoji;
    titleEl.textContent = `${lad.name}'s was ${lad.label}`;
    subEl.textContent   = `No bonus this time — but no points lost either!`;
    ptsEl.style.display = 'none';
    S.roundOver = true;
    toast(`No bonus — but no worries! On to the next game!`);
    setTimeout(() => speak(pick(RITA_MISS)), 500);
    showContinue();
  }
}

// ════════════════════════════════
//  CONTINUE / NAVIGATION
// ════════════════════════════════

function showContinue() {
  setTimeout(() => {
    document.getElementById('scroll-area').scrollTo({ top: 9999, behavior:'smooth' });
  }, 300);
}

function continueTo() {
  goForward();
}

function toggleMute() {
  S.muted = !S.muted;
  const icon = document.getElementById('nav-sound-icon');
  if(icon) icon.textContent = S.muted ? '🔇' : '🔊';
  if(S.muted) window.speechSynthesis && window.speechSynthesis.cancel();
}

function goBack() {
  if (S.fromWorld === 'space') { window.location.href = 'page7_space.html'; return; }
  if (S.fromWorld === 'india') { window.location.href = 'page8_india.html'; return; }
  window.location.href = 'page5_worlds.html';
}

function goHome() {
  window.location.href = 'page1_landing.html';
}

function goForward() {
  window.location.href = 'page4_vw_game.html';
}

// ════════════════════════════════
//  AUDIO
// ════════════════════════════════

function playRandomTrack() {
  stopAudio();
  const track = TRACKS[Math.floor(Math.random() * TRACKS.length)];
  try {
    S.audio = new Audio(BASE_URL + encodeURIComponent(track));
    S.audio.volume = 0.5;
    S.audio.play().catch(() => {});
  } catch(e) {}
}

function stopAudio() {
  if (!S.audio) return;
  const audio = S.audio;
  S.audio = null;
  // Fade out suave em 600ms
  const fadeStep = 0.05;
  const fadeInterval = setInterval(() => {
    if (audio.volume > fadeStep) {
      audio.volume -= fadeStep;
    } else {
      audio.pause();
      audio.currentTime = 0;
      clearInterval(fadeInterval);
    }
  }, 30);
}

// ════════════════════════════════
//  RITA VOICE
// ════════════════════════════════

function speak(text) {
  if(localStorage.getItem('askLovelyRitaV4_mute')==='1') return;
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang  = 'en-GB';
  u.rate  = 0.9;
  u.pitch = 1.1;
  const voices = window.speechSynthesis.getVoices();
  const brit = voices.find(v => v.lang==='en-GB' && v.name.toLowerCase().includes('female'))
            || voices.find(v => v.lang==='en-GB')
            || voices.find(v => v.lang.startsWith('en'));
  if (brit) u.voice = brit;

  // Pulso visual na face da Rita
  const face = document.getElementById('rita-face');
  face.classList.add('speaking');
  u.onend = () => face.classList.remove('speaking');

  window.speechSynthesis.speak(u);
}

function ritaSpeak() {
  speak(RITA_INTRO[S.level]);
}

if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

//  CELEBRATE
// ════════════════════════════════

function celebrate() {
  const layer = document.getElementById('celebrate');
  layer.innerHTML = '';
  const cols = ['#ff6ef7','#ffde59','#a855f7','#4ade80','#fbbf24','#60a5fa','#fff'];
  for (let i = 0; i < 45; i++) {
    const el = document.createElement('div');
    el.className = 'cp';
    el.style.cssText = `
      left:${Math.random()*100}%;
      top:${Math.random()*20}%;
      background:${cols[Math.floor(Math.random()*cols.length)]};
      animation-delay:${Math.random()*.7}s;
      animation-duration:${1.2+Math.random()*.9}s;
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      border-radius:${Math.random()>.5?'50%':'2px'};
    `;
    layer.appendChild(el);
  }
  setTimeout(() => layer.innerHTML='', 2800);
}

// ════════════════════════════════
//  TOAST
// ════════════════════════════════

let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 3000);
}

// ════════════════════════════════
//  DEVICE
// ════════════════════════════════

function setDevice(w, h, name) {
  const p = document.getElementById('phone');
  p.style.width  = w+'px';
  p.style.height = h+'px';
  document.querySelectorAll('#device-bar button').forEach(b =>
    b.classList.toggle('active', b.textContent===name));
}
