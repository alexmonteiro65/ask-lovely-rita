<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Lovely Rita — Octopus's Garden</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a14; color: #fff;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 20px 16px 40px;
  }
  #device-bar {
    display: flex; gap: 8px; margin-bottom: 16px;
    flex-wrap: wrap; justify-content: center;
  }
  #device-bar button {
    background: #1a1a2e; border: 1px solid #333; color: #aaa;
    padding: 6px 12px; border-radius: 20px; font-size: 11px;
    cursor: pointer; transition: all .2s;
  }
  #device-bar button:hover, #device-bar button.active {
    background: #333; color: #fff; border-color: #666;
  }
  #phone-outer {
    background: #1c1c1c; border-radius: 50px; padding: 12px;
    box-shadow: 0 0 0 2px #333, 0 20px 60px rgba(0,0,0,.8);
  }
  #phone {
    width: 369px; height: 828px; border-radius: 40px;
    overflow: hidden; position: relative;
    display: flex; flex-direction: column;
    background: #061a2e;
    transition: width .3s, height .3s;
  }
  #notch {
    position: absolute; top: 0; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 30px; background: #1c1c1c;
    border-radius: 0 0 20px 20px; z-index: 20;
  }
  #scroll-area {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 36px 12px 8px; scrollbar-width: none;
  }
  #scroll-area::-webkit-scrollbar { display: none; }

  /* OCEAN BG */
  #ocean-bg {
    position: absolute; inset: 0; z-index: 0;
    background: linear-gradient(180deg, #061a2e 0%, #0a3d6b 30%, #0d5a8a 60%, #0a7c6c 100%);
    border-radius: 40px; overflow: hidden; pointer-events: none;
  }
  .bg-bubble {
    position: absolute; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.05);
    animation: bg-rise var(--bd) ease-in infinite;
  }
  @keyframes bg-rise {
    0%   { transform: translateY(0); opacity:.5; }
    100% { transform: translateY(-900px); opacity:0; }
  }
  .bg-fish {
    position: absolute; font-size: var(--fs);
    animation: fish-drift var(--fd) linear infinite;
    display: inline-block;
  }
  @keyframes fish-drift {
    0%   { transform: translateX(420px) scaleX(-1); opacity:.3; }
    100% { transform: translateX(-60px) scaleX(-1); opacity:.3; }
  }

  /* FUNNY LAD FIXED BOTTOM */
  #lad-bottom-wrap {
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    height: 110px;
    position: relative;
    overflow: visible;
    background: rgba(0,10,20,.3);
    border-top: 1px solid rgba(77,200,255,.1);
  }
  #lad-bottom-img {
    height: 130px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 -4px 20px rgba(77,200,255,.4));
    animation: lad-bottom-float 3s ease-in-out infinite alternate;
    margin-bottom: -10px;
    position: relative;
    z-index: 5;
  }
  @keyframes lad-bottom-float {
    from { transform: translateY(0) rotate(-1deg); }
    to   { transform: translateY(-8px) rotate(1deg); }
  }
  #lad-bottom-img.speaking {
    filter: drop-shadow(0 0 20px rgba(77,200,255,.9)) drop-shadow(0 -4px 20px rgba(77,200,255,.4));
  }

  /* NAV */
  #nav-bar {
    flex-shrink: 0; display: flex; align-items: center;
    justify-content: space-around; padding: 8px 20px 12px;
    border-top: 1px solid rgba(255,255,255,.08);
    background: rgba(0,10,20,.6); backdrop-filter: blur(12px);
    position: relative; z-index: 10;
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; background: none; border: none;
    color: rgba(255,255,255,.5); cursor: pointer;
    padding: 5px 14px; border-radius: 12px;
    transition: all .2s; font-size: 10px;
  }
  .nav-btn:hover { background: rgba(255,255,255,.08); color:#fff; }
  .nav-btn .nav-icon { font-size: 20px; line-height: 1; }
  .nav-btn.nav-home { color: var(--lvl-accent, #4dc8ff); }

  /* HEADER */
  #page-header { text-align: center; margin-bottom: 8px; position: relative; z-index: 2; }
  #page-header h1 {
    font-size: 18px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
    background: linear-gradient(135deg,#4dc8ff,#00e5cc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 14px rgba(77,200,255,.5));
  }
  #page-header p { font-size: 10px; color: rgba(255,255,255,.4); margin-top: 2px; }

  /* LEVEL TABS */
  #level-tabs {
    display: flex; gap: 5px; justify-content: center;
    margin-bottom: 8px; position: relative; z-index: 2;
  }
  #level-tabs button {
    padding: 4px 10px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.05); color: rgba(255,255,255,.5);
    font-size: 9px; font-weight: 700; cursor: pointer; transition: all .2s; text-transform: uppercase;
  }
  #level-tabs button.active {
    background: var(--lvl-grad, linear-gradient(135deg,#4dc8ff,#00e5cc));
    border-color: transparent; color: #000; font-weight: 900;
  }

  /* ── LEVEL THEMES — buttons only, ocean background unchanged ── */
  .theme-youngsters { --lvl-grad:linear-gradient(135deg,#ff6ef7,#a855f7); --lvl-accent:#ff6ef7; }
  .theme-grownups   { --lvl-grad:linear-gradient(135deg,#ffde59,#c8860a); --lvl-accent:#ffde59; }
  .theme-experts    { --lvl-grad:linear-gradient(135deg,#c8a96e,#6677aa); --lvl-accent:#c8a96e; }

  /* RITA WRAP */
  #rita-wrap {
    flex: 1; background: rgba(255,255,255,.07);
    border: 1px solid rgba(77,200,255,.3);
    border-radius: 14px 14px 14px 4px;
    padding: 8px 26px 8px 10px; position: relative;
  }
  #rita-name { font-size: 9px; font-weight:700; color:#4dc8ff; text-transform:uppercase; letter-spacing:.8px; margin-bottom:3px; }
  #rita-text { font-size: 10px; color: rgba(255,255,255,.8); line-height: 1.5; }
  #rita-speak-btn {
    position: absolute; top:7px; right:6px;
    background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
    border-radius:50%; width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; cursor:pointer; color:#fff; transition:all .2s;
  }
  /* lad-wrap removed — lad now fixed at bottom */

  /* STATUS */
  #status-bar { display:flex; gap:6px; margin-bottom:8px; position:relative; z-index:2; }
  .stat-card {
    flex:1; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:4px 8px;
  }
  .stat-label { font-size:7px; color:rgba(255,255,255,.3); text-transform:uppercase; letter-spacing:.5px; }
  .stat-val { font-size:13px; font-weight:900; }
  #bc-val { color:#ffde59; }
  #score-val { color:#4dc8ff; }
  #word-count-val { color:#00e5cc; }

  /* PROGRESS */
  #progress-bar-wrap { position:relative; z-index:2; margin-bottom:8px; }
  #progress-label { font-size:8px; color:rgba(255,255,255,.3); text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
  #progress-track { height:5px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden; }
  #progress-fill { height:100%; background:linear-gradient(90deg,#4dc8ff,#00e5cc); border-radius:3px; transition:width .4s ease; width:0%; }

  /* WORD SECTION */
  #word-section {
    background: rgba(0,0,0,.3); border: 1px solid rgba(77,200,255,.2);
    border-radius: 16px; padding: 12px; margin-bottom: 8px;
    position: relative; z-index: 2; text-align: center;
  }
  #word-category { font-size:8px; color:rgba(255,255,255,.4); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }

  /* CREATURE IMAGE — Youngsters */
  #creature-wrap {
    width: 80px; height: 80px; margin: 0 auto 8px;
    display: flex; align-items:center; justify-content:center;
    position: relative;
  }
  #creature-img {
    width: 100%; height: 100%; object-fit: contain;
    border-radius: 12px;
    transition: transform .3s ease;
  }
  #creature-img.wiggle {
    animation: wiggle-correct .6s ease;
  }
  @keyframes wiggle-correct {
    0%,100% { transform: scale(1) rotate(0deg); }
    20%      { transform: scale(1.25) rotate(-8deg); }
    40%      { transform: scale(1.3) rotate(8deg); }
    60%      { transform: scale(1.2) rotate(-5deg); }
    80%      { transform: scale(1.15) rotate(3deg); }
  }
  #creature-emoji {
    font-size: 64px; line-height:1;
    transition: transform .3s;
    display: none;
  }

  /* RIDDLE — Grown Ups / Experts */
  #riddle-wrap {
    background: rgba(77,200,255,.08); border: 1px solid rgba(77,200,255,.2);
    border-radius: 12px; padding: 10px; margin-bottom: 8px;
    display: none;
  }
  #riddle-label { font-size:8px; color:#4dc8ff; text-transform:uppercase; letter-spacing:.8px; margin-bottom:5px; }
  #riddle-text { font-size: 12px; color: rgba(255,255,255,.85); line-height: 1.6; font-style: italic; }

  /* HINT TEXT */
  #word-hint { font-size:10px; color:rgba(255,255,255,.5); margin-bottom:8px; font-style:italic; min-height:14px; }

  /* LETTER BOXES */
  #letter-boxes {
    display: flex; gap: 4px; justify-content: center;
    flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px;
    scrollbar-width: none;
  }
  #letter-boxes::-webkit-scrollbar { display: none; }
  .letter-box {
    flex-shrink: 0; height: 36px;
    background: rgba(255,255,255,.08);
    border: 2px solid rgba(77,200,255,.4); border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #fff; text-transform: uppercase;
    transition: all .2s; position: relative;
  }
  .letter-box.filled { background: rgba(77,200,255,.15); border-color: #4dc8ff; }
  .letter-box.correct { background: rgba(74,222,128,.2); border-color: #4ade80; animation: box-pop .35s ease; }
  .letter-box.wrong { background: rgba(248,113,113,.15); border-color: #f87171; animation: box-shake .4s ease; }
  .letter-box.revealed { background: rgba(0,229,204,.2); border-color: #00e5cc; }
  @keyframes box-pop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
  @keyframes box-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  /* SCRAMBLE */
  #scramble-section {
    display: none; flex-wrap: wrap; gap: 6px; justify-content: center;
    margin-bottom: 8px; position: relative; z-index: 2;
  }
  .scramble-letter {
    width: 36px; height: 40px;
    background: linear-gradient(135deg,#0d5a8a,#0a7c6c);
    border: 2px solid rgba(77,200,255,.5); border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: #fff; text-transform: uppercase;
    cursor: pointer; transition: all .15s; user-select: none;
    box-shadow: 0 3px 8px rgba(0,0,0,.3);
  }
  .scramble-letter:hover { transform: translateY(-3px) scale(1.06); }
  .scramble-letter:active { transform: scale(.94); }
  .scramble-letter.used { opacity:.2; pointer-events:none; transform:scale(.88); }
  .scr-del {
    background: linear-gradient(135deg,#5a1a1a,#8a2020) !important;
    border-color: rgba(248,113,113,.5) !important;
  }

  /* KEYBOARD */
  #keyboard-section {
    display: none; flex-direction: column; gap: 4px;
    margin-bottom: 8px; position: relative; z-index: 2;
  }
  .key-row { display: flex; gap: 3px; justify-content: center; }
  .key {
    height: 38px; min-width: 28px; padding: 0 3px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2); border-radius: 7px;
    color: #fff; font-size: 12px; font-weight: 700; cursor: pointer;
    transition: all .1s; display: flex; align-items: center; justify-content: center;
    text-transform: uppercase; user-select: none;
  }
  .key:hover { background: rgba(77,200,255,.25); border-color:#4dc8ff; }
  .key:active { transform: scale(.9); background: rgba(77,200,255,.4); }
  .key-del { min-width: 42px; font-size:15px; }
  .key-submit {
    min-width: 70px; font-size:10px; font-weight:900;
    background: linear-gradient(135deg,#4dc8ff,#00e5cc);
    border-color: transparent; color:#000;
  }
  .key-submit:hover { filter:brightness(1.1); }

  /* ACTION BTNS */
  #action-btns { display:flex; gap:7px; margin-bottom:8px; position:relative; z-index:2; }
  .act-btn {
    flex:1; padding:10px; border:none; border-radius:24px;
    font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
    cursor:pointer; transition:transform .15s, opacity .3s;
    position:relative; overflow:hidden;
  }
  .act-btn::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.14),transparent); border-radius:inherit;
  }
  .act-btn:hover:not(:disabled) { transform:scale(1.03); }
  .act-btn:disabled { opacity:.35; cursor:not-allowed; }
  #start-btn { background:linear-gradient(135deg,#4dc8ff,#00e5cc); color:#000; box-shadow:0 4px 14px rgba(77,200,255,.4); }
  #next-btn  { background:rgba(255,255,255,.07); border:1px solid #4dc8ff; color:#4dc8ff; display:none; }
  #hint-btn  {
    flex:0 0 auto; padding:10px 12px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15);
    border-radius:24px; color:rgba(255,255,255,.6);
    font-size:10px; font-weight:700; cursor:pointer; transition:all .2s; display:none;
  }
  #hint-btn:hover:not(:disabled) { background:rgba(255,255,255,.14); color:#fff; }
  #hint-btn:disabled { opacity:.3; cursor:not-allowed; }

  /* RESULT */
  #result-panel {
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
    border-radius:13px; padding:10px; margin-bottom:8px;
    text-align:center; display:none; flex-direction:column;
    align-items:center; gap:3px; position:relative; z-index:2;
    animation:slideIn .35s ease;
  }
  #result-panel.show { display:flex; }
  @keyframes slideIn { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:translateY(0)} }
  #result-icon { font-size:24px; }
  #result-title { font-size:13px; font-weight:800; color:#4dc8ff; }
  #result-word { font-size:18px; font-weight:900; color:#00e5cc; letter-spacing:2px; text-transform:uppercase; }
  #result-sub { font-size:9px; color:rgba(255,255,255,.45); }
  #result-pts { font-size:16px; font-weight:900; }

  /* CELEBRATE */
  #celebrate {
    position:absolute; inset:0; pointer-events:none;
    z-index:25; overflow:hidden; border-radius:40px;
  }
  .cp {
    position:absolute; border-radius:2px;
    animation:cf 1.6s ease-out forwards;
  }
  @keyframes cf {
    0%   { transform:translateY(-20px) rotate(0deg); opacity:1; }
    100% { transform:translateY(900px) rotate(720deg); opacity:0; }
  }

  /* TOAST */
  #toast {
    position:fixed; bottom:30px; left:50%;
    transform:translateX(-50%) translateY(80px);
    background:rgba(6,26,46,.95); border:1px solid #4dc8ff;
    border-radius:20px; padding:8px 16px; font-size:11px; color:#fff;
    z-index:1000; transition:transform .3s,opacity .3s;
    opacity:0; white-space:nowrap; pointer-events:none;
  }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>

<div id="device-bar">
  <button onclick="setDevice(393,852,'iPhone 14 Pro')" class="active">iPhone 14 Pro</button>
  <button onclick="setDevice(375,667,'iPhone SE')">iPhone SE</button>
  <button onclick="setDevice(360,800,'Galaxy S23')">Galaxy S23</button>
  <button onclick="setDevice(412,915,'Pixel 7')">Pixel 7</button>
  <button onclick="setDevice(430,932,'iPhone 14 Max')">iPhone 14 Max</button>
</div>

<div id="phone-outer">
  <div id="phone">
    <div id="notch"></div>
    <div id="ocean-bg"></div>
    <div id="celebrate"></div>

    <div id="scroll-area">

      <div id="page-header">
        <h1>🐙 Octopus's Garden</h1>
        <p>The Funny Lad's underwater world!</p>
      </div>

      <div id="level-tabs">
        <button onclick="setLevel('youngsters')" class="active">🟣 Youngsters</button>
        <button onclick="setLevel('grownups')">🟡 Grown Ups</button>
        <button onclick="setLevel('experts')">⭐ Experts</button>
      </div>

      <div id="rita-wrap" style="margin-bottom:8px;position:relative;z-index:2">
        <div id="rita-name">♪ Lovely Rita</div>
        <div id="rita-text">Loading...</div>
        <button id="rita-speak-btn" onclick="ritaSpeak()">🔊</button>
      </div>

      <div id="status-bar">
        <div class="stat-card"><div class="stat-label">BeatCoins</div><div class="stat-val" id="bc-val">25,000</div></div>
        <div class="stat-card"><div class="stat-label">Score</div><div class="stat-val" id="score-val">0</div></div>
        <div class="stat-card"><div class="stat-label">Words</div><div class="stat-val" id="word-count-val">0/8</div></div>
      </div>

      <div id="progress-bar-wrap">
        <div id="progress-label">Progress</div>
        <div id="progress-track"><div id="progress-fill"></div></div>
      </div>

      <div id="word-section">
        <div id="word-category">Ocean Word</div>
        <!-- Youngsters: real creature image -->
        <div id="creature-wrap">
          <img id="creature-img" src="" alt="" style="display:none"/>
          <div id="creature-emoji" style="display:block"><img id="drum-bg-img" src="https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/octopus_garden_drum.png" style="width:100%;max-width:260px;border-radius:12px;display:block;margin:0 auto" alt="Octopus Garden"/></div>
        </div>
        <!-- Grown Ups / Experts: riddle -->
        <div id="riddle-wrap">
          <div id="riddle-label">🔍 Riddle</div>
          <div id="riddle-text">...</div>
        </div>
        <div id="word-hint">Press Dive In to start!</div>
        <div id="letter-boxes"></div>
      </div>

      <div id="scramble-section"></div>
      <div id="keyboard-section">
        <div class="key-row" id="key-row-1"></div>
        <div class="key-row" id="key-row-2"></div>
        <div class="key-row" id="key-row-3"></div>
      </div>

      <div id="action-btns">
        <button class="act-btn" id="start-btn" onclick="startGame()">🐙 Dive In!</button>
        <button class="act-btn" id="next-btn" onclick="nextWord()">Next Word ▶</button>
        <button id="hint-btn" onclick="useHint()">💡 Hint</button>
      </div>

      <div id="result-panel">
        <div id="result-icon">🌊</div>
        <div id="result-title"></div>
        <div id="result-word"></div>
        <div id="result-sub"></div>
        <div id="result-pts"></div>
        <div id="bonus-area" style="display:none;margin-top:14px;text-align:center;">
          <div id="bonus-title" style="font-size:14px;font-weight:bold;color:#ffde59;margin-bottom:6px;">🎮 BONUS GAME UNLOCKED!</div>
          <div id="bonus-countdown" style="font-size:12px;color:rgba(255,255,255,0.7);margin-bottom:10px;"></div>
          <button id="bonus-btn" onclick="goToBonusGame()" style="background:linear-gradient(135deg,#ff6ef7,#a855f7);border:none;border-radius:20px;padding:12px 20px;color:#000;font-weight:bold;font-size:13px;cursor:pointer;font-family:Georgia,serif;width:100%;">❌⭕ Play Tic-Tac-Toe Underwater!</button>
        </div>
      </div>

    </div>

    <!-- FUNNY LAD FIXED AT BOTTOM -->
    <div id="lad-bottom-wrap">
      <img id="lad-bottom-img"
        src="https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/aqua_lad_grownups.png"
        alt="Funny Lad"
        onerror="this.style.display='none';document.getElementById('lad-bottom-fallback').style.display='block'"/>
      <div id="lad-bottom-fallback" style="display:none;font-size:64px;line-height:1">🤿</div>
    </div>

      <!-- BONUS GAME PANEL -->
    <nav id="nav-bar">
      <button class="nav-btn nav-home" onclick="goHome()"><span class="nav-icon">🏠</span><span>Home</span></button>
      <button class="nav-btn" onclick="goChooseWorld()"><span class="nav-icon">🌍</span><span>Choose World</span></button>
      <button class="nav-btn" onclick="goNextPage()"><span class="nav-icon">▶️</span><span>Next Page</span></button>
    </nav>
  </div>
</div>
<div id="toast"></div>

<script>
const BASE = 'https://alexmonteiro65.github.io/ask-lovely-rita/src/';

// ── WORD DATA — different words per level ─────────────────
const WORDS_BY_LEVEL = {
  youngsters: [
    { word:'CORAL',     emoji:'🪸', photo:'https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/octopus/youngsters_coral.png', cat:'Ocean Life',    riddle:"I live underwater and come in many colours. Fish love to hide inside me. I look like a plant but I am actually made of tiny animals!" },
    { word:'FISH',      emoji:'🐟', photo:'https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/octopus/youngsters_fish.png',   cat:'Ocean Life',    riddle:"I live in the water and breathe through gills. I have fins and scales. You might find me in an aquarium or on your dinner plate!" },

// ── STATE ──────────────────────────────────────────────────
let S = {
  level: 'youngsters',
  beatcoins: 25000, score: 0,
  wordIndex: 0, wordsOrder: [],
  currentInput: [],
  gameActive: false, wordComplete: false,
  hintsLeft: 3, revealedPositions: [],
  usedScrambleIndices: [],
};

// ── STORAGE ────────────────────────────────────────────────
function loadStorage() {
  try {
    const d = JSON.parse(localStorage.getItem('askLovelyRitaV4')||'{}');
    if (d.theme && LEVEL_CFG[d.theme]) S.level = d.theme;
    if (typeof d.beatcoins==='number') S.beatcoins = d.beatcoins;
  } catch(e) {}
}
function saveStorage() {
  try {
    localStorage.setItem('askLovelyRitaV4_bc', S.beatcoins);
  } catch(e) {}
}

// ── INIT ───────────────────────────────────────────────────
function init() {
  loadStorage();
  document.getElementById('phone').className = 'theme-' + (S.level || 'youngsters');
  buildOceanBg();
  buildKeyboard();
  applyLevel(S.level);
  highlightTab(S.level);
  setTimeout(() => speak(RITA_INTRO[S.level]), 900);
}

function setLevel(lvl) {
  S.level = lvl;
  document.getElementById('phone').className = 'theme-' + lvl;
  window.speechSynthesis && window.speechSynthesis.cancel();
  applyLevel(lvl);
  highlightTab(lvl);
  setTimeout(() => speak(RITA_INTRO[lvl]), 400);
}

function highlightTab(lvl) {
  document.querySelectorAll('#level-tabs button').forEach(b => {
    b.classList.toggle('active',
      (lvl==='youngsters'&&b.textContent.includes('Young'))||
      (lvl==='grownups'&&b.textContent.includes('Grown'))||
      (lvl==='experts'&&b.textContent.includes('Expert'))
    );
  });
}

function applyLevel(lvl) {
  const cfg = LEVEL_CFG[lvl];
  document.getElementById('rita-text').textContent = RITA_INTRO[lvl];
  document.getElementById('bc-val').textContent = S.beatcoins;

  // Update bottom lad image per level
  const ladBottomEl = document.getElementById('lad-bottom-img');
  const ladBottomFallback = document.getElementById('lad-bottom-fallback');
  if(ladBottomEl) {
    ladBottomEl.style.display = 'block';
    ladBottomFallback.style.display = 'none';
    ladBottomEl.src = cfg.ladImg;
    ladBottomEl.onerror = () => {
      ladBottomEl.style.display = 'none';
      ladBottomFallback.style.display = 'block';
    };
  }

  resetGame();
}

// ── OCEAN BACKGROUND ───────────────────────────────────────
function buildOceanBg() {
  const bg = document.getElementById('ocean-bg');
  for (let i = 0; i < 10; i++) {
    const b = document.createElement('div');
    b.className = 'bg-bubble';
    const size = 4 + Math.random()*10;
    b.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;bottom:${Math.random()*30}%;--bd:${3+Math.random()*5}s;animation-delay:${Math.random()*5}s`;
    bg.appendChild(b);
  }
  ['🐠','🐡','🐟','🦈'].forEach(f => {
    const el = document.createElement('div');
    el.className = 'bg-fish'; el.textContent = f;
    el.style.cssText = `top:${20+Math.random()*60}%;--fs:${14+Math.random()*12}px;--fd:${8+Math.random()*10}s;animation-delay:${Math.random()*8}s`;
    bg.appendChild(el);
  });
}

// ── KEYBOARD ───────────────────────────────────────────────
function buildKeyboard() {
  KB_ROWS.forEach((row, ri) => {
    const rowEl = document.getElementById(`key-row-${ri+1}`);
    rowEl.innerHTML = '';
    row.forEach(k => {
      const btn = document.createElement('button');
      const isDel = k === '⌫', isSubmit = k === '✓';
      btn.className = 'key' + (isDel?' key-del':'') + (isSubmit?' key-submit':'');
      btn.textContent = k;
      btn.dataset.key = k;
      // CRITICAL: keys are NEVER marked as used — letters can repeat
      btn.onclick = () => handleKey(k);
      rowEl.appendChild(btn);
    });
  });
}

// ── GAME FLOW ─────────────────────────────────────────────
function resetGame() {
  S.score = 0; S.wordIndex = 0;
  // Use level-specific word list, shuffled
  const levelWords = WORDS_BY_LEVEL[S.level];
  S.wordsOrder = shuffle([...Array(levelWords.length).keys()]).slice(0,8);
  S.gameActive = false; S.wordComplete = false;
  S.currentInput = []; S.revealedPositions = []; S.usedScrambleIndices = [];

  document.getElementById('score-val').textContent = '0';
  document.getElementById('word-count-val').textContent = '0/8';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('word-hint').textContent = 'Press Dive In to start!';
  document.getElementById('word-category').textContent = 'Ocean Word';
  document.getElementById('letter-boxes').innerHTML = '';
  document.getElementById('scramble-section').innerHTML = '';
  document.getElementById('scramble-section').style.display = 'none';
  document.getElementById('keyboard-section').style.display = 'none';
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('start-btn').style.display = 'block';
  document.getElementById('start-btn').textContent = '🐙 Dive In!';
  document.getElementById('start-btn').onclick = startGame;
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('hint-btn').style.display = 'none';
  // drum image is always visible in creature-emoji div
  document.getElementById('creature-emoji').style.display = 'block';
  document.getElementById('creature-img').style.display = 'none';
  document.getElementById('riddle-wrap').style.display = 'none';
}

function startGame() {
  S.gameActive = true;
  document.getElementById('start-btn').style.display = 'none';
  document.getElementById('result-panel').classList.remove('show');
  loadWord();
}

function loadWord() {
  if (S.wordIndex >= S.wordsOrder.length) { finishGame(); return; }
  const cfg = LEVEL_CFG[S.level];
  const wordObj = WORDS_BY_LEVEL[S.level][S.wordsOrder[S.wordIndex]];
  S.currentInput = Array(wordObj.word.length).fill('');
  S.wordComplete = false;
  S.hintsLeft = cfg.hints;
  S.revealedPositions = [];
  S.usedScrambleIndices = [];

  document.getElementById('word-category').textContent = wordObj.cat;
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('word-count-val').textContent = `${S.wordIndex}/${S.wordsOrder.length}`;
  document.getElementById('progress-fill').style.width = `${(S.wordIndex/S.wordsOrder.length)*100}%`;

  // YOUNGSTERS: show real creature photo
  if (S.level === 'youngsters') {
    document.getElementById('creature-wrap').style.display = 'flex';
    document.getElementById('riddle-wrap').style.display = 'none';
    const img = document.getElementById('creature-img');
    const emoji = document.getElementById('creature-emoji');
    img.src = wordObj.photo;
    img.style.display = 'block';
    img.classList.remove('wiggle');
    img.onerror = () => {
      img.style.display = 'none';
      emoji.textContent = wordObj.emoji;
      emoji.style.display = 'block';
    };
    emoji.style.display = 'none';
    document.getElementById('word-hint').textContent = `💡 ${S.hintsLeft} hints per word`;
  } else {
    // GROWN UPS / EXPERTS: show riddle
    document.getElementById('creature-wrap').style.display = 'none';
    document.getElementById('riddle-wrap').style.display = 'block';
    const riddle = wordObj.riddle;
    document.getElementById('riddle-text').textContent = riddle;
    document.getElementById('word-hint').textContent = `💡 ${S.hintsLeft} hint${S.hintsLeft!==1?'s':''} per word`;
    // Rita reads the riddle
    setTimeout(() => speak(riddle), 300);
  }

  buildLetterBoxes(wordObj.word);

  // Input method
  if (cfg.inputType === 'scramble') {
    buildScramble(wordObj.word);
    document.getElementById('scramble-section').style.display = 'flex';
    document.getElementById('keyboard-section').style.display = 'none';
  } else {
    document.getElementById('scramble-section').style.display = 'none';
    document.getElementById('keyboard-section').style.display = 'flex';
  }
  document.getElementById('hint-btn').style.display = 'block';
  document.getElementById('hint-btn').disabled = false;
  document.getElementById('hint-btn').textContent = `💡 Hint (${S.hintsLeft})`;
}

// ── LETTER BOXES ──────────────────────────────────────────
function buildLetterBoxes(word) {
  const container = document.getElementById('letter-boxes');
  container.innerHTML = '';
  const len = word.length;
  const w = len<=5?34 : len<=7?30 : len<=9?26 : 22;
  const fs = len<=5?17 : len<=7?14 : len<=9?12 : 10;
  container.style.gap = (len<=6?5:3)+'px';
  for (let i=0; i<len; i++) {
    const box = document.createElement('div');
    box.className = 'letter-box';
    box.id = `box-${i}`;
    box.style.width = w+'px';
    box.style.fontSize = fs+'px';
    container.appendChild(box);
  }
}

function updateBoxes() {
  S.currentInput.forEach((letter, i) => {
    const box = document.getElementById(`box-${i}`);
    if (!box) return;
    box.textContent = letter;
    if (S.revealedPositions.includes(i)) box.className='letter-box revealed';
    else box.className = letter ? 'letter-box filled' : 'letter-box';
  });
}

// ── SCRAMBLE (Youngsters) ─────────────────────────────────
function buildScramble(word) {
  const section = document.getElementById('scramble-section');
  section.innerHTML = '';
  const letters = shuffle([...word]);
  letters.forEach((letter, i) => {
    const btn = document.createElement('div');
    btn.className = 'scramble-letter';
    btn.textContent = letter;
    btn.id = `scr-${i}`;
    btn.onclick = () => useScrambleLetter(i, letter);
    section.appendChild(btn);
  });
  // Backspace
  const del = document.createElement('div');
  del.className = 'scramble-letter scr-del';
  del.textContent = '⌫';
  del.onclick = deleteLastScramble;
  section.appendChild(del);
}

function useScrambleLetter(idx, letter) {
  if (!S.gameActive || S.wordComplete) return;
  const nextEmpty = S.currentInput.findIndex((l,i) => !l && !S.revealedPositions.includes(i));
  if (nextEmpty === -1) return;
  S.currentInput[nextEmpty] = letter;
  S.usedScrambleIndices.push(idx);
  document.getElementById(`scr-${idx}`)?.classList.add('used');
  updateBoxes();
  if (!S.currentInput.includes('')) setTimeout(() => checkWord(), 300);
}

function deleteLastScramble() {
  if (!S.gameActive || S.wordComplete) return;
  for (let i=S.currentInput.length-1; i>=0; i--) {
    if (S.currentInput[i] && !S.revealedPositions.includes(i)) {
      S.currentInput[i] = '';
      const lastScr = S.usedScrambleIndices.pop();
      if (lastScr !== undefined) document.getElementById(`scr-${lastScr}`)?.classList.remove('used');
      updateBoxes(); return;
    }
  }
}

// ── KEYBOARD (Grown Ups / Experts) ───────────────────────
// CRITICAL FIX: Keys are NEVER disabled or marked as used.
// Players must be able to press the same letter multiple times (e.g. SEAWEED has 3 E's)
function handleKey(key) {
  if (!S.gameActive || S.wordComplete) return;
  if (key === '⌫') {
    for (let i=S.currentInput.length-1; i>=0; i--) {
      if (S.currentInput[i] && !S.revealedPositions.includes(i)) {
        S.currentInput[i] = '';
        updateBoxes(); return;
      }
    }
  } else if (key === '✓') {
    if (S.currentInput.includes('')) { toast('Fill all letters first!'); return; }
    checkWord();
  } else {
    const nextEmpty = S.currentInput.findIndex((l,i) => !l && !S.revealedPositions.includes(i));
    if (nextEmpty === -1) return;
    S.currentInput[nextEmpty] = key;
    // DO NOT addClass('used') — keys must always remain available for repeated letters
    updateBoxes();
  }
}

// ── CHECK WORD ────────────────────────────────────────────
function checkWord() {
  const wordObj = WORDS_BY_LEVEL[S.level][S.wordsOrder[S.wordIndex]];
  const attempt = S.currentInput.join('').toUpperCase();
  const correct = wordObj.word.toUpperCase();

  if (attempt === correct) {
    S.wordComplete = true;
    const earned = LEVEL_CFG[S.level].bonusCorrect;
    S.score += earned; S.beatcoins += earned;
  saveLadBC(earned); postGlobalScore(earned);
    document.getElementById('score-val').textContent = S.score;
    document.getElementById('bc-val').textContent = S.beatcoins;
    saveStorage();

    // Flash green
    for (let i=0; i<correct.length; i++) {
      setTimeout(() => {
        const box = document.getElementById(`box-${i}`);
        if (box) box.className = 'letter-box correct';
      }, i*50);
    }

    // Wiggle creature image (youngsters)
    setTimeout(() => {
      const img = document.getElementById('creature-img');
      if (img.style.display !== 'none') {
        img.classList.remove('wiggle');
        void img.offsetWidth; // reflow
        img.classList.add('wiggle');
      }
    }, correct.length*50+100);

    setTimeout(() => {
      showWordResult(true, wordObj, earned);
      celebrate();
      speak(pick(RITA_CORRECT));
    }, correct.length*50+300);

  } else {
    // Flash red
    for (let i=0; i<correct.length; i++) {
      const box = document.getElementById(`box-${i}`);
      if (box && !S.revealedPositions.includes(i)) box.className='letter-box wrong';
    }
    // Always advance — educate and move on
    setTimeout(() => {
      S.wordComplete = true;
      if (S.level === 'youngsters') {
        // Fill in correct letters visually so child sees the right answer
        S.currentInput = correct.split('');
        updateBoxes();
        document.querySelectorAll('.letter-box').forEach((b,i) => {
          b.className = 'letter-box revealed';
        });
        // Rita reads the correct word aloud
        setTimeout(() => {
          speak(`The answer is ${correct}! ${wordObj.riddle.split('.')[0]}!`);
        }, 400);
      } else {
        // Grown Ups / Experts — Rita reads the correct word aloud
        speak(`The answer is ${correct} love! ${wordObj.riddle.split('.')[0]}!`);
      }
      setTimeout(() => {
        showWordResult(false, wordObj, 0);
      }, 800);
    }, 600);
  }
}

// ── HINT ─────────────────────────────────────────────────
function useHint() {
  if (S.hintsLeft<=0 || S.wordComplete || !S.gameActive) return;
  const wordObj = WORDS_BY_LEVEL[S.level][S.wordsOrder[S.wordIndex]];

  // Find first unrevealed empty position
  let pos = -1;
  for (let i=0; i<wordObj.word.length; i++) {
    if (!S.revealedPositions.includes(i) && !S.currentInput[i]) { pos=i; break; }
  }
  if (pos===-1) {
    for (let i=0; i<wordObj.word.length; i++) {
      if (!S.revealedPositions.includes(i)) { pos=i; break; }
    }
  }
  if (pos===-1) return;

  S.revealedPositions.push(pos);
  S.currentInput[pos] = wordObj.word[pos];
  S.hintsLeft--;
  updateBoxes();

  // For scramble — mark corresponding letter as used
  if (S.level==='youngsters') {
    const scrBtns = [...document.querySelectorAll('.scramble-letter:not(.scr-del)')];
    const available = scrBtns.find(b=>b.textContent===wordObj.word[pos]&&!b.classList.contains('used'));
    if (available) {
      available.classList.add('used');
      const idx = parseInt(available.id.split('-')[1]);
      S.usedScrambleIndices.push(idx);
    }
  }

  document.getElementById('hint-btn').textContent = `💡 Hint (${S.hintsLeft})`;
  document.getElementById('hint-btn').disabled = S.hintsLeft<=0;
  document.getElementById('word-hint').textContent = S.hintsLeft>0 ? `💡 ${S.hintsLeft} hints left` : 'No more hints!';
  speak(`The letter at position ${pos+1} is ${wordObj.word[pos]}!`);

  if (!S.currentInput.includes('')) setTimeout(()=>checkWord(),400);
}

// ── SHOW RESULT ───────────────────────────────────────────
function showWordResult(correct, wordObj, pts) {
  document.getElementById('result-icon').textContent = correct?'🎉':'📖';
  document.getElementById('result-title').textContent = correct?'Brilliant!':'Good try!';
  document.getElementById('result-word').textContent = wordObj.word;
  document.getElementById('result-sub').textContent = wordObj.riddle.split('.')[0]+'.';
  const ptsEl = document.getElementById('result-pts');
  ptsEl.textContent = correct?`+${pts} EBCs!`:'+0 BeatCoins';
  ptsEl.style.color = correct?'#4ade80':'rgba(255,255,255,.4)';
  // GROWN UPS + EXPERTS: reveal image after answer
  if (S.level !== 'youngsters' && wordObj.photo) {
    document.getElementById('creature-wrap').style.display = 'flex';
    const img = document.getElementById('creature-img');
    img.src = wordObj.photo;
    img.style.display = 'block';
    img.onerror = () => { img.style.display='none'; };
    document.getElementById('riddle-wrap').style.display = 'none';
  }
  document.getElementById('result-panel').classList.add('show');

  S.wordIndex++;
  document.getElementById('word-count-val').textContent = `${S.wordIndex}/${S.wordsOrder.length}`;
  document.getElementById('progress-fill').style.width = `${(S.wordIndex/S.wordsOrder.length)*100}%`;

  if (S.wordIndex < S.wordsOrder.length) {
    document.getElementById('next-btn').style.display = 'block';
    document.getElementById('hint-btn').style.display = 'none';
  } else {
    setTimeout(()=>finishGame(), 1800);
  }
}

function nextWord() {
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('result-panel').classList.remove('show');
  loadWord();
}

// ── FINISH ────────────────────────────────────────────────
function finishGame() {
  S.gameActive = false;
  const bonus = LEVEL_CFG[S.level].bonusAll;
  S.beatcoins+=bonus; S.score+=bonus;
  saveLadBC(bonus); postGlobalScore(bonus);
  document.getElementById('bc-val').textContent = S.beatcoins;
  document.getElementById('score-val').textContent = S.score;
  saveStorage();

  document.getElementById('result-icon').textContent = '🏆';
  document.getElementById('result-title').textContent = 'Ocean Master!';
  document.getElementById('result-word').textContent = '🐙 🌊 🐠 🪸';
  document.getElementById('result-sub').textContent = 'You discovered all ocean words!';
  document.getElementById('result-pts').textContent = `+${bonus} Bonus BeatCoins!`;
  document.getElementById('result-pts').style.color = '#ffde59';
  document.getElementById('result-panel').classList.add('show');
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('hint-btn').style.display = 'none';
  document.getElementById('start-btn').textContent = '🔄 Play Again!';
  document.getElementById('start-btn').style.display = 'block';
  document.getElementById('start-btn').onclick = ()=>{ resetGame(); startGame(); };
  celebrate();
  speak(pick(RITA_COMPLETE));
  setTimeout(showBonusGame, 4500);
}

function showBonusGame() {
  const area = document.getElementById('bonus-area');
  if (!area) return;
  area.style.display = 'block';
  setTimeout(()=>{ area.scrollIntoView({behavior:'smooth',block:'center'}); },100);
  const msgs = {
    youngsters: "Amazing love! You have unlocked Tic-Tac-Toe Underwater! Going there in 5 seconds!",
    grownups: "Brilliant darling! Tic-Tac-Toe Underwater is your bonus! Off we go in 5 seconds!",
    experts: "Outstanding love! Tic-Tac-Toe Underwater awaits! Going there in 5 seconds!"
  };
  speak(msgs[S.level] || msgs.youngsters);
  // Countdown then auto-navigate
  let count = 5;
  const cd = document.getElementById('bonus-countdown');
  if (cd) cd.textContent = 'Going there in ' + count + ' seconds...';
  const iv = setInterval(() => {
    count--;
    if (cd) cd.textContent = count > 0 ? 'Going there in ' + count + ' seconds...' : 'Off we go!';
    if (count <= 0) { clearInterval(iv); goToBonusGame(); }
  }, 1000);
}

function goToBonusGame() {
  window.location.href = 'page2_tictactoe.html?level=' + S.level + '&from=ocean';
}

// ── NAVIGATION ────────────────────────────────────────────

// Save BeatCoins per chosen Lad for global scoreboard

function postGlobalScore(amount) {
  try {
    const lad = localStorage.getItem('askLovelyRitaV4_chosen_lad') || 'smart';
    fetch('https://empty-leaf-6e4b.alexmonteironeto.workers.dev/score', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ lad: lad, amount: amount })
    }).catch(()=>{});
  } catch(e) {}
}

function saveLadBC(amount) {
  try {
    const lad = localStorage.getItem('askLovelyRitaV4_chosen_lad') || 'smart';
    const key = 'askLovelyRitaV4_bc_' + lad;
    const current = Number(localStorage.getItem(key) || 0);
    localStorage.setItem(key, current + amount);
  } catch(e) {}
}

function goBack()    { window.location.href = 'page5_worlds.html'; }
function goChooseWorld(){ window.location.href='page5_worlds.html'; }
function goNextPage(){ var lv=localStorage.getItem('askLovelyRitaV4_level')||'youngsters'; window.location.href='page3_turntable.html?level='+lv+'&from=ocean'; }
function goHome()    { window.location.href = 'page1_landing.html'; }
function goForward() { window.location.href = 'page7_space.html'; }

// ── RITA VOICE ────────────────────────────────────────────
function speak(text) {
  if(localStorage.getItem('askLovelyRitaV4_mute')==='1') return;
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=0.88; u.pitch=1.1;
  const voices=window.speechSynthesis.getVoices();
  const brit=voices.find(v=>v.lang==='en-GB'&&v.name.toLowerCase().includes('female'))
          ||voices.find(v=>v.lang==='en-GB')
          ||voices.find(v=>v.lang.startsWith('en'));
  if(brit)u.voice=brit;
  const lad=document.getElementById('lad-bottom-img');
  if(lad){ lad.classList.add('speaking'); }
  u.onend=()=>{ if(lad) lad.classList.remove('speaking'); };
  window.speechSynthesis.speak(u);
}
function ritaSpeak() { speak(RITA_INTRO[S.level]); }
if(window.speechSynthesis){ window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices(); }

// ── CELEBRATE ─────────────────────────────────────────────
function celebrate() {
  const layer=document.getElementById('celebrate');
  layer.innerHTML='';
  const cols=['#4dc8ff','#00e5cc','#ffde59','#4ade80','#a855f7','#fff'];
  for(let i=0;i<45;i++){
    const el=document.createElement('div');
    el.className='cp';
    el.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*20}%;background:${cols[Math.floor(Math.random()*cols.length)]};animation-delay:${Math.random()*.7}s;animation-duration:${1.2+Math.random()*.9}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'};`;
    layer.appendChild(el);
  }
  setTimeout(()=>layer.innerHTML='',2800);
}

// ── HELPERS ───────────────────────────────────────────────
let toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),3000);
}
function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function setDevice(w,h,name){
  const p=document.getElementById('phone');
  p.style.width=w+'px'; p.style.height=h+'px';
  document.querySelectorAll('#device-bar button').forEach(b=>b.classList.toggle('active',b.textContent===name));
}

// ── BOOT ──────────────────────────────────────────────────
init();
</script>
