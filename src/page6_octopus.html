<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Lovely Rita — Octopus's Garden</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a14;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
  }

  /* ── DEVICE BAR ── */
  #device-bar {
    display: flex; gap: 8px; margin-bottom: 16px;
    flex-wrap: wrap; justify-content: center;
  }
  #device-bar button {
    background: #1a1a2e; border: 1px solid #333; color: #aaa;
    padding: 6px 12px; border-radius: 20px; font-size: 11px;
    cursor: pointer; transition: all .2s;
  }
  #device-bar button:hover, #device-bar button.active {
    background: #333; color: #fff; border-color: #666;
  }

  /* ── PHONE ── */
  #phone-outer {
    background: #1c1c1c; border-radius: 50px; padding: 12px;
    box-shadow: 0 0 0 2px #333, 0 20px 60px rgba(0,0,0,.8);
  }
  #phone {
    width: 369px; height: 828px; border-radius: 40px;
    overflow: hidden; position: relative;
    display: flex; flex-direction: column;
    background: #061a2e;
    transition: width .3s, height .3s;
  }
  #notch {
    position: absolute; top: 0; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 30px;
    background: #1c1c1c;
    border-radius: 0 0 20px 20px; z-index: 20;
  }
  #scroll-area {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 36px 14px 8px;
    scrollbar-width: none;
  }
  #scroll-area::-webkit-scrollbar { display: none; }

  /* ── OCEAN BG ── */
  #ocean-bg {
    position: absolute; inset: 0; z-index: 0;
    background: linear-gradient(180deg,
      #061a2e 0%, #0a3d6b 25%, #0d5a8a 55%, #0a7c6c 100%);
    border-radius: 40px; overflow: hidden;
  }
  .bg-bubble {
    position: absolute; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.06);
    animation: bg-rise var(--bd) ease-in infinite;
  }
  @keyframes bg-rise {
    0%   { transform: translateY(0); opacity:.5; }
    100% { transform: translateY(-900px); opacity:0; }
  }
  .bg-fish {
    position: absolute; font-size: var(--fs);
    animation: fish-drift var(--fd) linear infinite;
    opacity: .35;
  }
  @keyframes fish-drift {
    0%   { transform: translateX(-60px); }
    100% { transform: translateX(420px); }
  }

  /* ── NAV BAR ── */
  #nav-bar {
    flex-shrink: 0; display: flex; align-items: center;
    justify-content: space-around; padding: 8px 20px 12px;
    border-top: 1px solid rgba(255,255,255,.08);
    background: rgba(0,10,20,.6);
    backdrop-filter: blur(12px);
    position: relative; z-index: 10;
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; background: none; border: none;
    color: rgba(255,255,255,.5); cursor: pointer;
    padding: 5px 14px; border-radius: 12px;
    transition: all .2s; font-size: 10px;
  }
  .nav-btn:hover { background: rgba(255,255,255,.08); color:#fff; }
  .nav-btn .nav-icon { font-size: 20px; line-height: 1; }
  .nav-btn.nav-home { color: #4dc8ff; }

  /* ── HEADER ── */
  #page-header {
    text-align: center; margin-bottom: 10px;
    position: relative; z-index: 2;
  }
  #page-header h1 {
    font-size: 18px; font-weight: 900;
    letter-spacing: 1px; text-transform: uppercase;
    background: linear-gradient(135deg, #4dc8ff, #00e5cc, #4dc8ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 16px rgba(77,200,255,.6));
  }
  #page-header p {
    font-size: 10px; color: rgba(255,255,255,.4);
    margin-top: 2px; letter-spacing: .5px;
  }

  /* ── LEVEL TABS ── */
  #level-tabs {
    display: flex; gap: 5px; justify-content: center;
    margin-bottom: 10px; position: relative; z-index: 2;
  }
  #level-tabs button {
    padding: 4px 10px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.05); color: rgba(255,255,255,.5);
    font-size: 9px; font-weight: 700; cursor: pointer;
    transition: all .2s; text-transform: uppercase;
  }
  #level-tabs button.active {
    background: linear-gradient(135deg,#4dc8ff,#00e5cc);
    border-color: transparent; color: #000; font-weight:900;
  }

  /* ── RITA + LAD ROW ── */
  #characters-row {
    display: flex; gap: 8px; align-items: flex-end;
    margin-bottom: 10px; position: relative; z-index: 2;
  }
  #rita-wrap {
    flex: 1;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(77,200,255,.3);
    border-radius: 14px 14px 14px 4px;
    padding: 9px 28px 9px 10px;
    position: relative;
  }
  #rita-name { font-size: 9px; font-weight:700; color:#4dc8ff; text-transform:uppercase; letter-spacing:.8px; margin-bottom:3px; }
  #rita-text { font-size: 11px; color: rgba(255,255,255,.8); line-height:1.5; }
  #rita-speak-btn {
    position: absolute; top:7px; right:7px;
    background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
    border-radius:50%; width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; cursor:pointer; color:#fff; transition:all .2s;
  }
  #rita-speak-btn:hover { background:rgba(255,255,255,.2); }

  #lad-wrap {
    width: 70px; flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  #lad-img-el {
    width: 68px; height: auto;
    filter: drop-shadow(0 4px 12px rgba(77,200,255,.5));
    animation: lad-float 2.5s ease-in-out infinite alternate;
  }
  #lad-img-el.speaking {
    filter: drop-shadow(0 0 16px rgba(77,200,255,.9)) drop-shadow(0 4px 12px rgba(77,200,255,.5));
  }
  @keyframes lad-float {
    from { transform: translateY(0) rotate(-2deg); }
    to   { transform: translateY(-6px) rotate(2deg); }
  }
  #lad-label { font-size:9px; color:rgba(255,255,255,.5); text-align:center; }

  /* ── STATUS BAR ── */
  #status-bar {
    display:flex; gap:8px; margin-bottom:10px;
    position:relative; z-index:2;
  }
  .stat-card {
    flex:1; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:10px; padding:5px 10px;
  }
  .stat-label { font-size:8px; color:rgba(255,255,255,.3); text-transform:uppercase; letter-spacing:.5px; }
  .stat-val { font-size:14px; font-weight:900; }
  #bc-val { color:#ffde59; }
  #score-val { color:#4dc8ff; }
  #word-count-val { color:#00e5cc; }

  /* ── WORD DISPLAY ── */
  #word-section {
    background: rgba(0,0,0,.3);
    border: 1px solid rgba(77,200,255,.25);
    border-radius: 18px; padding: 14px;
    margin-bottom: 10px;
    position: relative; z-index: 2;
    text-align: center;
  }
  #word-category {
    font-size: 9px; color: rgba(255,255,255,.4);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
  }
  #word-image {
    font-size: 48px; line-height: 1;
    margin-bottom: 8px;
    animation: word-pulse 2s ease-in-out infinite alternate;
  }
  @keyframes word-pulse {
    from { transform: scale(1); }
    to   { transform: scale(1.08); }
  }
  #word-hint {
    font-size: 11px; color: rgba(255,255,255,.6);
    margin-bottom: 10px; font-style: italic;
    min-height: 16px;
  }

  /* ── LETTER BOXES ── */
  #letter-boxes {
    display: flex; gap: 6px; justify-content: center;
    flex-wrap: wrap; margin-bottom: 8px;
  }
  .letter-box {
    width: 34px; height: 40px;
    background: rgba(255,255,255,.08);
    border: 2px solid rgba(77,200,255,.4);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900;
    color: #fff; text-transform: uppercase;
    transition: all .25s;
    position: relative;
  }
  .letter-box.filled {
    background: rgba(77,200,255,.15);
    border-color: #4dc8ff;
    transform: scale(1.05);
  }
  .letter-box.correct {
    background: rgba(74,222,128,.2);
    border-color: #4ade80;
    animation: box-correct .4s ease;
  }
  .letter-box.wrong {
    background: rgba(248,113,113,.15);
    border-color: #f87171;
    animation: box-wrong .4s ease;
  }
  @keyframes box-correct {
    0%,100% { transform:scale(1); }
    50%      { transform:scale(1.15); }
  }
  @keyframes box-wrong {
    0%,100% { transform:translateX(0); }
    25%      { transform:translateX(-4px); }
    75%      { transform:translateX(4px); }
  }
  .letter-box.revealed {
    background: rgba(0,229,204,.2);
    border-color: #00e5cc;
  }

  /* ── SCRAMBLED LETTERS (Youngsters) ── */
  #scramble-section {
    display: none;
    flex-wrap: wrap; gap: 7px; justify-content: center;
    margin-bottom: 10px; position: relative; z-index: 2;
  }
  .scramble-letter {
    width: 38px; height: 44px;
    background: linear-gradient(135deg,#0d5a8a,#0a7c6c);
    border: 2px solid rgba(77,200,255,.5);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; color: #fff;
    text-transform: uppercase; cursor: pointer;
    transition: all .15s;
    box-shadow: 0 3px 10px rgba(0,0,0,.3);
    user-select: none;
  }
  .scramble-letter:hover { transform: translateY(-3px) scale(1.05); background: linear-gradient(135deg,#1a7ab5,#0d9e8a); }
  .scramble-letter:active { transform: scale(.95); }
  .scramble-letter.used { opacity:.25; pointer-events:none; transform:scale(.9); }

  /* ── KEYBOARD (Grown Ups / Experts) ── */
  #keyboard-section {
    display: none;
    flex-direction: column; gap: 5px;
    margin-bottom: 10px; position: relative; z-index: 2;
  }
  .key-row { display: flex; gap: 4px; justify-content: center; }
  .key {
    height: 40px; min-width: 30px; padding: 0 4px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px;
    color: #fff; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .12s;
    display: flex; align-items: center; justify-content: center;
    text-transform: uppercase;
  }
  .key:hover { background: rgba(77,200,255,.25); border-color:#4dc8ff; }
  .key:active { transform: scale(.92); }
  .key.used { opacity:.2; pointer-events:none; }
  .key-del { min-width: 46px; font-size:16px; }
  .key-submit {
    min-width: 80px; font-size:11px;
    background: linear-gradient(135deg,#4dc8ff,#00e5cc);
    border-color: transparent; color:#000; font-weight:900;
  }
  .key-submit:hover { filter: brightness(1.1); }

  /* ── ACTION BTNS ── */
  #action-btns {
    display: flex; gap: 8px; margin-bottom: 10px;
    position: relative; z-index: 2;
  }
  .act-btn {
    flex:1; padding:10px; border:none; border-radius:26px;
    font-size:12px; font-weight:800; letter-spacing:.5px;
    text-transform:uppercase; cursor:pointer;
    transition:transform .15s, opacity .3s;
    position:relative; overflow:hidden;
  }
  .act-btn::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.14),transparent);
    border-radius:inherit;
  }
  .act-btn:hover:not(:disabled) { transform:scale(1.03); }
  .act-btn:disabled { opacity:.35; cursor:not-allowed; }
  #start-btn {
    background: linear-gradient(135deg,#4dc8ff,#00e5cc);
    color:#000; box-shadow:0 4px 16px rgba(77,200,255,.4);
  }
  #next-btn {
    background:rgba(255,255,255,.07);
    border:1px solid #4dc8ff; color:#4dc8ff; display:none;
  }
  #hint-btn {
    flex:0 0 auto; padding:10px 14px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    border-radius:26px; color:rgba(255,255,255,.6);
    font-size:11px; font-weight:700; cursor:pointer;
    transition:all .2s;
  }
  #hint-btn:hover { background:rgba(255,255,255,.12); color:#fff; }
  #hint-btn:disabled { opacity:.3; cursor:not-allowed; }

  /* ── RESULT ── */
  #result-panel {
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px; padding:12px;
    margin-bottom:10px; text-align:center;
    display:none; flex-direction:column;
    align-items:center; gap:4px;
    position:relative; z-index:2;
    animation:slideIn .4s ease;
  }
  #result-panel.show { display:flex; }
  @keyframes slideIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
  #result-icon { font-size:28px; }
  #result-title { font-size:14px; font-weight:800; color:#4dc8ff; }
  #result-word { font-size:20px; font-weight:900; color:#00e5cc; letter-spacing:2px; text-transform:uppercase; }
  #result-sub { font-size:10px; color:rgba(255,255,255,.45); }
  #result-pts { font-size:18px; font-weight:900; }

  /* ── PROGRESS ── */
  #progress-bar-wrap {
    position:relative; z-index:2;
    margin-bottom:8px;
  }
  #progress-label {
    font-size:9px; color:rgba(255,255,255,.35);
    text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px;
  }
  #progress-track {
    height:6px; background:rgba(255,255,255,.08);
    border-radius:3px; overflow:hidden;
  }
  #progress-fill {
    height:100%;
    background:linear-gradient(90deg,#4dc8ff,#00e5cc);
    border-radius:3px;
    transition:width .4s ease;
    width:0%;
  }

  /* ── CELEBRATE ── */
  #celebrate {
    position:absolute; inset:0; pointer-events:none;
    z-index:25; overflow:hidden; border-radius:40px;
  }
  .cp {
    position:absolute; border-radius:2px;
    animation:cf 1.6s ease-out forwards;
  }
  @keyframes cf {
    0%   { transform:translateY(-20px) rotate(0deg); opacity:1; }
    100% { transform:translateY(900px) rotate(720deg); opacity:0; }
  }

  /* ── TOAST ── */
  #toast {
    position:fixed; bottom:30px; left:50%;
    transform:translateX(-50%) translateY(80px);
    background:rgba(6,26,46,.95); border:1px solid #4dc8ff;
    border-radius:20px; padding:9px 18px; font-size:12px; color:#fff;
    z-index:1000; transition:transform .3s,opacity .3s;
    opacity:0; white-space:nowrap; pointer-events:none;
  }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body>

<div id="device-bar">
  <button onclick="setDevice(393,852,'iPhone 14 Pro')" class="active">iPhone 14 Pro</button>
  <button onclick="setDevice(375,667,'iPhone SE')">iPhone SE</button>
  <button onclick="setDevice(360,800,'Galaxy S23')">Galaxy S23</button>
  <button onclick="setDevice(412,915,'Pixel 7')">Pixel 7</button>
  <button onclick="setDevice(430,932,'iPhone 14 Max')">iPhone 14 Max</button>
</div>

<div id="phone-outer">
  <div id="phone">
    <div id="notch"></div>
    <div id="ocean-bg"></div>
    <div id="celebrate"></div>

    <div id="scroll-area">

      <!-- HEADER -->
      <div id="page-header">
        <h1>🐙 Octopus's Garden</h1>
        <p>The Funny Lad's underwater world!</p>
      </div>

      <!-- LEVEL TABS -->
      <div id="level-tabs">
        <button onclick="setLevel('youngsters')" class="active">🟣 Youngsters</button>
        <button onclick="setLevel('grownups')">🟡 Grown Ups</button>
        <button onclick="setLevel('experts')">⭐ Experts</button>
      </div>

      <!-- CHARACTERS ROW -->
      <div id="characters-row">
        <div id="rita-wrap">
          <div id="rita-name">♪ Lovely Rita</div>
          <div id="rita-text">Loading...</div>
          <button id="rita-speak-btn" onclick="ritaSpeak()">🔊</button>
        </div>
        <div id="lad-wrap">
          <img id="lad-img-el"
            src="https://alexmonteiro65.github.io/ask-lovely-rita/src/Funny_Aqua_Lad.png"
            alt="Funny Lad"
            onerror="this.style.display='none'"/>
          <div id="lad-label">Funny Lad</div>
        </div>
      </div>

      <!-- STATUS -->
      <div id="status-bar">
        <div class="stat-card">
          <div class="stat-label">BeatCoins</div>
          <div class="stat-val" id="bc-val">80</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Score</div>
          <div class="stat-val" id="score-val">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Words</div>
          <div class="stat-val" id="word-count-val">0/8</div>
        </div>
      </div>

      <!-- PROGRESS -->
      <div id="progress-bar-wrap">
        <div id="progress-label">Progress</div>
        <div id="progress-track"><div id="progress-fill"></div></div>
      </div>

      <!-- WORD DISPLAY -->
      <div id="word-section">
        <div id="word-category">Ocean Word</div>
        <div id="word-image">🌊</div>
        <div id="word-hint">Press Start to dive in!</div>
        <div id="letter-boxes"></div>
      </div>

      <!-- SCRAMBLED LETTERS — Youngsters -->
      <div id="scramble-section"></div>

      <!-- KEYBOARD — Grown Ups / Experts -->
      <div id="keyboard-section">
        <div class="key-row" id="key-row-1"></div>
        <div class="key-row" id="key-row-2"></div>
        <div class="key-row" id="key-row-3"></div>
      </div>

      <!-- ACTION BTNS -->
      <div id="action-btns">
        <button class="act-btn" id="start-btn" onclick="startGame()">🐙 Dive In!</button>
        <button class="act-btn" id="next-btn" onclick="nextWord()">Next Word ▶</button>
        <button class="act-btn" id="hint-btn" onclick="useHint()" style="display:none">💡 Hint</button>
      </div>

      <!-- RESULT -->
      <div id="result-panel">
        <div id="result-icon">🌊</div>
        <div id="result-title"></div>
        <div id="result-word"></div>
        <div id="result-sub"></div>
        <div id="result-pts"></div>
      </div>

    </div><!-- /scroll-area -->

    <!-- NAV BAR -->
    <nav id="nav-bar">
      <button class="nav-btn" onclick="goBack()">
        <span class="nav-icon">◀️</span><span>Back</span>
      </button>
      <button class="nav-btn nav-home" onclick="goHome()">
        <span class="nav-icon">🏠</span><span>Home</span>
      </button>
      <button class="nav-btn" onclick="goForward()">
        <span class="nav-icon">▶️</span><span>Next</span>
      </button>
    </nav>

  </div>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════
//  CONFIG
// ════════════════════════════════

const BASE = 'https://alexmonteiro65.github.io/ask-lovely-rita/src/';

// Ocean words — emoji, hint, category
const WORDS = [
  { word:'CORAL',     emoji:'🪸', hint:'A colourful reef structure where fish love to hide',      cat:'Ocean Life' },
  { word:'OCTOPUS',  emoji:'🐙', hint:'The Funny Lad\'s favourite eight-armed friend',            cat:'Ocean Life' },
  { word:'SEAHORSE',  emoji:'🐠', hint:'A tiny horse that swims upright in the sea',              cat:'Ocean Life' },
  { word:'JELLYFISH', emoji:'🪼', hint:'A transparent creature that glows in the dark ocean',     cat:'Ocean Life' },
  { word:'SEAWEED',   emoji:'🌿', hint:'Green plants that grow on the ocean floor',               cat:'Ocean Plants' },
  { word:'DOLPHIN',   emoji:'🐬', hint:'A smart and friendly ocean mammal that loves to jump',    cat:'Ocean Life' },
  { word:'STARFISH',  emoji:'⭐', hint:'A five-armed creature found on the ocean floor',          cat:'Ocean Life' },
  { word:'SUBMARINE', emoji:'🚢', hint:'A vessel that travels deep under the sea',                cat:'Ocean Vehicles' },
  { word:'TREASURE',  emoji:'💎', hint:'What pirates search for under the deep blue sea',         cat:'Ocean Adventure' },
  { word:'CURRENT',   emoji:'🌊', hint:'The movement of water flowing through the ocean',         cat:'Ocean Science' },
];

// Rita speeches
const RITA_INTRO = {
  youngsters: "Hello love! Welcome to Octopus's Garden! The Funny Lad is your guide today. Tap the letters to spell the ocean word you see. You have THREE chances to use a hint if you get stuck!",
  grownups:   "Hello there! Time to explore the deep! Type out each ocean word using the keyboard. You have TWO hints available. Think carefully darling and spell it right!",
  experts:    "Right then! Experts only down here! Type each ocean word from memory with NO hints. One shot per word darling. Can you handle the pressure of the deep?",
};
const RITA_CORRECT = [
  "Brilliant! You spelt it perfectly! The Funny Lad is doing a little underwater dance for you!",
  "Smashing! Right on the mark! Even the octopus is impressed darling!",
  "Wonderful! You really know your ocean words! The Funny Lad gives you a thumbs up!",
  "Absolutely spot on love! The fish are cheering for you down here!",
];
const RITA_WRONG = [
  "Oh nearly! The word was hiding just below the surface. Have a look and try the next one!",
  "Not quite this time darling! But no points lost. Swim on to the next word!",
  "Almost got it! The ocean keeps its secrets well. On to the next adventure!",
];
const RITA_COMPLETE = [
  "Oh how wonderful! You've explored the whole garden! The Funny Lad is so proud of you darling!",
  "Brilliant work love! Every ocean word discovered! The Funny Lad says you swim like a fish!",
];

// Level config
const LEVEL_CFG = {
  youngsters: { hints:3, bonusCorrect:20, bonusAll:100, inputType:'scramble', ladImg:'Funny_Aqua_Lad.png' },
  grownups:   { hints:2, bonusCorrect:30, bonusAll:150, inputType:'keyboard', ladImg:'Aqua_Lad.png' },
  experts:    { hints:0, bonusCorrect:50, bonusAll:250, inputType:'keyboard', ladImg:'Aqua_Lad.png' },
};

const KEYBOARD_ROWS = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['DEL','Z','X','C','V','B','N','M','✓'],
];

// ════════════════════════════════
//  STATE
// ════════════════════════════════

let S = {
  level: 'youngsters',
  beatcoins: 80,
  score: 0,
  wordIndex: 0,
  wordsOrder: [],
  currentInput: [],
  gameActive: false,
  wordComplete: false,
  hintsLeft: 3,
  hintsUsedThisWord: 0,
  revealedPositions: [],
  usedScrambleIndices: [],
  scrambleMap: [], // maps scramble slot → original letter index
};

// ════════════════════════════════
//  STORAGE
// ════════════════════════════════

function loadStorage() {
  try {
    const d = JSON.parse(localStorage.getItem('askLovelyRitaV4')||'{}');
    if (d.theme && LEVEL_CFG[d.theme]) S.level = d.theme;
    if (typeof d.beatcoins==='number') S.beatcoins = d.beatcoins;
  } catch(e) {}
}
function saveStorage() {
  try {
    const d = JSON.parse(localStorage.getItem('askLovelyRitaV4')||'{}');
    d.beatcoins = S.beatcoins;
    localStorage.setItem('askLovelyRitaV4', JSON.stringify(d));
  } catch(e) {}
}

// ════════════════════════════════
//  INIT
// ════════════════════════════════

function init() {
  loadStorage();
  buildOceanBg();
  applyLevel(S.level);
  highlightTab(S.level);
  setTimeout(() => speak(RITA_INTRO[S.level]), 800);
}

// ════════════════════════════════
//  LEVEL
// ════════════════════════════════

function setLevel(lvl) {
  S.level = lvl;
  window.speechSynthesis && window.speechSynthesis.cancel();
  applyLevel(lvl);
  highlightTab(lvl);
  setTimeout(() => speak(RITA_INTRO[lvl]), 400);
}

function highlightTab(lvl) {
  document.querySelectorAll('#level-tabs button').forEach(b => {
    b.classList.toggle('active',
      (lvl==='youngsters'&&b.textContent.includes('Young'))||
      (lvl==='grownups'&&b.textContent.includes('Grown'))||
      (lvl==='experts'&&b.textContent.includes('Expert'))
    );
  });
}

function applyLevel(lvl) {
  const cfg = LEVEL_CFG[lvl];

  // Rita text
  document.getElementById('rita-text').textContent = RITA_INTRO[lvl];

  // Lad image
  const ladEl = document.getElementById('lad-img-el');
  ladEl.src = BASE + cfg.ladImg;
  ladEl.style.display = 'block';

  // BeatCoins
  document.getElementById('bc-val').textContent = S.beatcoins;

  // Keyboard visibility
  document.getElementById('scramble-section').style.display = 'none';
  document.getElementById('keyboard-section').style.display = 'none';

  // Build keyboard if needed
  if (cfg.inputType === 'keyboard' && !document.getElementById('key-row-1').children.length) {
    buildKeyboard();
  }

  // Reset game state
  resetGame();
}

// ════════════════════════════════
//  OCEAN BACKGROUND
// ════════════════════════════════

function buildOceanBg() {
  const bg = document.getElementById('ocean-bg');
  // Bubbles
  for (let i = 0; i < 12; i++) {
    const b = document.createElement('div');
    b.className = 'bg-bubble';
    const size = 4 + Math.random() * 12;
    b.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      bottom:${Math.random()*40}%;
      --bd:${3+Math.random()*5}s;
      animation-delay:${Math.random()*5}s;
    `;
    bg.appendChild(b);
  }
  // Fish
  const fishEmoji = ['🐠','🐡','🐟','🦈'];
  for (let i = 0; i < 5; i++) {
    const f = document.createElement('div');
    f.className = 'bg-fish';
    f.textContent = fishEmoji[Math.floor(Math.random()*fishEmoji.length)];
    f.style.cssText = `
      top:${20+Math.random()*60}%;
      --fs:${16+Math.random()*14}px;
      --fd:${8+Math.random()*10}s;
      animation-delay:${Math.random()*8}s;
    `;
    bg.appendChild(f);
  }
}

// ════════════════════════════════
//  KEYBOARD
// ════════════════════════════════

function buildKeyboard() {
  KEYBOARD_ROWS.forEach((row, ri) => {
    const rowEl = document.getElementById(`key-row-${ri+1}`);
    rowEl.innerHTML = '';
    row.forEach(letter => {
      const btn = document.createElement('button');
      btn.className = 'key' + (letter==='DEL'||letter==='✓'?' key-'+(letter==='DEL'?'del':'submit'):'');
      btn.textContent = letter;
      btn.dataset.key = letter;
      btn.onclick = () => handleKey(letter);
      rowEl.appendChild(btn);
    });
  });
}

// ════════════════════════════════
//  GAME FLOW
// ════════════════════════════════

function resetGame() {
  S.score = 0;
  S.wordIndex = 0;
  S.wordsOrder = shuffle([...Array(WORDS.length).keys()]).slice(0, 8);
  S.gameActive = false;
  S.wordComplete = false;
  S.hintsLeft = LEVEL_CFG[S.level].hints;
  S.currentInput = [];
  S.revealedPositions = [];

  document.getElementById('score-val').textContent = '0';
  document.getElementById('word-count-val').textContent = `0/8`;
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('word-image').textContent = '🌊';
  document.getElementById('word-hint').textContent = "Press Start to dive in!";
  document.getElementById('word-category').textContent = 'Ocean Word';
  document.getElementById('letter-boxes').innerHTML = '';
  document.getElementById('scramble-section').innerHTML = '';
  document.getElementById('scramble-section').style.display = 'none';
  document.getElementById('keyboard-section').style.display = 'none';
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('start-btn').style.display = 'block';
  document.getElementById('start-btn').textContent = '🐙 Dive In!';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('hint-btn').style.display = 'none';
  resetKeyboard();
}

function startGame() {
  S.gameActive = true;
  document.getElementById('start-btn').style.display = 'none';
  document.getElementById('result-panel').classList.remove('show');
  loadWord();
}

function loadWord() {
  if (S.wordIndex >= S.wordsOrder.length) { finishGame(); return; }

  const cfg = LEVEL_CFG[S.level];
  const wordObj = WORDS[S.wordsOrder[S.wordIndex]];
  S.currentInput = Array(wordObj.word.length).fill('');
  S.wordComplete = false;
  S.hintsUsedThisWord = 0;
  S.revealedPositions = [];
  S.usedScrambleIndices = [];

  // Display
  document.getElementById('word-category').textContent = wordObj.cat;
  document.getElementById('word-image').textContent = wordObj.emoji;
  document.getElementById('word-hint').textContent = cfg.hints > 0
    ? `💡 ${S.hintsLeft} hint${S.hintsLeft!==1?'s':''} remaining`
    : 'No hints in Expert mode!';
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('next-btn').style.display = 'none';

  // Progress
  document.getElementById('word-count-val').textContent = `${S.wordIndex}/${S.wordsOrder.length}`;
  document.getElementById('progress-fill').style.width = `${(S.wordIndex/S.wordsOrder.length)*100}%`;

  // Build letter boxes
  buildLetterBoxes(wordObj.word);

  // Input method
  if (cfg.inputType === 'scramble') {
    buildScramble(wordObj.word);
    document.getElementById('scramble-section').style.display = 'flex';
    document.getElementById('keyboard-section').style.display = 'none';
    document.getElementById('hint-btn').style.display = 'block';
    document.getElementById('hint-btn').disabled = S.hintsLeft <= 0;
  } else {
    document.getElementById('scramble-section').style.display = 'none';
    document.getElementById('keyboard-section').style.display = 'flex';
    document.getElementById('hint-btn').style.display = cfg.hints > 0 ? 'block' : 'none';
    if (cfg.hints > 0) document.getElementById('hint-btn').disabled = S.hintsLeft <= 0;
    resetKeyboard();
  }
}

// ════════════════════════════════
//  LETTER BOXES
// ════════════════════════════════

function buildLetterBoxes(word) {
  const container = document.getElementById('letter-boxes');
  container.innerHTML = '';
  for (let i = 0; i < word.length; i++) {
    const box = document.createElement('div');
    box.className = 'letter-box';
    box.id = `box-${i}`;
    container.appendChild(box);
  }
}

function updateBoxes() {
  S.currentInput.forEach((letter, i) => {
    const box = document.getElementById(`box-${i}`);
    if (!box) return;
    box.textContent = letter;
    if (S.revealedPositions.includes(i)) {
      box.className = 'letter-box revealed';
    } else {
      box.className = letter ? 'letter-box filled' : 'letter-box';
    }
  });
}

// ════════════════════════════════
//  SCRAMBLE (Youngsters)
// ════════════════════════════════

function buildScramble(word) {
  const section = document.getElementById('scramble-section');
  section.innerHTML = '';
  const letters = shuffle([...word]);
  S.scrambleMap = letters.map((l, i) => ({ letter:l, idx:i, used:false }));

  letters.forEach((letter, i) => {
    const btn = document.createElement('div');
    btn.className = 'scramble-letter';
    btn.textContent = letter;
    btn.id = `scr-${i}`;
    btn.onclick = () => useScrambleLetter(i, letter);
    section.appendChild(btn);
  });

  // Add backspace button
  const del = document.createElement('div');
  del.className = 'scramble-letter';
  del.textContent = '⌫';
  del.style.background = 'linear-gradient(135deg,#5a1a1a,#8a2020)';
  del.style.borderColor = 'rgba(248,113,113,.5)';
  del.onclick = () => deleteLastScramble();
  section.appendChild(del);
}

function useScrambleLetter(idx, letter) {
  if (!S.gameActive || S.wordComplete) return;
  const nextEmpty = S.currentInput.findIndex((l, i) => !l && !S.revealedPositions.includes(i));
  if (nextEmpty === -1) return;

  S.currentInput[nextEmpty] = letter;
  S.usedScrambleIndices.push(idx);
  document.getElementById(`scr-${idx}`).classList.add('used');
  updateBoxes();

  // Auto-check when all filled
  if (!S.currentInput.includes('')) {
    setTimeout(() => checkWord(), 300);
  }
}

function deleteLastScramble() {
  if (!S.gameActive || S.wordComplete) return;
  // Find last non-revealed filled position
  let lastFilled = -1;
  for (let i = S.currentInput.length-1; i >= 0; i--) {
    if (S.currentInput[i] && !S.revealedPositions.includes(i)) {
      lastFilled = i; break;
    }
  }
  if (lastFilled === -1) return;

  S.currentInput[lastFilled] = '';
  // Re-enable last used scramble
  const lastScr = S.usedScrambleIndices.pop();
  if (lastScr !== undefined) {
    document.getElementById(`scr-${lastScr}`)?.classList.remove('used');
  }
  updateBoxes();
}

// ════════════════════════════════
//  KEYBOARD (Grown Ups / Experts)
// ════════════════════════════════

function handleKey(key) {
  if (!S.gameActive || S.wordComplete) return;
  if (key === 'DEL') {
    // Delete last non-revealed
    for (let i = S.currentInput.length-1; i >= 0; i--) {
      if (S.currentInput[i] && !S.revealedPositions.includes(i)) {
        S.currentInput[i] = ''; updateBoxes(); return;
      }
    }
  } else if (key === '✓') {
    checkWord();
  } else {
    const nextEmpty = S.currentInput.findIndex((l, i) => !l && !S.revealedPositions.includes(i));
    if (nextEmpty === -1) return;
    S.currentInput[nextEmpty] = key;
    document.querySelector(`.key[data-key="${key}"]`)?.classList.add('used');
    updateBoxes();
  }
}

function resetKeyboard() {
  document.querySelectorAll('.key').forEach(k => k.classList.remove('used'));
}

// ════════════════════════════════
//  CHECK WORD
// ════════════════════════════════

function checkWord() {
  const wordObj = WORDS[S.wordsOrder[S.wordIndex]];
  const attempt = S.currentInput.join('').toUpperCase();
  const correct = wordObj.word.toUpperCase();

  if (attempt === correct) {
    // CORRECT
    S.wordComplete = true;
    const cfg = LEVEL_CFG[S.level];
    const earned = cfg.bonusCorrect;
    S.score += earned;
    S.beatcoins += earned;
    document.getElementById('score-val').textContent = S.score;
    document.getElementById('bc-val').textContent = S.beatcoins;
    saveStorage();

    // Flash boxes green
    for (let i = 0; i < correct.length; i++) {
      setTimeout(() => {
        const box = document.getElementById(`box-${i}`);
        if (box) box.className = 'letter-box correct';
      }, i * 60);
    }

    setTimeout(() => {
      showResult(true, wordObj, earned);
      celebrate();
      speak(pick(RITA_CORRECT));
    }, correct.length * 60 + 200);

  } else {
    // WRONG
    for (let i = 0; i < correct.length; i++) {
      const box = document.getElementById(`box-${i}`);
      if (box && !S.revealedPositions.includes(i)) box.className = 'letter-box wrong';
    }
    setTimeout(() => {
      updateBoxes();
      // If experts — show correct answer and move on
      if (S.level === 'experts') {
        S.wordComplete = true;
        revealAnswer(wordObj);
        showResult(false, wordObj, 0);
        speak(pick(RITA_WRONG));
      } else {
        // Clear non-revealed inputs
        S.currentInput = S.currentInput.map((l,i) => S.revealedPositions.includes(i) ? l : '');
        S.usedScrambleIndices = [];
        // Re-enable scramble buttons
        document.querySelectorAll('.scramble-letter:not(:last-child)').forEach(b => b.classList.remove('used'));
        resetKeyboard();
        updateBoxes();
        toast('Not quite! Try again love!');
      }
    }, 600);
  }
}

function revealAnswer(wordObj) {
  for (let i = 0; i < wordObj.word.length; i++) {
    S.currentInput[i] = wordObj.word[i];
    if (!S.revealedPositions.includes(i)) S.revealedPositions.push(i);
  }
  updateBoxes();
}

// ════════════════════════════════
//  HINT
// ════════════════════════════════

function useHint() {
  if (S.hintsLeft <= 0 || S.wordComplete) return;
  const wordObj = WORDS[S.wordsOrder[S.wordIndex]];

  // Find first unrevealed empty position
  let pos = -1;
  for (let i = 0; i < wordObj.word.length; i++) {
    if (!S.revealedPositions.includes(i) && !S.currentInput[i]) {
      pos = i; break;
    }
  }
  if (pos === -1) {
    // Find first unrevealed position regardless
    for (let i = 0; i < wordObj.word.length; i++) {
      if (!S.revealedPositions.includes(i)) { pos = i; break; }
    }
  }
  if (pos === -1) return;

  S.revealedPositions.push(pos);
  S.currentInput[pos] = wordObj.word[pos];
  S.hintsLeft--;
  S.hintsUsedThisWord++;
  updateBoxes();

  document.getElementById('word-hint').textContent =
    S.hintsLeft > 0 ? `💡 ${S.hintsLeft} hint${S.hintsLeft!==1?'s':''} remaining` : 'No more hints!';
  document.getElementById('hint-btn').disabled = S.hintsLeft <= 0;

  // For scramble: mark that letter as used
  if (S.level === 'youngsters') {
    // find available scramble button with that letter
    const scrMap = [...document.querySelectorAll('.scramble-letter:not(:last-child)')];
    const available = scrMap.find(b => b.textContent === wordObj.word[pos] && !b.classList.contains('used'));
    if (available) {
      available.classList.add('used');
      const idx = parseInt(available.id.split('-')[1]);
      S.usedScrambleIndices.push(idx);
    }
  }

  speak(`The letter at position ${pos+1} is ${wordObj.word[pos]}!`);

  // Check if complete
  if (!S.currentInput.includes('')) {
    setTimeout(() => checkWord(), 400);
  }
}

// ════════════════════════════════
//  SHOW RESULT
// ════════════════════════════════

function showResult(correct, wordObj, pts) {
  const panel = document.getElementById('result-panel');
  document.getElementById('result-icon').textContent = correct ? '🎉' : '😔';
  document.getElementById('result-title').textContent = correct ? 'Correct!' : 'Not quite!';
  document.getElementById('result-word').textContent = wordObj.word;
  document.getElementById('result-sub').textContent = correct
    ? wordObj.hint
    : `The word was: ${wordObj.word}`;
  const ptsEl = document.getElementById('result-pts');
  ptsEl.textContent = correct ? `+${pts} BeatCoins!` : '+0 BeatCoins';
  ptsEl.style.color = correct ? '#4ade80' : 'rgba(255,255,255,.4)';
  panel.classList.add('show');

  S.wordIndex++;
  document.getElementById('word-count-val').textContent = `${S.wordIndex}/${S.wordsOrder.length}`;
  document.getElementById('progress-fill').style.width = `${(S.wordIndex/S.wordsOrder.length)*100}%`;

  if (S.wordIndex < S.wordsOrder.length) {
    document.getElementById('next-btn').style.display = 'block';
    document.getElementById('hint-btn').style.display = 'none';
  } else {
    setTimeout(() => finishGame(), 1500);
  }
}

function nextWord() {
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('result-panel').classList.remove('show');
  resetKeyboard();
  loadWord();
}

// ════════════════════════════════
//  FINISH GAME
// ════════════════════════════════

function finishGame() {
  S.gameActive = false;
  const cfg = LEVEL_CFG[S.level];
  const bonus = cfg.bonusAll;
  S.beatcoins += bonus;
  S.score += bonus;
  document.getElementById('bc-val').textContent = S.beatcoins;
  document.getElementById('score-val').textContent = S.score;
  saveStorage();

  document.getElementById('result-icon').textContent = '🏆';
  document.getElementById('result-title').textContent = "Ocean Master!";
  document.getElementById('result-word').textContent = '🐙 🌊 🐠 🪸';
  document.getElementById('result-sub').textContent = `You discovered all 8 ocean words!`;
  document.getElementById('result-pts').textContent = `+${bonus} Bonus BeatCoins!`;
  document.getElementById('result-pts').style.color = '#ffde59';
  document.getElementById('result-panel').classList.add('show');
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('hint-btn').style.display = 'none';
  document.getElementById('start-btn').textContent = '🔄 Play Again!';
  document.getElementById('start-btn').style.display = 'block';
  document.getElementById('start-btn').onclick = () => { resetGame(); startGame(); };

  celebrate();
  speak(pick(RITA_COMPLETE));
}

// ════════════════════════════════
//  NAVIGATION
// ════════════════════════════════

function goBack()    { toast('◀️ Going back... (page5 coming soon)'); }
function goHome()    { toast('🏠 Going home... (index.html coming soon)'); }
function goForward() { toast('▶️ Next... (coming soon)'); }

// ════════════════════════════════
//  RITA VOICE
// ════════════════════════════════

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=0.9; u.pitch=1.1;
  const voices = window.speechSynthesis.getVoices();
  const brit = voices.find(v=>v.lang==='en-GB'&&v.name.toLowerCase().includes('female'))
            || voices.find(v=>v.lang==='en-GB')
            || voices.find(v=>v.lang.startsWith('en'));
  if (brit) u.voice = brit;
  const img = document.getElementById('lad-img-el');
  img.classList.add('speaking');
  u.onend = () => img.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}

function ritaSpeak() { speak(RITA_INTRO[S.level]); }

if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// ════════════════════════════════
//  CELEBRATE
// ════════════════════════════════

function celebrate() {
  const layer = document.getElementById('celebrate');
  layer.innerHTML = '';
  const cols = ['#4dc8ff','#00e5cc','#ffde59','#4ade80','#a855f7','#fff'];
  for (let i=0;i<45;i++) {
    const el=document.createElement('div');
    el.className='cp';
    el.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*20}%;background:${cols[Math.floor(Math.random()*cols.length)]};animation-delay:${Math.random()*.7}s;animation-duration:${1.2+Math.random()*.9}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'};`;
    layer.appendChild(el);
  }
  setTimeout(()=>layer.innerHTML='',2800);
}

// ════════════════════════════════
//  TOAST + HELPERS
// ════════════════════════════════

let toastT;
function toast(msg) {
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>el.classList.remove('show'),3000);
}

function shuffle(a) {
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

function setDevice(w,h,name) {
  const p=document.getElementById('phone');
  p.style.width=w+'px'; p.style.height=h+'px';
  document.querySelectorAll('#device-bar button').forEach(b=>
    b.classList.toggle('active',b.textContent===name));
}

// ════════════════════════════════
//  BOOT
// ════════════════════════════════
init();
</script>
