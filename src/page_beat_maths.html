<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovely Rita Adventures — Beat Maths</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a14;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;}
#device-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;}
#device-bar button{background:#1a1a2e;border:1px solid #333;color:#aaa;padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;transition:all .2s;}
#device-bar button:hover,#device-bar button.active{background:#333;color:#fff;border-color:#666;}
#phone-outer{background:#1c1c1c;border-radius:50px;padding:12px;box-shadow:0 0 0 2px #333,0 20px 60px rgba(0,0,0,.8);}
#phone{width:369px;height:828px;border-radius:40px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#001a0a;transition:width .3s,height .3s;}
#notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#1c1c1c;border-radius:0 0 20px 20px;z-index:20;}
#scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:36px 12px 8px;scrollbar-width:none;}
#scroll-area::-webkit-scrollbar{display:none;}
#bg{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 40% 20%,#001a0a 0%,#000e05 60%,#000 100%);border-radius:40px;overflow:hidden;pointer-events:none;}
nav#nav-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-around;padding:8px 20px 12px;border-top:1px solid rgba(255,255,255,.08);background:rgba(0,26,10,.8);backdrop-filter:blur(12px);position:relative;z-index:10;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;padding:5px 14px;border-radius:12px;transition:all .2s;font-size:10px;}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-btn .nav-icon{font-size:20px;line-height:1;}
body.theme-youngsters{--accent:#ff6ef7;--btn-grad:linear-gradient(135deg,#ff6ef7,#a855f7);}
body.theme-grownups{--accent:#ffde59;--btn-grad:linear-gradient(135deg,#ffde59,#c8860a);}
body.theme-experts{--accent:#c8a96e;--btn-grad:linear-gradient(135deg,#c8a96e,#6677aa);}
#page-header{text-align:center;margin-bottom:8px;position:relative;z-index:2;}
#page-header h1{font-size:16px;font-weight:900;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(135deg,#4ade80,#22d3ee,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#page-header p{font-size:10px;color:rgba(255,255,255,.35);margin-top:2px;}
#level-tabs{display:flex;gap:5px;justify-content:center;margin-bottom:8px;position:relative;z-index:2;}
#level-tabs button{padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);font-size:9px;font-weight:700;cursor:pointer;transition:all .2s;text-transform:uppercase;}
#level-tabs button.active{background:var(--btn-grad);border-color:transparent;color:#fff;}
#rita-wrap{background:rgba(255,255,255,.06);border:1px solid rgba(74,222,128,.3);border-radius:14px;padding:8px 26px 8px 10px;position:relative;margin-bottom:8px;z-index:2;}
#rita-name{font-size:9px;font-weight:700;color:#4ade80;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;}
#rita-text{font-size:10px;color:rgba(255,255,255,.8);line-height:1.5;}
#rita-speak-btn{position:absolute;top:7px;right:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;color:#fff;}
#status-bar{display:flex;gap:6px;margin-bottom:8px;position:relative;z-index:2;}
.stat-card{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:4px 8px;}
.stat-label{font-size:7px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.5px;}
.stat-val{font-size:13px;font-weight:900;}
#bc-val{color:#ffde59;}#score-val{color:#4ade80;}#q-val{color:#22d3ee;}
#math-display{display:flex;justify-content:center;align-items:center;margin-bottom:10px;position:relative;z-index:2;}
#math-equation{background:rgba(255,255,255,.06);border:2px solid rgba(74,222,128,.3);border-radius:20px;padding:20px 28px;text-align:center;font-size:32px;font-weight:900;color:#4ade80;letter-spacing:2px;text-shadow:0 0 20px rgba(74,222,128,.4);min-width:200px;}
#question-card{background:rgba(255,255,255,.06);border:1px solid rgba(74,222,128,.3);border-radius:16px;padding:10px 12px;margin-bottom:8px;position:relative;z-index:2;text-align:center;}
#question-number{font-size:8px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;}
#question-text{font-size:11px;font-weight:700;color:#fff;line-height:1.5;}
#answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative;z-index:2;margin-bottom:8px;}
.ans-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 6px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center;font-family:'Segoe UI',system-ui,sans-serif;}
.ans-btn:hover:not(.locked){background:rgba(74,222,128,.2);border-color:rgba(74,222,128,.5);}
.ans-btn.correct{background:rgba(74,222,128,.2);border-color:#4ade80;color:#4ade80;}
.ans-btn.wrong{background:rgba(248,113,113,.2);border-color:#f87171;color:#f87171;}
.ans-btn.locked{cursor:default;opacity:.7;}
#open-input-wrap{position:relative;z-index:2;margin-bottom:8px;display:none;}
#open-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 12px;color:#fff;font-size:18px;font-weight:700;font-family:'Segoe UI',system-ui,sans-serif;outline:none;text-align:center;}
#open-input:focus{border-color:var(--accent);}
#submit-btn{width:100%;margin-top:6px;padding:10px;background:var(--btn-grad);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:'Segoe UI',system-ui,sans-serif;}
#result-card{background:rgba(255,255,255,.06);border:1px solid rgba(74,222,128,.3);border-radius:16px;padding:14px;text-align:center;display:none;position:relative;z-index:2;margin-bottom:10px;}
#result-icon{font-size:28px;margin-bottom:6px;}
#result-title{font-size:13px;font-weight:900;margin-bottom:4px;}
#result-pts{font-size:16px;font-weight:900;color:#ffde59;margin-bottom:6px;}
#result-fact{font-size:9px;color:rgba(255,255,255,.6);line-height:1.5;margin-bottom:10px;}
#next-btn{padding:10px 28px;background:var(--btn-grad);border:none;border-radius:20px;color:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:'Segoe UI',system-ui,sans-serif;}
#congrats-card{display:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,215,0,.4);border-radius:18px;padding:16px;text-align:center;position:relative;z-index:2;margin-bottom:10px;}
#congrats-title{font-size:16px;font-weight:900;background:linear-gradient(135deg,#ffde59,#4ade80);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;}
#congrats-bc{font-size:13px;font-weight:700;color:#ffde59;margin-bottom:10px;}
#bonus-btn{padding:12px 24px;background:linear-gradient(135deg,#4ade80,#16a34a);border:none;border-radius:20px;color:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:'Segoe UI',system-ui,sans-serif;width:100%;margin-bottom:6px;}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(30,30,50,.95);border:1px solid rgba(74,222,128,.4);border-radius:20px;padding:8px 20px;font-size:12px;color:#fff;pointer-events:none;opacity:0;transition:opacity .3s;z-index:999;white-space:nowrap;}
</style>
</head>
<body class="theme-youngsters">
<div id="device-bar">
  <button class="active" onclick="setDevice(369,828,this)">iPhone 14 Pro</button>
  <button onclick="setDevice(390,844,this)">iPhone 14</button>
  <button onclick="setDevice(375,812,this)">iPhone 12</button>
  <button onclick="setDevice(360,800,this)">Android</button>
</div>
<div id="phone-outer"><div id="phone">
  <div id="notch"></div><div id="bg"></div>
  <div id="scroll-area">
    <div id="page-header">
      <h1>🎵 Beat Maths</h1>
      <p>Maths with the Lads — count your BeatCoins!</p>
    </div>
    <div id="level-tabs">
      <button onclick="setLevel('youngsters')" id="tab-y">🟣 Youngsters</button>
      <button onclick="setLevel('grownups')" id="tab-g">🟡 Grown Ups</button>
      <button onclick="setLevel('experts')" id="tab-e">⭐ Experts</button>
    </div>
    <div id="rita-wrap">
      <div id="rita-name">✨ Lovely Rita</div>
      <div id="rita-text">Let us count BeatCoins together love!</div>
      <button id="rita-speak-btn" onclick="speakRita()">🔊</button>
    </div>
    <div id="status-bar">
      <div class="stat-card"><div class="stat-label">BeatCoins</div><div class="stat-val" id="bc-val">0</div></div>
      <div class="stat-card"><div class="stat-label">Score</div><div class="stat-val" id="score-val">0</div></div>
      <div class="stat-card"><div class="stat-label">Question</div><div class="stat-val" id="q-val">0/0</div></div>
    </div>
    <div id="math-display"><div id="math-equation">? + ? = ?</div></div>
    <div id="question-card">
      <div id="question-number">Question 1</div>
      <div id="question-text">Loading question...</div>
    </div>
    <div id="answers-grid">
      <button class="ans-btn" id="ans-0" onclick="checkAnswer(0)">A</button>
      <button class="ans-btn" id="ans-1" onclick="checkAnswer(1)">B</button>
      <button class="ans-btn" id="ans-2" onclick="checkAnswer(2)">C</button>
      <button class="ans-btn" id="ans-3" onclick="checkAnswer(3)">D</button>
    </div>
    <div id="open-input-wrap">
      <input type="number" id="open-input" placeholder="Type your answer..." />
      <button id="submit-btn" onclick="submitOpen()">Submit Answer</button>
    </div>
    <div id="result-card">
      <div id="result-icon">🎵</div>
      <div id="result-title">Brilliant!</div>
      <div id="result-pts">+30 BeatCoins</div>
      <div id="result-fact">Great work!</div>
      <button id="next-btn" onclick="nextQ()">Next Question →</button>
    </div>
    <div id="congrats-card">
      <div id="congrats-title">🎵 Maths Master!</div>
      <div id="congrats-bc">+120 BeatCoins earned!</div>
      <button id="bonus-btn" onclick="goBonus()">⚡ Play VW Match!</button>
      <button onclick="goWorlds()" style="width:100%;padding:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;color:#fff;font-size:12px;cursor:pointer;font-family:'Segoe UI',system-ui,sans-serif;">Choose Another World</button>
    </div>
  </div>
  <nav id="nav-bar">
    <button class="nav-btn" onclick="window.location.href='page1_landing.html'"><span class="nav-icon">🏠</span><span>Home</span></button>
    <button class="nav-btn" onclick="goWorlds()"><span class="nav-icon">🌐</span><span>Worlds</span></button>
    <button class="nav-btn" onclick="goBonus()"><span class="nav-icon">▶️</span><span>Next</span></button>
  </nav>
</div></div>
<div id="toast"></div>
<script>
const params=new URLSearchParams(location.search);
const LEVEL_CFG={youngsters:{bonus:25,bonusAll:100,qCount:6},grownups:{bonus:35,bonusAll:140,qCount:7},experts:{bonus:50,bonusAll:180,qCount:8}};

const ALL_QS=[
  // YOUNGSTERS — simple addition/subtraction with BeatCoins context
  {eq:"8 + 4 =",q:"Smart Lad has 8 BeatCoins and earns 4 more from a quiz. How many does he have now?",answers:['10','11','12','13'],correct:2,display:'8 + 4',levels:['y','g','e'],fact:"8 + 4 = 12. Smart Lad is getting richer love!"},
  {eq:"15 - 7 =",q:"Rita had 15 BeatCoins and invested 7 in the Beat Shop. How many does she have left?",answers:['6','7','8','9'],correct:2,display:'15 - 7',levels:['y','g','e'],fact:"15 - 7 = 8. Always keep track of your BeatCoins love!"},
  {eq:"6 × 3 =",q:"There are 6 songs on each of the 3 albums the Lads recorded this month. How many songs in total?",answers:['15','16','17','18'],correct:3,display:'6 × 3',levels:['y','g','e'],fact:"6 × 3 = 18. Multiplication is just repeated addition love!"},
  {eq:"20 ÷ 4 =",q:"The Lads have 20 BeatCoins to share equally between the 4 of them. How many each?",answers:['4','5','6','7'],correct:1,display:'20 ÷ 4',levels:['y','g','e'],fact:"20 ÷ 4 = 5. Division shares things equally love!"},
  {eq:"9 + 13 =",q:"Cute Lad scored 9 points on Monday and 13 on Tuesday. What is his total score?",answers:['20','21','22','23'],correct:2,display:'9 + 13',levels:['y','g','e'],fact:"9 + 13 = 22. Adding up scores is great maths practice!"},
  {eq:"30 - 18 =",q:"Funny Lad had 30 BeatCoins. He invested 18 in a rare poster. How many EBCs remain?",answers:['10','11','12','13'],correct:2,display:'30 - 18',levels:['y','g','e'],fact:"30 - 18 = 12. Subtraction shows us what is left love!"},
  // GROWN UPS — fractions, percentages, multi-step
  {eq:"½ of 64 =",q:"Half of the Lads total BeatCoins go to the Beat Shop. If they have 64, how many go to the shop?",answers:['28','30','32','34'],correct:2,display:'½ × 64',levels:['g','e'],fact:"Half of 64 = 32. Fractions divide things into equal parts love!"},
  {eq:"25% of 80 =",q:"Rita earns 25 percent commission on 80 BeatCoins of sales. How many EBCs does she earn?",answers:['15','20','25','30'],correct:1,display:'25% of 80',levels:['g','e'],fact:"25% of 80 = 20. Per cent means per hundred love! 25/100 × 80 = 20"},
  {eq:"7 × 8 + 4 =",q:"The Smart Lad scores 7 points on each of 8 songs then gets a 4 point bonus. What is his total?",answers:['56','58','60','62'],correct:2,display:'7×8 + 4',levels:['g','e'],fact:"7 × 8 = 56, then 56 + 4 = 60. Always multiply before you add love!"},
  {eq:"144 ÷ 12 =",q:"A music studio charges 144 BeatCoins for 12 hours of recording. How much per hour?",answers:['10','11','12','13'],correct:2,display:'144 ÷ 12',levels:['g','e'],fact:"144 ÷ 12 = 12. Division helps us find the rate per unit love!"},
  // EXPERTS — algebra, percentages, compound
  {eq:"x + 15 = 42",q:"If x plus 15 equals 42, what is x?",answers:['25','26','27','28'],correct:2,display:'x + 15 = 42',levels:['e'],fact:"x = 42 - 15 = 27. To solve for x, move the 15 to the other side love!"},
  {eq:"200 × 1.15³ =",q:"Rita invests 200 EBCs at 15 percent monthly growth. After 3 months, what is the value? (Round to nearest whole number)",answers:['268','304','319','338'],correct:3,display:'200 × 1.15³',levels:['e'],fact:"200 × 1.15 × 1.15 × 1.15 = 304.18 ≈ 304. Compound growth is powerful love!"},
  {eq:"3x - 7 = 20",q:"Three times x minus 7 equals 20. What is x?",answers:['7','8','9','10'],correct:2,display:'3x - 7 = 20',levels:['e'],fact:"3x = 27, so x = 9. Algebra unlocks so many problems love!"},
  {eq:"√144 + 5² =",q:"What is the square root of 144 plus 5 squared?",answers:['35','37','38','41'],correct:1,display:'√144 + 5²',levels:['e'],fact:"√144 = 12, and 5² = 25. So 12 + 25 = 37. Roots and powers love!"},
];

let S={level:'youngsters',beatcoins:0,score:0,qIndex:0,order:[],answered:false,currentQ:null};

function init(){
  const lv=params.get('level')||localStorage.getItem('askLovelyRitaV4_level')||'youngsters';
  setLevel(lv,true);
  S.beatcoins=['smart','cute','quiet','funny'].reduce((s,l)=>s+Number(localStorage.getItem('askLovelyRitaV4_bc_'+l)||0),0);
  updateDisplay();
  speak("Welcome to Beat Maths love! I will read every question for you. Let us count those BeatCoins together!");
}

function setLevel(lv,silent){
  S.level=lv;localStorage.setItem('askLovelyRitaV4_level',lv);
  document.body.className='theme-'+lv;
  ['y','g','e'].forEach(t=>document.getElementById('tab-'+t).classList.remove('active'));
  document.getElementById('tab-'+lv[0]).classList.add('active');
  if(!silent)resetGame();
}

function resetGame(){
  S.qIndex=0;S.score=0;S.answered=false;S.currentQ=null;
  document.getElementById('result-card').style.display='none';
  document.getElementById('congrats-card').style.display='none';
  document.getElementById('question-card').style.display='block';
  document.getElementById('answers-grid').style.display='grid';
  document.getElementById('open-input-wrap').style.display='none';
  document.getElementById('math-equation').textContent='? + ? = ?';
  updateDisplay();startGame();
}

function startGame(){
  const cfg=LEVEL_CFG[S.level];
  const pool=ALL_QS.filter(q=>q.levels.includes(S.level[0]));
  S.order=shuffle(pool.map((_,i)=>i)).slice(0,Math.min(cfg.qCount,pool.length));
  S.qIndex=0;showQ();
}

function showQ(){
  const pool=ALL_QS.filter(q=>q.levels.includes(S.level[0]));
  if(S.qIndex>=S.order.length){showCongrats();return;}
  const q=pool[S.order[S.qIndex]];
  S.currentQ=q;S.answered=false;
  document.getElementById('result-card').style.display='none';
  document.getElementById('question-card').style.display='block';
  document.getElementById('question-number').textContent=`Question ${S.qIndex+1} of ${S.order.length}`;
  document.getElementById('question-text').textContent=q.q;
  document.getElementById('q-val').textContent=`${S.qIndex+1}/${S.order.length}`;
  document.getElementById('math-equation').textContent=q.display;
  document.getElementById('answers-grid').style.display='grid';
  document.getElementById('open-input-wrap').style.display='none';
  q.answers.forEach((a,i)=>{
    const btn=document.getElementById('ans-'+i);
    btn.textContent=a;btn.className='ans-btn';
  });
  setRita(q.q);speak(q.q);
  updateDisplay();
}

function checkAnswer(idx){
  if(S.answered)return;S.answered=true;
  const q=S.currentQ;const ok=idx===q.correct;
  const pts=ok?LEVEL_CFG[S.level].bonus:0;
  document.querySelectorAll('.ans-btn').forEach((b,i)=>{
    b.classList.add('locked');
    if(i===q.correct)b.classList.add('correct');
    else if(i===idx&&!ok)b.classList.add('wrong');
  });
  if(ok){S.score+=pts;saveLadBC(pts);}
  updateDisplay();showResult(ok,pts,q);
}

function submitOpen(){
  if(S.answered)return;
  const val=parseFloat(document.getElementById('open-input').value);
  const q=S.currentQ;const correct=parseFloat(q.answers[q.correct]);
  const ok=Math.abs(val-correct)<0.5;
  const pts=ok?LEVEL_CFG[S.level].bonus:0;
  S.answered=true;if(ok){S.score+=pts;saveLadBC(pts);}
  updateDisplay();showResult(ok,pts,q);
}

function showResult(ok,pts,q){
  const rc=document.getElementById('result-card');
  document.getElementById('result-icon').textContent=ok?'🎵':'🎶';
  document.getElementById('result-title').textContent=ok?'Brilliant love!':'Good try love!';
  document.getElementById('result-pts').textContent=ok?`+${pts} BeatCoins!`:`The answer is ${q.answers[q.correct]}`;
  document.getElementById('result-fact').textContent=q.fact;
  document.getElementById('next-btn').textContent=S.qIndex+1>=S.order.length?'See Results!':'Next Question →';
  rc.style.display='block';
  const msg=ok?`That is correct love! ${q.fact}`:`Not quite darling! ${q.fact}`;
  setRita(msg);speak(msg);
  document.getElementById('scroll-area').scrollTop=9999;
}

function nextQ(){S.qIndex++;document.getElementById('answers-grid').style.display='grid';document.getElementById('open-input-wrap').style.display='none';showQ();setTimeout(()=>{document.getElementById('scroll-area').scrollTop=0;},100);}

function showCongrats(){
  const cfg=LEVEL_CFG[S.level];
  document.getElementById('question-card').style.display='none';
  document.getElementById('answers-grid').style.display='none';
  document.getElementById('result-card').style.display='none';
  document.getElementById('congrats-card').style.display='block';
  document.getElementById('congrats-bc').textContent=`+${cfg.bonusAll} BeatCoins earned!`;
  saveEBC(cfg.bonusAll);
  const msg=`Outstanding love! You are a true maths genius! You earned ${cfg.bonusAll} BeatCoins! Now let us play!`;
  setRita(msg);speak(msg);
  document.getElementById('scroll-area').scrollTop=9999;
}

function updateDisplay(){
  const total=['smart','cute','quiet','funny'].reduce((s,l)=>s+Number(localStorage.getItem('askLovelyRitaV4_bc_'+l)||0),0);
  document.getElementById('bc-val').textContent=total;
  document.getElementById('score-val').textContent=S.score;
}
function setRita(t){document.getElementById('rita-text').textContent=t;}
function speakRita(){speak(document.getElementById('rita-text').textContent);}
function speak(text){
  if(localStorage.getItem('askLovelyRitaV4_mute')==='1'||!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=0.92;u.pitch=1.1;
  const v=window.speechSynthesis.getVoices();
  const voice=v.find(x=>x.lang==='en-GB'&&/female|woman/i.test(x.name))||v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang.startsWith('en'));
  if(voice)u.voice=voice;window.speechSynthesis.speak(u);
}
function saveLadBC(amount){try{const lad=localStorage.getItem('askLovelyRitaV4_chosen_lad')||'smart';const k='askLovelyRitaV4_bc_'+lad;localStorage.setItem(k,Number(localStorage.getItem(k)||0)+amount);postGlobalScore(amount);}catch(e){}}
function saveEBC(amount){try{const cur=Number(localStorage.getItem('lra_ebc_balance')||0);localStorage.setItem('lra_ebc_balance',cur+amount);}catch(e){}}
function postGlobalScore(amount){const lad=localStorage.getItem('askLovelyRitaV4_chosen_lad')||'smart';fetch('https://empty-leaf-6e4b.alexmonteironeto.workers.dev/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lad,amount})}).catch(()=>{});}
