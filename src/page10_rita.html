<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Lovely Rita — Rita's World</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0a0a14; color: #fff;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 20px 16px 40px;
}
#device-bar {
  display: flex; gap: 8px; margin-bottom: 16px;
  flex-wrap: wrap; justify-content: center;
}
#device-bar button {
  background: #1a1a2e; border: 1px solid #333; color: #aaa;
  padding: 6px 12px; border-radius: 20px; font-size: 11px;
  cursor: pointer; transition: all .2s;
}
#device-bar button:hover, #device-bar button.active {
  background: #333; color: #fff; border-color: #666;
}
#phone-outer {
  background: #1c1c1c; border-radius: 50px; padding: 12px;
  box-shadow: 0 0 0 2px #333, 0 20px 60px rgba(0,0,0,.8);
}
#phone {
  width: 369px; height: 828px; border-radius: 40px;
  overflow: hidden; position: relative;
  display: flex; flex-direction: column;
  background: #1a0a2e;
  transition: width .3s, height .3s;
}
#notch {
  position: absolute; top: 0; left: 50%;
  transform: translateX(-50%);
  width: 120px; height: 30px; background: #1c1c1c;
  border-radius: 0 0 20px 20px; z-index: 30;
}
#scroll-area {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 36px 0 8px; scrollbar-width: none;
  position: relative; z-index: 2;
}
#scroll-area::-webkit-scrollbar { display: none; }

/* ══ ANIMATED STAGE BACKGROUND ══ */
#stage-bg {
  position: absolute; inset: 0; z-index: 0;
  overflow: hidden; border-radius: 40px;
  background: linear-gradient(180deg,#1a0a2e 0%,#2d1040 30%,#4a1a5e 60%,#8b1a3a 85%,#6b1020 100%);
}
.curtain {
  position: absolute; top: 0; width: 80px; height: 70%;
  background: linear-gradient(90deg,#6b0000,#c41e3a,#6b0000);
  transform-origin: top center;
  animation: curtain-sway 4s ease-in-out infinite alternate;
}
.curtain-left { left:0; border-radius:0 0 24px 0; }
.curtain-right { right:0; border-radius:0 0 0 24px; transform:scaleX(-1); animation-name:curtain-sway-r; animation-delay:.5s; }
@keyframes curtain-sway { from{transform:rotate(-1.5deg)} to{transform:rotate(1.5deg)} }
@keyframes curtain-sway-r { from{transform:scaleX(-1) rotate(-1.5deg)} to{transform:scaleX(-1) rotate(1.5deg)} }
.stage-light {
  position:absolute; top:-8px; width:5px; height:110px;
  transform-origin:top center;
  animation:light-sweep var(--ls) ease-in-out infinite alternate;
}
@keyframes light-sweep { from{transform:rotate(var(--la))} to{transform:rotate(var(--lb))} }
.stage-light::after {
  content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  width:0; height:0;
  border-left:28px solid transparent; border-right:28px solid transparent;
  border-top:110px solid var(--lc); opacity:.25; filter:blur(3px);
}
.stage-bulb {
  width:9px; height:9px; border-radius:50%;
  background:var(--lc); box-shadow:0 0 8px var(--lc);
  position:absolute; top:0; left:50%; transform:translateX(-50%);
}
.music-note {
  position:absolute; font-size:var(--ns);
  animation:note-float var(--nd) ease-in-out infinite; opacity:0; color:var(--nc);
}
@keyframes note-float {
  0%{transform:translateY(100px) rotate(0deg);opacity:0}
  10%{opacity:.8} 90%{opacity:.5}
  100%{transform:translateY(-180px) rotate(var(--nr));opacity:0}
}
.vinyl-bg {
  position:absolute; border-radius:50%;
  background:conic-gradient(#111 0deg,#222 30deg,#111 60deg,#222 90deg,#111 120deg,#222 150deg,#111 180deg,#222 210deg,#111 240deg,#222 270deg,#111 300deg,#222 330deg);
  animation:vinyl-spin var(--vs) linear infinite; opacity:.2;
}
.vinyl-bg::after {
  content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:30%; height:30%; border-radius:50%; background:var(--vc);
}
@keyframes vinyl-spin { to{transform:rotate(360deg)} }
.floor-glow {
  position:absolute; bottom:14%; left:50%; transform:translateX(-50%);
  width:180px; height:50px; border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,200,50,.18) 0%,transparent 70%);
  animation:glow-p 2s ease-in-out infinite alternate;
}
@keyframes glow-p { from{opacity:.4;transform:translateX(-50%) scale(1)} to{opacity:1;transform:translateX(-50%) scale(1.2)} }
.bg-star {
  position:absolute; background:#fff; border-radius:50%;
  animation:star-tw var(--st) ease-in-out infinite alternate;
}
@keyframes star-tw { from{opacity:.1} to{opacity:.8} }
#vw-bus-bg {
  position:absolute; bottom:7%; left:-160px;
  height:70px; width:auto;
  animation:bus-roll 20s linear infinite; opacity:.3; z-index:1;
}
@keyframes bus-roll { 0%{left:-160px} 100%{left:430px} }

/* NAV */
#nav-bar {
  flex-shrink:0; display:flex; align-items:center; justify-content:space-around;
  padding:8px 20px 12px; border-top:1px solid rgba(255,255,255,.1);
  background:rgba(26,10,46,.85); backdrop-filter:blur(12px);
  position:relative; z-index:10;
}
.nav-btn {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:rgba(255,255,255,.5); cursor:pointer;
  padding:5px 14px; border-radius:12px; transition:all .2s; font-size:10px;
}
.nav-btn:hover { background:rgba(255,255,255,.08); color:#fff; }
.nav-btn .nav-icon { font-size:20px; line-height:1; }
.nav-btn.nav-home { color:#ffd700; }

/* THEMES */
body.theme-youngsters { --accent:#ff6ef7; --glow:#ff6ef7; --btn-grad:linear-gradient(135deg,#ff6ef7,#a855f7); }
body.theme-grownups   { --accent:#c8a96e; --glow:#c8a96e; --btn-grad:linear-gradient(135deg,#c8a96e,#6677aa); }
body.theme-experts    { --accent:#ffd700; --glow:#ffd700; --btn-grad:linear-gradient(135deg,#ffd700,#c8860a); }

/* HEADER */
#page-header { text-align:center; margin-bottom:8px; padding:0 14px; position:relative; z-index:2; }
#page-header h1 {
  font-size:18px; font-weight:900; letter-spacing:2px; text-transform:uppercase;
  background:linear-gradient(135deg,#ffd700,#ff6ef7,#ffd700);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  animation:title-sh 3s ease-in-out infinite alternate;
}
@keyframes title-sh {
  from{filter:drop-shadow(0 0 10px rgba(255,215,0,.4))}
  to{filter:drop-shadow(0 0 22px rgba(255,100,247,.8))}
}
#page-header p { font-size:10px; color:rgba(255,255,255,.4); margin-top:2px; }

/* LEVEL TABS */
#level-tabs { display:flex; gap:5px; justify-content:center; margin-bottom:8px; padding:0 14px; position:relative; z-index:2; }
#level-tabs button {
  padding:4px 10px; border-radius:20px; border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.05); color:rgba(255,255,255,.5);
  font-size:9px; font-weight:700; cursor:pointer; transition:all .2s; text-transform:uppercase;
}
#level-tabs button.active { background:var(--btn-grad); border-color:transparent; color:#fff; }

/* RITA STAGE */
#rita-stage {
  position:relative; margin:0 14px 10px;
  display:flex; align-items:flex-end; gap:10px;
  min-height:130px; z-index:2;
}
#rita-pose-wrap {
  width:100px; flex-shrink:0;
  display:flex; align-items:flex-end; justify-content:center;
}
#rita-pose {
  width:98px; height:auto; object-fit:contain;
  transition:opacity .35s ease;
}
#rita-pose.speaking {
  animation:rita-sp 0.8s ease-in-out infinite alternate;
}
@keyframes rita-sp {
  from{filter:drop-shadow(0 0 10px rgba(255,215,0,.4))}
  to{filter:drop-shadow(0 0 26px rgba(255,100,247,.9))}
}
#rita-bubble {
  flex:1;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,215,0,.3);
  border-radius:14px 14px 14px 4px; padding:9px 26px 9px 11px;
  position:relative; margin-bottom:8px;
}
#rita-bubble::before {
  content:''; position:absolute; left:-8px; bottom:14px;
  border-top:6px solid transparent; border-bottom:6px solid transparent;
  border-right:8px solid rgba(255,215,0,.3);
}
#rita-label { font-size:9px; font-weight:700; color:#ffd700; text-transform:uppercase; letter-spacing:.8px; margin-bottom:3px; }
#rita-says { font-size:11px; color:rgba(255,255,255,.85); line-height:1.5; }
#rita-speak-btn {
  position:absolute; top:7px; right:6px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
  border-radius:50%; width:20px; height:20px;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; cursor:pointer; color:#fff;
}

/* STATUS */
#status-bar { display:flex; gap:6px; margin:0 14px 8px; position:relative; z-index:2; }
.stat-card { flex:1; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:4px 8px; }
.stat-label { font-size:7px; color:rgba(255,255,255,.3); text-transform:uppercase; letter-spacing:.5px; }
.stat-val { font-size:13px; font-weight:900; }
#bc-val { color:#ffde59; } #score-val { color:#ff6ef7; } #q-val { color:#ffd700; }

/* QUESTION AREA */
#question-area {
  margin:0 14px 10px; position:relative; z-index:2;
  background:rgba(0,0,0,.3); border:1px solid rgba(255,215,0,.15);
  border-radius:18px; padding:12px; text-align:center;
}
#q-category { font-size:8px; color:#ffd700; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
#q-prompt {
  font-size:14px; font-weight:700; color:#fff;
  line-height:1.6; margin-bottom:10px; min-height:44px;
}
/* Blank highlight */
#q-prompt .blank {
  color:#ffd700; font-size:16px; letter-spacing:2px;
  border-bottom:2px solid #ffd700; padding:0 4px;
}

/* ALBUM GRID */
#album-grid {
  display:grid; grid-template-columns:repeat(2,1fr); gap:8px;
}
.album-card {
  border-radius:12px; overflow:hidden; cursor:pointer;
  border:3px solid rgba(255,255,255,.12);
  transition:transform .2s, border-color .2s, box-shadow .2s;
  aspect-ratio:1; background:rgba(255,255,255,.05);
  position:relative;
}
.album-card:hover { transform:scale(1.05); border-color:rgba(255,215,0,.5); }
.album-card img { width:100%; height:100%; object-fit:cover; border-radius:9px; display:block; }
.album-card.correct {
  border-color:#4ade80; box-shadow:0 0 18px rgba(74,222,128,.7);
  animation:alb-pop .5s ease;
}
.album-card.wrong {
  border-color:#f87171; box-shadow:0 0 10px rgba(248,113,113,.4);
  animation:alb-shake .4s ease;
}
@keyframes alb-pop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
@keyframes alb-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

/* WORD REVEAL */
#word-reveal {
  display:none; margin-top:10px;
  background:rgba(255,215,0,.1); border:1px solid rgba(255,215,0,.3);
  border-radius:12px; padding:10px;
}
#word-reveal-text {
  font-size:22px; font-weight:900; color:#ffd700;
  letter-spacing:4px; text-transform:uppercase;
  text-shadow:0 0 16px rgba(255,215,0,.6);
  animation:word-pop .5s ease;
}
@keyframes word-pop { 0%{transform:scale(0)} 70%{transform:scale(1.2)} 100%{transform:scale(1)} }

/* GROWN UPS INPUT */
#grownup-area { display:none; }
#grownup-phrase { font-size:15px; color:#fff; font-weight:600; line-height:1.8; margin-bottom:10px; }
#grownup-phrase .dashes { color:#ffd700; letter-spacing:3px; font-size:18px; font-weight:900; }
#grownup-input {
  width:100%; background:rgba(255,255,255,.1);
  border:2px solid rgba(255,215,0,.4); border-radius:12px;
  color:#fff; font-size:16px; padding:10px 14px;
  outline:none; font-family:inherit; text-align:center;
  transition:border-color .2s;
}
#grownup-input:focus { border-color:#ffd700; box-shadow:0 0 12px rgba(255,215,0,.3); }
#grownup-input::placeholder { color:rgba(255,255,255,.3); }
#grownup-submit {
  width:100%; margin-top:8px; padding:11px; border:none; border-radius:24px;
  background:var(--btn-grad); color:#fff; font-size:12px; font-weight:800;
  letter-spacing:.5px; text-transform:uppercase; cursor:pointer;
  position:relative; overflow:hidden; transition:transform .15s;
}
#grownup-submit::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,255,255,.14),transparent); border-radius:inherit; }
#grownup-submit:hover { transform:scale(1.03); }
#grownup-tries { font-size:10px; color:rgba(255,255,255,.4); margin-top:6px; }

/* GROWN UPS KEYBOARD */
#grownup-keyboard {
  display:flex; flex-direction:column; gap:4px; margin-top:8px;
}
.gkey-row { display:flex; gap:3px; justify-content:center; }
.gkey {
  height:38px; min-width:28px; padding:0 3px;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
  border-radius:7px; color:#fff; font-size:12px; font-weight:700;
  cursor:pointer; transition:all .1s;
  display:flex; align-items:center; justify-content:center;
  text-transform:uppercase; user-select:none;
}
.gkey:hover { background:rgba(255,215,0,.25); border-color:#ffd700; }
.gkey:active { transform:scale(.9); }
.gkey-del { min-width:42px; font-size:15px; }
.gkey-submit {
  min-width:70px; font-size:10px; font-weight:900;
  background:linear-gradient(135deg,#ffd700,#c8860a);
  border-color:transparent; color:#000;
}

/* EXPERT INPUT */
#expert-area { display:none; }
#expert-lyric { font-size:13px; color:rgba(255,255,255,.8); font-style:italic; line-height:1.7; margin-bottom:10px; border-left:3px solid #ffd700; padding-left:10px; text-align:left; }
#expert-input-row { display:flex; gap:8px; margin-bottom:6px; }
#expert-input {
  flex:1; background:rgba(255,255,255,.1);
  border:2px solid rgba(255,215,0,.4); border-radius:12px;
  color:#fff; font-size:13px; padding:10px 12px;
  outline:none; font-family:inherit; transition:border-color .2s;
}
#expert-input:focus { border-color:#ffd700; }
#expert-input::placeholder { color:rgba(255,255,255,.3); }
#mic-btn {
  width:44px; height:44px; border-radius:50%;
  background:linear-gradient(135deg,#ffd700,#ff6ef7);
  border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:20px; transition:transform .15s; box-shadow:0 4px 12px rgba(255,215,0,.4);
  flex-shrink:0;
}
#mic-btn:hover { transform:scale(1.1); }
#mic-btn.listening { animation:mic-p .6s ease-in-out infinite alternate; }
@keyframes mic-p { from{box-shadow:0 0 10px rgba(255,100,247,.5)} to{box-shadow:0 0 26px rgba(255,100,247,1)} }
#mic-status { font-size:10px; color:rgba(255,255,255,.4); text-align:center; min-height:14px; margin-bottom:6px; }
#expert-submit {
  width:100%; padding:11px; border:none; border-radius:24px;
  background:var(--btn-grad); color:#fff; font-size:12px; font-weight:800;
  letter-spacing:.5px; text-transform:uppercase; cursor:pointer;
  position:relative; overflow:hidden; transition:transform .15s;
}
#expert-submit::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,255,255,.14),transparent); border-radius:inherit; }
#expert-submit:hover { transform:scale(1.03); }

/* ACTION BTNS */
#action-btns { display:flex; gap:7px; margin:0 14px 8px; position:relative; z-index:2; }
.act-btn {
  flex:1; padding:10px; border:none; border-radius:24px;
  font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
  cursor:pointer; transition:transform .15s; position:relative; overflow:hidden;
}
.act-btn::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,255,255,.14),transparent); border-radius:inherit; }
.act-btn:hover:not(:disabled) { transform:scale(1.03); }
#start-btn {
  background:var(--btn-grad); color:#fff;
  box-shadow:0 4px 16px rgba(0,0,0,.4), 0 0 16px var(--glow);
  animation:start-pulse 2s ease-in-out infinite alternate;
}
@keyframes start-pulse {
  from{box-shadow:0 4px 16px rgba(0,0,0,.4),0 0 12px var(--glow)}
  to{box-shadow:0 4px 24px rgba(0,0,0,.5),0 0 28px var(--glow)}
}
#next-btn { background:rgba(255,255,255,.07); border:1px solid #ffd700; color:#ffd700; display:none; }

/* RESULT */
#result-panel {
  background:rgba(255,255,255,.05); border:1px solid rgba(255,215,0,.2);
  border-radius:14px; padding:10px; margin:0 14px 8px;
  text-align:center; display:none; flex-direction:column;
  align-items:center; gap:4px; position:relative; z-index:2;
  animation:slide-in .35s ease;
}
#result-panel.show { display:flex; }
@keyframes slide-in { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:translateY(0)} }
#result-icon { font-size:26px; }
#result-title { font-size:14px; font-weight:800; color:#ffd700; }
#result-line { font-size:12px; color:#ff6ef7; font-style:italic; line-height:1.5; }
#result-pts { font-size:18px; font-weight:900; }

/* CELEBRATE */
#celebrate { position:absolute; inset:0; pointer-events:none; z-index:25; overflow:hidden; border-radius:40px; }
.cp { position:absolute; border-radius:2px; animation:cf 1.6s ease-out forwards; }
@keyframes cf { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(900px) rotate(720deg);opacity:0} }

#toast {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px);
  background:rgba(26,10,46,.95); border:1px solid #ffd700; border-radius:20px;
  padding:8px 16px; font-size:11px; color:#fff; z-index:1000;
  transition:transform .3s,opacity .3s; opacity:0; white-space:nowrap; pointer-events:none;
}
#toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>
<body class="theme-youngsters">

<div id="device-bar">
  <button onclick="setDevice(393,852,'iPhone 14 Pro')" class="active">iPhone 14 Pro</button>
  <button onclick="setDevice(375,667,'iPhone SE')">iPhone SE</button>
  <button onclick="setDevice(360,800,'Galaxy S23')">Galaxy S23</button>
  <button onclick="setDevice(412,915,'Pixel 7')">Pixel 7</button>
  <button onclick="setDevice(430,932,'iPhone 14 Max')">iPhone 14 Max</button>
</div>

<div id="phone-outer">
  <div id="phone">
    <div id="notch"></div>
    <div id="stage-bg">
      <div class="curtain curtain-left"></div>
      <div class="curtain curtain-right"></div>
      <div class="floor-glow"></div>
    </div>
    <div id="celebrate"></div>
    <img id="vw-bus-bg"
      src="https://alexmonteiro65.github.io/ask-lovely-rita/src/vw_bus_musical.png"
      alt="" onerror="this.style.display='none'"/>

    <div id="scroll-area">

      <div id="page-header">
        <h1>🎤 Rita's World</h1>
        <p>Only Lads' language is spoken here!</p>
      </div>

      <div id="level-tabs">
        <button onclick="setLevel('youngsters')" class="active">🟣 Youngsters</button>
        <button onclick="setLevel('grownups')">🟡 Grown Ups</button>
        <button onclick="setLevel('experts')">⭐ Experts</button>
      </div>

      <!-- RITA -->
      <div id="rita-stage">
        <div id="rita-pose-wrap">
          <img id="rita-pose"
            src="https://alexmonteiro65.github.io/ask-lovely-rita/src/rita_apresentadora_pose_1.png"
            alt="Rita" onerror="this.style.opacity='.3'"/>
        </div>
        <div id="rita-bubble">
          <div id="rita-label">🎤 Lovely Rita</div>
          <div id="rita-says">Loading...</div>
          <button id="rita-speak-btn" onclick="ritaSpeak()">🔊</button>
        </div>
      </div>

      <!-- STATUS -->
      <div id="status-bar">
        <div class="stat-card"><div class="stat-label">BeatCoins</div><div class="stat-val" id="bc-val">80</div></div>
        <div class="stat-card"><div class="stat-label">Score</div><div class="stat-val" id="score-val">0</div></div>
        <div class="stat-card"><div class="stat-label">Round</div><div class="stat-val" id="q-val">0/8</div></div>
      </div>

      <!-- QUESTION -->
      <div id="question-area">
        <div id="q-category">♪ Rita's World</div>
        <div id="q-prompt">Click below to enter Rita's World!</div>

        <!-- YOUNGSTERS -->
        <div id="album-grid"></div>
        <div id="word-reveal">
          <div style="font-size:10px;color:rgba(255,255,255,.5);margin-bottom:4px">The word is</div>
          <div id="word-reveal-text"></div>
        </div>

        <!-- GROWN UPS -->
        <div id="grownup-area">
          <div id="grownup-phrase"></div>
          <input id="grownup-input" type="text" placeholder="Type the missing word..." readonly/>
          <div id="grownup-keyboard">
            <div class="gkey-row" id="gkr1"></div>
            <div class="gkey-row" id="gkr2"></div>
            <div class="gkey-row" id="gkr3"></div>
          </div>

// ── GROWN UPS KEYBOARD
const GK_ROWS = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['⌫','Z','X','C','V','B','N','M','✓'],
];
function buildGrownUpKeyboard() {
  GK_ROWS.forEach((row,ri) => {
    const rowEl = document.getElementById(`gkr${ri+1}`);
    if(!rowEl) return;
    rowEl.innerHTML = '';
    row.forEach(k => {
      const btn = document.createElement('button');
      const isDel = k==='⌫', isOk = k==='✓';
      btn.className = 'gkey' + (isDel?' gkey-del':'') + (isOk?' gkey-submit':'');
      btn.textContent = k;
      btn.onclick = () => {
        const inp = document.getElementById('grownup-input');
        if(isDel) { inp.value = inp.value.slice(0,-1); }
        else if(isOk) { checkGrownUp(); }
        else { inp.value += k.toLowerCase(); }
      };
      rowEl.appendChild(btn);
    });
  });
}

// ── EXPERT KEYBOARD
function buildExpertKeyboard() {
  GK_ROWS.forEach((row,ri) => {
    const rowEl = document.getElementById(`ekr${ri+1}`);
    if(!rowEl) return;
    rowEl.innerHTML = '';
    row.forEach(k => {
      const btn = document.createElement('button');
      const isDel = k==='⌫', isOk = k==='✓';
      btn.className = 'gkey' + (isDel?' gkey-del':'') + (isOk?' gkey-submit':'');
      btn.textContent = k;
      btn.onclick = () => {
        const inp = document.getElementById('expert-input');
        if(isDel) {
          const words = inp.value.split(' ');
          if(inp.value.endsWith(' ')) { inp.value = inp.value.trimEnd(); }
          else { words.pop(); inp.value = words.join(' '); }
          if(inp.value && !inp.value.endsWith(' ')) {}
        }
        else if(isOk) { checkExpert(); }
        else {
          // Add space between words automatically
          const val = inp.value;
          if(val.length > 0 && !val.endsWith(' ')) {
            // check if we should add space (new word)
          }
          inp.value += k.toLowerCase();
        }
      };
      rowEl.appendChild(btn);
    });
    // Add space bar after last row
    if(ri === 2) {
      const space = document.createElement('button');
      space.className = 'gkey';
      space.textContent = 'SPACE';
      space.style.cssText = 'min-width:80px;font-size:10px;';
      space.onclick = () => {
        const inp = document.getElementById('expert-input');
        if(inp.value && !inp.value.endsWith(' ')) inp.value += ' ';
      };
      rowEl.appendChild(space);
    }
  });
}

// ── MIC FOR GROWN UPS
function toggleMicGrownUp() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) { toast('🎤 Microphone not supported in this browser'); return; }
  const btn = document.getElementById('mic-btn-g');
  const status = document.getElementById('mic-status-g');
  if(S.listening) { S.recognition && S.recognition.stop(); return; }
  S.recognition = new SR();
  S.recognition.lang = 'en-GB'; S.recognition.interimResults = false;
  S.recognition.onstart = () => {
    S.listening = true;
    btn.style.animation = 'mic-p .6s ease-in-out infinite alternate';
    status.textContent = '🎤 Listening...';
  };
  S.recognition.onresult = e => {
    const t = e.results[0][0].transcript.toLowerCase();
    document.getElementById('grownup-input').value = t;
    status.textContent = `Heard: "${t}"`;
    S.listening = false;
    btn.style.animation = '';
    // Auto-check after mic
    setTimeout(() => checkGrownUp(), 500);
  };
  S.recognition.onerror = () => {
    S.listening = false; btn.style.animation = '';
    status.textContent = 'Could not hear — use keyboard';
  };
  S.recognition.onend = () => { S.listening = false; btn.style.animation = ''; };
  S.recognition.start();
}

// ── GAME
function resetGame() {
  S.score=0;S.qIndex=0;S.gameActive=false;S.answered=false;S.grownupTries=0;
  const qArr=S.level==='youngsters'?Q_YOUNGSTERS:S.level==='grownups'?Q_GROWNUPS:Q_EXPERTS;
  S.order=shuffle([...Array(qArr.length).keys()]);
  document.getElementById('score-val').textContent='0';

  document.getElementById('expert-area').style.display='none';
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('start-btn').style.display='block';
  document.getElementById('start-btn').textContent='🎤 Enter Rita\'s World!';
  document.getElementById('start-btn').onclick=startGame;
  document.getElementById('next-btn').style.display='none';
}

function startGame() {
  S.gameActive=true;
  document.getElementById('start-btn').style.display='none';
  document.getElementById('result-panel').classList.remove('show');
  loadQuestion();
}

function loadQuestion() {
  if(S.qIndex>=8){finishGame();return;}
  const qArr=S.level==='youngsters'?Q_YOUNGSTERS:S.level==='grownups'?Q_GROWNUPS:Q_EXPERTS;
  const q=qArr[S.order[S.qIndex%qArr.length]];
  S.currentQ=q;S.answered=false;S.grownupTries=0;

  document.getElementById('q-val').textContent=`${S.qIndex+1}/8`;
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('next-btn').style.display='none';
  document.getElementById('word-reveal').style.display='none';
  document.getElementById('album-grid').style.display='none';
  document.getElementById('grownup-area').style.display='none';
  document.getElementById('expert-area').style.display='none';

  setPose('curious');

  if(S.level==='youngsters') {
    // Show fill-blank prompt
    const promptText = q.prompt.replace(/\([_-]+\)/g, '<span class="blank">____</span>');
    document.getElementById('q-prompt').innerHTML = promptText;
    document.getElementById('q-category').textContent = '♪ Which album has the answer?';
    buildAlbumGrid(q);
    setTimeout(()=>speak(q.prompt.replace(/[()]/g,'')),400);

  } else if(S.level==='grownups') {
    document.getElementById('q-prompt').textContent='';
    document.getElementById('q-category').textContent='♪ Fill in the blank';
    // Build dashes
    const dashes='('+'-'.repeat(q.dashes)+')';
    document.getElementById('grownup-phrase').innerHTML =
      q.phrase.replace(/\([_\-]+\)/g,`<span class="dashes">${dashes}</span>`);
    document.getElementById('grownup-input').value='';
    document.getElementById('grownup-tries').textContent='';
    document.getElementById('grownup-area').style.display='block';
    setTimeout(()=>speak(q.phrase.replace(/\([^)]+\)/g,'blank')),400);

  } else {
    // Experts
    document.getElementById('q-prompt').textContent='';
    document.getElementById('q-category').textContent='♪ Complete the next line';
    document.getElementById('expert-lyric').textContent=q.lyric;
    document.getElementById('expert-input').value='';
    document.getElementById('mic-status').textContent='';
    document.getElementById('expert-area').style.display='block';
    setTimeout(()=>speak(q.lyric),400);
  }
}

// ── YOUNGSTERS: Album Grid
function buildAlbumGrid(q) {
  const grid=document.getElementById('album-grid');
  grid.innerHTML='';grid.style.display='grid';
  const others=shuffle(ALBUMS.map((_,i)=>i).filter(i=>i!==q.albumIdx)).slice(0,3);
  const choices=shuffle([q.albumIdx,...others]);
  choices.forEach(idx=>{
    const album=ALBUMS[idx];
    const card=document.createElement('div');card.className='album-card';
    const img=document.createElement('img');
    img.src=BASE+encodeURIComponent(album.file);
    img.alt='';
    img.onerror=()=>{
      card.innerHTML=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px">🎵</div>`;
    };
    card.appendChild(img);
    card.onclick=()=>checkAlbum(idx,q,card);
    grid.appendChild(card);
  });
}

function checkAlbum(chosen,q,cardEl) {
  // Never block clicking — only lock after correct answer
  if(S.answered)return;
  const isCorrect=chosen===q.albumIdx;

  if(isCorrect) {
    S.answered=true;
    // Disable all cards now that we have a correct answer
    document.querySelectorAll('.album-card').forEach(c=>c.onclick=null);
    cardEl.classList.add('correct');
    // Reveal the word
    document.getElementById('word-reveal').style.display='block';
    document.getElementById('word-reveal-text').textContent=q.word;
    handleCorrect(q.congrat);
  } else {
    // Wrong — shake this card but keep ALL others clickable
    cardEl.classList.add('wrong');
    setTimeout(()=>cardEl.classList.remove('wrong'),500);
    speak(pick(RITA_WRONG_Y));
    setPose('encourage');
    setTimeout(()=>setPose('curious'),1800);
  }
}

// ── GROWN UPS
function checkGrownUp() {
  if(S.answered)return;
  const input=document.getElementById('grownup-input').value.trim().toLowerCase();
  const answer=S.currentQ.answer.toLowerCase();
  const isCorrect=input===answer||input.includes(answer)||answer.includes(input);

  if(isCorrect) {
    S.answered=true;
    handleCorrect(`Yes love! The word is "${S.currentQ.answer.toUpperCase()}"! Well done darling!`);
  } else {
    S.grownupTries++;
    if(S.grownupTries>=2) {
      // Give hint after 2 tries
      document.getElementById('grownup-tries').textContent=`Hint: ${S.currentQ.hint}`;
      speak(`Not quite love! Here is a hint: ${S.currentQ.hint}`);
    } else {
      speak(pick(RITA_WRONG_G));
    }
    setPose('encourage');
    setTimeout(()=>setPose('curious'),1500);
    document.getElementById('grownup-input').value='';
    document.getElementById('grownup-input').focus();
  }
}

// ── EXPERTS
function checkExpert() {
  if(S.answered)return;
  S.answered=true;
  const input=document.getElementById('expert-input').value.trim().toLowerCase();
  const q=S.currentQ;
  const answerWords=q.answer.toLowerCase().split(' ');
  const inputWords=input.split(' ');
  const keyMatches=q.acceptPartial.filter(w=>input.includes(w.toLowerCase()));
  const wordMatches=answerWords.filter(w=>w.length>3&&inputWords.some(iw=>iw.includes(w.substring(0,4))));
  const isCorrect=keyMatches.length>=2||wordMatches.length>=Math.ceil(answerWords.length*.5);

  if(isCorrect) {
    handleCorrect(pick(RITA_CORRECT_E));
  } else {
    // Reveal answer and move on
    setPose('encourage');
    const msg=`${pick(RITA_WRONG_E)} "${q.answer}"`;
    document.getElementById('result-icon').textContent='🎵';
    document.getElementById('result-title').textContent='The correct line was:';
    document.getElementById('result-line').textContent=`"${q.answer}"`;
    document.getElementById('result-pts').textContent='+0 BeatCoins';
    document.getElementById('result-pts').style.color='rgba(255,255,255,.4)';
    document.getElementById('result-panel').classList.add('show');
    speak(msg);
    S.qIndex++;
    document.getElementById('q-val').textContent=`${S.qIndex}/8`;
    if(S.qIndex<8) document.getElementById('next-btn').style.display='block';
    else setTimeout(()=>finishGame(),2000);
    setTimeout(()=>document.getElementById('scroll-area').scrollTo({top:9999,behavior:'smooth'}),300);
  }
}

// ── HANDLE CORRECT
function handleCorrect(msg) {
  const earned=LEVEL_CFG[S.level].bonus;
  S.score+=earned;S.beatcoins+=earned;
  document.getElementById('score-val').textContent=S.score;
  document.getElementById('bc-val').textContent=S.beatcoins;
  saveStorage();
  setPose('celebrate');
  document.getElementById('result-icon').textContent='🎉';
  document.getElementById('result-title').textContent=`Well done ${S.ladName}!`;
  document.getElementById('result-line').textContent=msg;
  document.getElementById('result-pts').textContent=`+${earned} BeatCoins!`;
  document.getElementById('result-pts').style.color='#4ade80';
  document.getElementById('result-panel').classList.add('show');
  celebrate();
  speak(msg);
  S.qIndex++;
  document.getElementById('q-val').textContent=`${S.qIndex}/8`;
  if(S.qIndex<8) document.getElementById('next-btn').style.display='block';
  else setTimeout(()=>finishGame(),2000);
  setTimeout(()=>document.getElementById('scroll-area').scrollTo({top:9999,behavior:'smooth'}),300);
}

function nextQuestion() {
  document.getElementById('next-btn').style.display='none';
  document.getElementById('result-panel').classList.remove('show');
  loadQuestion();
}

function finishGame() {
  S.gameActive=false;
  const bonus=LEVEL_CFG[S.level].bonusAll;
  S.beatcoins+=bonus;S.score+=bonus;
  document.getElementById('bc-val').textContent=S.beatcoins;
  document.getElementById('score-val').textContent=S.score;
  saveStorage();
  setPose('celebrate');
  document.getElementById('result-icon').textContent='🏆';
  document.getElementById('result-title').textContent="Rita's Star!";
  document.getElementById('result-line').textContent='"All you need is love!" — and you have it darling!';
  document.getElementById('result-pts').textContent=`+${bonus} Bonus BeatCoins!`;
  document.getElementById('result-pts').style.color='#ffde59';
  document.getElementById('result-panel').classList.add('show');
  document.getElementById('next-btn').style.display='none';
  document.getElementById('start-btn').textContent='🔄 Play Again!';
  document.getElementById('start-btn').style.display='block';
  document.getElementById('start-btn').onclick=()=>{resetGame();startGame();};
  celebrate();
  setTimeout(()=>speak(pick(RITA_COMPLETE)),500);
}

// ── MIC
function toggleMic() {
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('🎤 Microphone not supported in this browser');return;}
  if(S.listening){S.recognition&&S.recognition.stop();return;}
  S.recognition=new SR();
  S.recognition.lang='en-GB';S.recognition.interimResults=false;
  S.recognition.onstart=()=>{
    S.listening=true;
    document.getElementById('mic-btn').classList.add('listening');
    document.getElementById('mic-status').textContent='🎤 Listening... sing it love!';
  };
  S.recognition.onresult=e=>{
    const t=e.results[0][0].transcript;
    document.getElementById('expert-input').value=t;
    document.getElementById('mic-status').textContent=`Heard: "${t}"`;
    S.listening=false;
    document.getElementById('mic-btn').classList.remove('listening');
  };
  S.recognition.onerror=()=>{
    S.listening=false;
    document.getElementById('mic-btn').classList.remove('listening');
    document.getElementById('mic-status').textContent='Could not hear — try typing instead';
  };
  S.recognition.onend=()=>{
    S.listening=false;
    document.getElementById('mic-btn').classList.remove('listening');
  };
  S.recognition.start();
}

// ── NAV
function goBack()    { window.location.href=BASE+'page9_city.html'; }
function goHome()    { window.location.href=BASE+'index.html'; }
function goForward() { window.location.href=BASE+'index.html'; }

// ── SPEAK
function speak(text) {
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB';u.rate=0.9;u.pitch=1.1;
  const voices=window.speechSynthesis.getVoices();
  const brit=voices.find(v=>v.lang==='en-GB'&&v.name.toLowerCase().includes('female'))||voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'));
  if(brit)u.voice=brit;
  const rita=document.getElementById('rita-pose');
  rita.classList.add('speaking');
  u.onend=()=>rita.classList.remove('speaking');
  window.speechSynthesis.speak(u);
}
function ritaSpeak(){setPose('curious');speak(document.getElementById('rita-says').textContent);}
if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();}

// ── CELEBRATE
function celebrate() {
  const layer=document.getElementById('celebrate');layer.innerHTML='';
  const cols=['#ffd700','#ff6ef7','#4ade80','#60a5fa','#f472b6','#fff','#ffde59'];
  for(let i=0;i<55;i++){
    const el=document.createElement('div');el.className='cp';
    el.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*20}%;background:${cols[Math.floor(Math.random()*cols.length)]};animation-delay:${Math.random()*.8}s;animation-duration:${1.2+Math.random()*1}s;width:${6+Math.random()*10}px;height:${6+Math.random()*10}px;border-radius:${Math.random()>.5?'50%':'2px'};`;
    layer.appendChild(el);
  }
  setTimeout(()=>layer.innerHTML='',3000);
}

// ── HELPERS
let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),3000);}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function setDevice(w,h,name){const p=document.getElementById('phone');p.style.width=w+'px';p.style.height=h+'px';document.querySelectorAll('#device-bar button').forEach(b=>b.classList.toggle('active',b.textContent===name));}

init();
</script>
