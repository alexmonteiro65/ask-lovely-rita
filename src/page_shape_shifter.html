<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovely Rita Adventures — Shape Shifter</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a14;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;}
#device-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;}
#device-bar button{background:#1a1a2e;border:1px solid #333;color:#aaa;padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;transition:all .2s;}
#device-bar button:hover,#device-bar button.active{background:#333;color:#fff;border-color:#666;}
#phone-outer{background:#1c1c1c;border-radius:50px;padding:12px;box-shadow:0 0 0 2px #333,0 20px 60px rgba(0,0,0,.8);}
#phone{width:369px;height:828px;border-radius:40px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:#0a001a;transition:width .3s,height .3s;}
#notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#1c1c1c;border-radius:0 0 20px 20px;z-index:20;}
#scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:36px 12px 8px;scrollbar-width:none;}
#scroll-area::-webkit-scrollbar{display:none;}
#bg{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 40% 20%,#1a0040 0%,#0a001a 60%,#000 100%);border-radius:40px;overflow:hidden;pointer-events:none;}
nav#nav-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-around;padding:8px 20px 12px;border-top:1px solid rgba(255,255,255,.08);background:rgba(10,0,26,.8);backdrop-filter:blur(12px);position:relative;z-index:10;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;padding:5px 14px;border-radius:12px;transition:all .2s;font-size:10px;}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-btn .nav-icon{font-size:20px;line-height:1;}
body.theme-youngsters{--accent:#ff6ef7;--btn-grad:linear-gradient(135deg,#ff6ef7,#a855f7);}
body.theme-grownups{--accent:#ffde59;--btn-grad:linear-gradient(135deg,#ffde59,#c8860a);}
body.theme-experts{--accent:#c8a96e;--btn-grad:linear-gradient(135deg,#c8a96e,#6677aa);}
#page-header{text-align:center;margin-bottom:8px;position:relative;z-index:2;}
#page-header h1{font-size:16px;font-weight:900;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(135deg,#ff6ef7,#a855f7,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#page-header p{font-size:10px;color:rgba(255,255,255,.35);margin-top:2px;}
#level-tabs{display:flex;gap:5px;justify-content:center;margin-bottom:8px;position:relative;z-index:2;}
#level-tabs button{padding:4px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);font-size:9px;font-weight:700;cursor:pointer;transition:all .2s;text-transform:uppercase;}
#level-tabs button.active{background:var(--btn-grad);border-color:transparent;color:#fff;}
#rita-wrap{background:rgba(255,255,255,.06);border:1px solid rgba(168,85,247,.3);border-radius:14px;padding:8px 26px 8px 10px;position:relative;margin-bottom:8px;z-index:2;}
#rita-name{font-size:9px;font-weight:700;color:#a855f7;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;}
#rita-text{font-size:10px;color:rgba(255,255,255,.8);line-height:1.5;}
#rita-speak-btn{position:absolute;top:7px;right:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;color:#fff;}
#status-bar{display:flex;gap:6px;margin-bottom:8px;position:relative;z-index:2;}
.stat-card{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:4px 8px;}
.stat-label{font-size:7px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.5px;}
.stat-val{font-size:13px;font-weight:900;}
#bc-val{color:#ffde59;}#score-val{color:#a855f7;}#q-val{color:#60a5fa;}
#shape-display{display:flex;justify-content:center;align-items:center;margin-bottom:10px;position:relative;z-index:2;}
#shape-canvas{border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);}
#question-card{background:rgba(255,255,255,.06);border:1px solid rgba(168,85,247,.3);border-radius:16px;padding:10px 12px;margin-bottom:8px;position:relative;z-index:2;text-align:center;}
#question-number{font-size:8px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;}
#question-text{font-size:11px;font-weight:700;color:#fff;line-height:1.5;}
#answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative;z-index:2;margin-bottom:8px;}
.ans-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 6px;color:#fff;font-size:10px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;line-height:1.3;font-family:'Segoe UI',system-ui,sans-serif;}
.ans-btn:hover:not(.locked){background:rgba(168,85,247,.2);border-color:rgba(168,85,247,.5);}
.ans-btn.correct{background:rgba(74,222,128,.2);border-color:#4ade80;color:#4ade80;}
.ans-btn.wrong{background:rgba(248,113,113,.2);border-color:#f87171;color:#f87171;}
.ans-btn.locked{cursor:default;opacity:.7;}
#open-input-wrap{position:relative;z-index:2;margin-bottom:8px;display:none;}
#open-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:10px 12px;color:#fff;font-size:12px;font-family:'Segoe UI',system-ui,sans-serif;outline:none;}
#open-input:focus{border-color:var(--accent);}
#submit-btn{width:100%;margin-top:6px;padding:10px;background:var(--btn-grad);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:'Segoe UI',system-ui,sans-serif;}
#result-card{background:rgba(255,255,255,.06);border:1px solid rgba(168,85,247,.3);border-radius:16px;padding:14px;text-align:center;display:none;position:relative;z-index:2;margin-bottom:10px;}
#result-icon{font-size:28px;margin-bottom:6px;}
#result-title{font-size:13px;font-weight:900;margin-bottom:4px;}
#result-pts{font-size:16px;font-weight:900;color:#ffde59;margin-bottom:6px;}
#result-fact{font-size:9px;color:rgba(255,255,255,.6);line-height:1.5;margin-bottom:10px;}
#next-btn{padding:10px 28px;background:var(--btn-grad);border:none;border-radius:20px;color:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:'Segoe UI',system-ui,sans-serif;}
#congrats-card{display:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,215,0,.4);border-radius:18px;padding:16px;text-align:center;position:relative;z-index:2;margin-bottom:10px;}
#congrats-title{font-size:16px;font-weight:900;background:linear-gradient(135deg,#ffde59,#c8a96e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;}
#congrats-bc{font-size:13px;font-weight:700;color:#ffde59;margin-bottom:10px;}
#bonus-btn{padding:12px 24px;background:linear-gradient(135deg,#4ade80,#16a34a);border:none;border-radius:20px;color:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:'Segoe UI',system-ui,sans-serif;width:100%;margin-bottom:6px;}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(30,30,50,.95);border:1px solid rgba(168,85,247,.4);border-radius:20px;padding:8px 20px;font-size:12px;color:#fff;pointer-events:none;opacity:0;transition:opacity .3s;z-index:999;white-space:nowrap;}
</style>
</head>

<div id="device-bar">
  <button class="active" onclick="setDevice(369,828,this)">iPhone 14 Pro</button>
  <button onclick="setDevice(390,844,this)">iPhone 14</button>
  <button onclick="setDevice(375,812,this)">iPhone 12</button>
  <button onclick="setDevice(360,800,this)">Android</button>
</div>
<div id="phone-outer"><div id="phone">
  <div id="notch"></div><div id="bg"></div>
  <div id="scroll-area">
    <div id="page-header">
      <h1>📐 Shape Shifter</h1>

    </div>
    <div id="level-tabs">

    <button class="nav-btn" onclick="goBonus()"><span class="nav-icon">▶️</span><span>Next</span></button>
  </nav>
</div></div>

<script>
const params = new URLSearchParams(location.search);
const LEVEL_CFG = {
  youngsters:{bonus:25,bonusAll:100,qCount:6},
  grownups:{bonus:35,bonusAll:140,qCount:7},
  experts:{bonus:50,bonusAll:180,qCount:8},
};

// Shape drawing functions
const SHAPES = {
  circle:    {draw:(c,x,y,s,col)=>{c.beginPath();c.arc(x,y,s*.45,0,Math.PI*2);c.fillStyle=col;c.fill();},fact:"A circle is perfectly round! Every point on its edge is exactly the same distance from the centre. The Lads love the circular shape of a vinyl record!"},
  square:    {draw:(c,x,y,s,col)=>{c.fillStyle=col;c.fillRect(x-s*.4,y-s*.4,s*.8,s*.8);},fact:"A square has 4 equal sides and 4 right angles. Smart Lad says squares are perfectly balanced just like a great song!"},
  triangle:  {draw:(c,x,y,s,col)=>{c.beginPath();c.moveTo(x,y-s*.45);c.lineTo(x+s*.45,y+s*.35);c.lineTo(x-s*.45,y+s*.35);c.closePath();c.fillStyle=col;c.fill();},fact:"A triangle has 3 sides and 3 angles. The angles always add up to 180 degrees! Funny Lad uses triangle cymbals in the orchestra!"},
  rectangle: {draw:(c,x,y,s,col)=>{c.fillStyle=col;c.fillRect(x-s*.48,y-s*.28,s*.96,s*.56);},fact:"A rectangle has 4 sides where opposite sides are equal. A square is actually a special rectangle where all sides are equal!"},
  pentagon:  {draw:(c,x,y,s,col)=>{drawPoly(c,x,y,s*.45,5,col);},fact:"A pentagon has 5 sides and 5 angles. The angles add up to 540 degrees! The famous Pentagon building in Washington DC has this shape!"},
  hexagon:   {draw:(c,x,y,s,col)=>{drawPoly(c,x,y,s*.45,6,col);},fact:"A hexagon has 6 sides. Honeybees build their honeycombs in hexagon shapes because it is the most efficient use of space!"},
  octagon:   {draw:(c,x,y,s,col)=>{drawPoly(c,x,y,s*.45,8,col);},fact:"An octagon has 8 sides. Stop signs are octagon shaped! The angles add up to 1080 degrees."},
  diamond:   {draw:(c,x,y,s,col)=>{c.beginPath();c.moveTo(x,y-s*.45);c.lineTo(x+s*.38,y);c.lineTo(x,y+s*.45);c.lineTo(x-s*.38,y);c.closePath();c.fillStyle=col;c.fill();},fact:"A diamond shape is actually a rhombus — 4 equal sides but tilted. Cute Lad loves diamond shapes because they look like guitar picks!"},
  star:      {draw:(c,x,y,s,col)=>{drawStar(c,x,y,s*.45,s*.2,5,col);},fact:"Stars have 5 points. The Lads became five-pointed stars in the music world — shining brightly for everyone to see!"},
  oval:      {draw:(c,x,y,s,col)=>{c.beginPath();c.ellipse(x,y,s*.45,s*.3,0,0,Math.PI*2);c.fillStyle=col;c.fill();},fact:"An oval is like a stretched circle. It is also called an ellipse. The Earth's orbit around the sun is an oval shape!"},
};

function drawPoly(c,x,y,r,sides,col){
  c.beginPath();
  for(let i=0;i<sides;i++){const a=i/sides*Math.PI*2-Math.PI/2;c.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));}
  c.closePath();c.fillStyle=col;c.fill();
}
function drawStar(c,x,y,ro,ri,pts,col){
  c.beginPath();
  for(let i=0;i<pts*2;i++){const r=i%2===0?ro:ri;const a=i/pts*Math.PI-Math.PI/2;c.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));}
  c.closePath();c.fillStyle=col;c.fill();
}

const ALL_QS = [
  // YOUNGSTERS
  {q:"What shape is this love?",shape:'circle',answers:['Circle','Square','Triangle','Rectangle'],correct:0,levels:['y','g','e']},
  {q:"What shape is this love?",shape:'square',answers:['Triangle','Square','Pentagon','Oval'],correct:1,levels:['y','g','e']},
  {q:"What shape is this love?",shape:'triangle',answers:['Triangle','Rectangle','Circle','Diamond'],correct:0,levels:['y','g','e']},
  {q:"What shape is this love?",shape:'rectangle',answers:['Square','Star','Rectangle','Hexagon'],correct:2,levels:['y','g','e']},
  {q:"What shape is this love?",shape:'star',answers:['Diamond','Star','Pentagon','Oval'],correct:1,levels:['y','g','e']},
  {q:"What shape is this love?",shape:'oval',answers:['Circle','Oval','Hexagon','Rectangle'],correct:1,levels:['y','g','e']},
  // GROWN UPS
  {q:"I have 5 equal sides and 5 angles. My angles add up to 540 degrees. What am I?",shape:'pentagon',answers:['Hexagon','Octagon','Pentagon','Diamond'],correct:2,levels:['g','e']},
  {q:"Honeybees build their honeycombs in my shape because I am the most efficient. What am I?",shape:'hexagon',answers:['Square','Pentagon','Octagon','Hexagon'],correct:3,levels:['g','e']},
  {q:"I have 4 equal sides but I am tilted like a guitar pick. What am I?",shape:'diamond',answers:['Square','Diamond','Rectangle','Parallelogram'],correct:1,levels:['g','e']},
  {q:"Stop signs are shaped like me. I have 8 sides. What am I?",shape:'octagon',answers:['Hexagon','Pentagon','Octagon','Decagon'],correct:2,levels:['g','e']},
  // EXPERTS — text answer
  {q:"How many degrees do the angles of a triangle add up to?",shape:'triangle',answers:['90','180','270','360'],correct:1,levels:['e'],isText:false},
  {q:"How many sides does a dodecagon have?",shape:'hexagon',answers:['10','8','12','14'],correct:2,levels:['e'],isText:false},
  {q:"What is the area of a square with sides of 7?",shape:'square',answers:['28','14','49','21'],correct:2,levels:['e'],isText:false,extra:"Area = side × side. So 7 × 7 = 49!"},
  {q:"A circle with radius 5 — what is its circumference? (Use π = 3.14)",shape:'circle',answers:['15.7','25.13','31.4','62.8'],correct:2,levels:['e'],isText:false,extra:"Circumference = 2 × π × radius = 2 × 3.14 × 5 = 31.4"},
];

const COLORS = ['#ff6ef7','#60a5fa','#4ade80','#ffde59','#f87171','#c084fc','#34d399','#fb923c'];
let S={level:'youngsters',beatcoins:0,score:0,qIndex:0,order:[],answered:false,currentQ:null};

function init(){
  const lv=params.get('level')||localStorage.getItem('askLovelyRitaV4_level')||'youngsters';
  setLevel(lv,true);
  S.beatcoins=['smart','cute','quiet','funny'].reduce((s,l)=>s+Number(localStorage.getItem('askLovelyRitaV4_bc_'+l)||0),0);
  updateDisplay();
  speak("Welcome to Shape Shifter love! I will show you a shape and read the question for you. Let us explore geometry together!");
}

function setLevel(lv,silent){
  S.level=lv;
  localStorage.setItem('askLovelyRitaV4_level',lv);
  document.body.className='theme-'+lv;
  ['y','g','e'].forEach(t=>document.getElementById('tab-'+t).classList.remove('active'));
  document.getElementById('tab-'+lv[0]).classList.add('active');
  if(!silent) resetGame();
}

function resetGame(){
  S.qIndex=0;S.score=0;S.answered=false;S.currentQ=null;
  document.getElementById('result-card').style.display='none';
  document.getElementById('congrats-card').style.display='none';
  document.getElementById('question-card').style.display='block';
  document.getElementById('answers-grid').style.display='grid';
  document.getElementById('open-input-wrap').style.display='none';
  updateDisplay();
  startGame();
}

function startGame(){
  const cfg=LEVEL_CFG[S.level];
  const pool=ALL_QS.filter(q=>q.levels.includes(S.level[0]));
  S.order=shuffle(pool.map((_,i)=>i)).slice(0,Math.min(cfg.qCount,pool.length));
  S.qIndex=0;
  showQ();
}

function showQ(){
  const pool=ALL_QS.filter(q=>q.levels.includes(S.level[0]));
  if(S.qIndex>=S.order.length){showCongrats();return;}
  const q=pool[S.order[S.qIndex]];
  S.currentQ=q;S.answered=false;
  document.getElementById('result-card').style.display='none';
  document.getElementById('question-card').style.display='block';
  document.getElementById('question-number').textContent=`Question ${S.qIndex+1} of ${S.order.length}`;
  document.getElementById('question-text').textContent=q.q;
  document.getElementById('q-val').textContent=`${S.qIndex+1}/${S.order.length}`;

  // Draw shape
  const cv=document.getElementById('shape-canvas');
  const c=cv.getContext('2d');
  c.clearRect(0,0,cv.width,cv.height);
  const col=COLORS[S.qIndex%COLORS.length];
  // Glow
  c.shadowColor=col;c.shadowBlur=30;
  SHAPES[q.shape].draw(c,cv.width/2,cv.height/2,Math.min(cv.width,cv.height),col);
  c.shadowBlur=0;

  // Answers
  document.getElementById('answers-grid').style.display='grid';
  document.getElementById('open-input-wrap').style.display='none';
  q.answers.forEach((a,i)=>{
    const btn=document.getElementById('ans-'+i);
    btn.textContent=a;btn.className='ans-btn';
  });

  setRita(q.q);
  speak(q.q);
  updateDisplay();
}

function checkAnswer(idx){
  if(S.answered)return;
  S.answered=true;
  const q=S.currentQ;
  const ok=idx===q.correct;
  const pts=ok?LEVEL_CFG[S.level].bonus:0;
  document.querySelectorAll('.ans-btn').forEach((b,i)=>{
    b.classList.add('locked');
    if(i===q.correct)b.classList.add('correct');
    else if(i===idx&&!ok)b.classList.add('wrong');
  });
  if(ok){S.score+=pts;saveLadBC(pts);}
  updateDisplay();
  showResult(ok,pts,q);
}

function submitOpen(){
  if(S.answered)return;
  const val=document.getElementById('open-input').value.trim().toLowerCase();
  const q=S.currentQ;
  const correct=q.answers[q.correct].toLowerCase();
  const ok=val===correct||val.includes(correct)||correct.includes(val);
  const pts=ok?LEVEL_CFG[S.level].bonus:0;
  S.answered=true;
  if(ok){S.score+=pts;saveLadBC(pts);}
  updateDisplay();
  showResult(ok,pts,q);
}

function showResult(ok,pts,q){
  const rc=document.getElementById('result-card');
  document.getElementById('result-icon').textContent=ok?'📐':'🔷';
  document.getElementById('result-title').textContent=ok?'Brilliant love!':'Good try love!';
  document.getElementById('result-pts').textContent=ok?`+${pts} BeatCoins!`:`The answer is: ${q.answers[q.correct]}`;
  const fact=q.extra||SHAPES[q.shape]?.fact||'Shapes are everywhere in our world love!';
  document.getElementById('result-fact').textContent=fact;
  document.getElementById('next-btn').textContent=S.qIndex+1>=S.order.length?'See Results!':'Next Shape →';
  rc.style.display='block';
  const msg=ok?`That is correct love! ${fact}`:`Not quite darling! The answer is ${q.answers[q.correct]}. ${fact}`;
  setRita(msg);speak(msg);
  document.getElementById('scroll-area').scrollTop=9999;
}

function nextQ(){S.qIndex++;document.getElementById('answers-grid').style.display='grid';document.getElementById('open-input-wrap').style.display='none';showQ();setTimeout(()=>{document.getElementById('scroll-area').scrollTop=0;},100);}

function showCongrats(){
  const cfg=LEVEL_CFG[S.level];
  document.getElementById('question-card').style.display='none';
  document.getElementById('answers-grid').style.display='none';
  document.getElementById('result-card').style.display='none';
  document.getElementById('congrats-card').style.display='block';
  document.getElementById('congrats-bc').textContent=`+${cfg.bonusAll} BeatCoins earned!`;
  saveEBC(cfg.bonusAll);
  const msg=`Outstanding love! You are a true shape master! You earned ${cfg.bonusAll} BeatCoins! Now let us play!`;
  setRita(msg);speak(msg);
  document.getElementById('scroll-area').scrollTop=9999;
}

function updateDisplay(){
  const total=['smart','cute','quiet','funny'].reduce((s,l)=>s+Number(localStorage.getItem('askLovelyRitaV4_bc_'+l)||0),0);
  document.getElementById('bc-val').textContent=total;
  document.getElementById('score-val').textContent=S.score;
}
function setRita(t){document.getElementById('rita-text').textContent=t;}
function speakRita(){speak(document.getElementById('rita-text').textContent);}
function speak(text){
  if(localStorage.getItem('askLovelyRitaV4_mute')==='1'||!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=0.92;u.pitch=1.1;
  const v=window.speechSynthesis.getVoices();
  const voice=v.find(x=>x.lang==='en-GB'&&/female|woman/i.test(x.name))||v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang.startsWith('en'));
  if(voice)u.voice=voice;
  window.speechSynthesis.speak(u);
}
function saveLadBC(amount){try{const lad=localStorage.getItem('askLovelyRitaV4_chosen_lad')||'smart';const k='askLovelyRitaV4_bc_'+lad;localStorage.setItem(k,Number(localStorage.getItem(k)||0)+amount);postGlobalScore(amount);}catch(e){}}
function saveEBC(amount){try{const cur=Number(localStorage.getItem('lra_ebc_balance')||0);localStorage.setItem('lra_ebc_balance',cur+amount);}catch(e){}}
function postGlobalScore(amount){const lad=localStorage.getItem('askLovelyRitaV4_chosen_lad')||'smart';fetch('https://empty-leaf-6e4b.alexmonteironeto.workers.dev/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lad,amount})}).catch(()=>{});}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function setDevice(w,h,btn){document.querySelectorAll('#device-bar button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const p=document.getElementById('phone');p.style.width=w+'px';p.style.height=h+'px';}
function goBonus(){const lv=localStorage.getItem('askLovelyRitaV4_level')||'youngsters';window.location.href='page_deep_sea_catch.html?level='+lv+'&from=ocean';}
function goWorlds(){window.location.href='page5_worlds.html';}
init();
</script>
