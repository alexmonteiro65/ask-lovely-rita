<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovely Rita Adventures</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0a0a;
  display:flex; flex-direction:column;
  align-items:center; min-height:100vh;
  font-family:Georgia,serif; padding:0;
}

#device-bar {
  width:100%; background:#111; border-bottom:1px solid #222;
  padding:10px 16px; display:flex; gap:8px; align-items:center;
  flex-wrap:wrap; position:sticky; top:0; z-index:100;
}
#device-bar span { color:#555; font-size:10px; font-family:monospace; letter-spacing:1px; margin-right:4px; }
.dev-btn {
  background:#1a1a1a; border:1px solid #333; color:#888;
  padding:5px 10px; border-radius:4px; cursor:pointer;
  font-family:monospace; font-size:9px; letter-spacing:0.5px;
  transition:all 0.2s; white-space:nowrap;
}
.dev-btn:hover { border-color:#555; color:#ccc; }
.dev-btn.active { background:#ff6ef7; border-color:#ff6ef7; color:#000; font-weight:bold; }

#phone-outer {
  display:flex; justify-content:center; align-items:flex-start;
  padding:20px 0 40px; width:100%;
}
#phone {
  background:var(--bg, #1a0040);
  overflow:hidden; position:relative;
  display:flex; flex-direction:column;
  transition:background 0.5s, width 0.3s, height 0.3s, border-radius 0.3s;
  width:393px; height:852px;
  border-radius:48px;
  box-shadow:0 0 0 10px #1a1a1a, 0 0 0 12px #333, 0 30px 80px rgba(0,0,0,0.8);
}
#phone::before {
  content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:120px; height:34px; background:#0a0a0a;
  border-radius:0 0 20px 20px; z-index:100;
}

:root,
.theme-youngsters {
  --bg:#1a0040; --accent:#ff6ef7; --accent2:#ffde59; --glow:#ff6ef7;
  --iborder:#ff6ef7; --sub-color:#ffde59;
  --btn-grad:linear-gradient(135deg,#ff6ef7,#a855f7);
  --vinil-label:#ffde59; --vinil-label2:#ff9fff;
  --title-glow:0 0 24px #ff6ef7, 0 0 48px #a855f7;
  --card-bg:rgba(60,5,120,0.82); --card-border:#c89a00;
  --gem-bg:radial-gradient(circle,#c084fc,#7c3aed); --gem-glow:rgba(168,85,247,.9);
  --rita-glow:rgba(255,60,200,.75); --spin-color:#e040fb;
  --ring-color:rgba(255,70,215,0.52); --ring-glow:rgba(255,70,215,0.45);
  --ring-glow2:rgba(255,70,215,0.14); --ring-color2:rgba(255,155,50,0.38);
}
.theme-grownups {
  --bg:#1a1200; --accent:#ffde59; --accent2:#fff3a0; --glow:#ffde59;
  --iborder:#ffde59; --sub-color:#ffde59;
  --btn-grad:linear-gradient(135deg,#ffde59,#c8860a);
  --vinil-label:#ffde59; --vinil-label2:#fff3a0;
  --title-glow:0 0 24px #ffde59, 0 0 50px #c8860a;
  --card-bg:rgba(50,35,0,0.88); --card-border:#c89a00;
  --gem-bg:radial-gradient(circle,#fde68a,#d97706); --gem-glow:rgba(245,158,11,.9);
  --rita-glow:rgba(255,210,0,.65); --spin-color:#c8860a;
  --ring-color:rgba(255,210,0,0.48); --ring-glow:rgba(255,210,0,0.4);
  --ring-glow2:rgba(255,210,0,0.12); --ring-color2:rgba(255,120,0,0.35);
}
.theme-experts {
  --bg:#0d0d1e; --accent:#c8a96e; --accent2:#e8d5b0; --glow:#c8a96e;
  --iborder:#c8a96e; --sub-color:#c8a96e;
  --btn-grad:linear-gradient(135deg,#c8a96e,#6677aa);
  --vinil-label:#c8a96e; --vinil-label2:#e8d5b0;
  --title-glow:0 0 20px #c8a96e, 0 0 40px #6677aa;
  --card-bg:rgba(15,10,40,0.92); --card-border:#8a7040;
  --gem-bg:radial-gradient(circle,#93a8d4,#4a5e8a); --gem-glow:rgba(100,120,170,.9);
  --rita-glow:rgba(200,170,110,.65); --spin-color:#6677aa;
  --ring-color:rgba(200,170,110,0.45); --ring-glow:rgba(200,170,110,0.38);
  --ring-glow2:rgba(200,170,110,0.12); --ring-color2:rgba(100,120,170,0.38);
}

#phone-scroll {
  flex:1; overflow-y:auto; overflow-x:hidden;
  display:flex; flex-direction:column; padding-top:34px;
}
#phone-scroll::-webkit-scrollbar { width:0; }

#header {
  padding:16px 16px 10px;
  display:flex; flex-direction:column; align-items:center;
  background:var(--bg); transition:background 0.5s; flex-shrink:0;
}
#title-wrap { text-align:center; margin-bottom:10px; }
#main-title {
  font-size:24px; font-weight:bold; letter-spacing:2px;
  color:var(--accent); text-shadow:var(--title-glow);
  font-family:Georgia,serif;
}
#subtitle {
  font-size:12px; color:var(--accent2); letter-spacing:1.5px;
  margin-top:4px; opacity:0.8;
}

#rita-box {
  display:flex; align-items:center; gap:6px;
  width:100%; margin-bottom:8px;
}
#mic-btn {
  background:none; border:1px solid var(--accent); border-radius:50%;
  width:36px; height:36px; cursor:pointer; display:flex;
  align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s;
}
#mic-btn:hover { background:var(--accent); }
#rita-input {
  flex:1; background:rgba(255,255,255,0.07); border:1px solid var(--iborder);
  border-radius:20px; padding:8px 14px; color:#fff;
  font-size:12px; outline:none; font-family:Georgia,serif;
}
#rita-input::placeholder { color:rgba(255,255,255,0.3); }
#rita-btn {
  background:var(--btn-grad); border:none; border-radius:20px;
  padding:8px 14px; color:#000; font-weight:bold;
  font-size:11px; cursor:pointer; white-space:nowrap;
  font-family:Georgia,serif; letter-spacing:0.5px;
}

#playlist-btn {
  display:flex; align-items:center; gap:8px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
  border-radius:10px; padding:8px 12px; cursor:pointer;
  width:100%; margin-bottom:6px;
}
.pl-title { font-size:11px; color:var(--accent); font-weight:bold; flex:1; }
#playlist-dropdown {
  display:none; flex-direction:column; gap:2px;
  background:rgba(0,0,0,0.4); border-radius:8px;
  padding:6px; margin-bottom:6px; width:100%;
}
#playlist-dropdown.open { display:flex; }
.pl-track {
  display:flex; align-items:center; gap:8px;
  padding:7px 10px; border-radius:6px; cursor:pointer; transition:background 0.2s;
}
.pl-track:hover, .pl-track.playing { background:rgba(255,255,255,0.08); }
.pl-track-num { color:rgba(255,255,255,0.3); font-size:10px; width:14px; }
.pl-track-name { flex:1; color:#ddd; font-size:11px; }
.pl-track-icon { color:var(--accent); font-size:12px; }

#scroll-body { flex:1; padding:0 12px 12px; display:flex; flex-direction:column; gap:8px; }

#theme-bar { display:flex; gap:6px; width:100%; }
.theme-btn {
  flex:1; padding:6px; border:1px solid rgba(255,255,255,0.15);
  border-radius:8px; background:rgba(255,255,255,0.05);
  color:#aaa; font-size:9px; cursor:pointer; font-family:Georgia,serif;
  letter-spacing:0.5px; transition:all 0.2s;
}
.theme-btn:hover { border-color:var(--accent); color:#fff; }
.theme-btn.active { background:var(--btn-grad); color:#000; border-color:transparent; font-weight:bold; }

/* ═══════════════════════════════════════════════════════════════
   LAD SECTION — stacking context for oval rings
   margin-top:16px keeps oval away from theme buttons above
   ═══════════════════════════════════════════════════════════════ */
#lad-section {
  display:flex; flex-direction:column; align-items:center;
  gap:10px;
  position:relative; z-index:0;
  margin-top:16px;
}

/* OUTER NEON OVAL */
#lad-section::before {
  content:''; position:absolute; z-index:-1;
  width:100%; height:330px;
  top:0; left:0;
  border-radius:50%;
  border:2.5px solid var(--ring-color);
  box-shadow:0 0 28px var(--ring-glow),0 0 70px var(--ring-glow2),inset 0 0 50px var(--ring-glow2);
  pointer-events:none; transition:border-color .5s,box-shadow .5s;
}
/* INNER ACCENT OVAL */
#lad-section::after {
  content:''; position:absolute; z-index:-1;
  width:78%; height:290px;
  top:16px; left:11%;
  border-radius:50%;
  border:1.5px solid var(--ring-color2);
  box-shadow:0 0 16px var(--ring-glow2);
  pointer-events:none; transition:border-color .5s,box-shadow .5s;
}

/* ═══════════════════════════════════════════════════════════════
   3-COLUMN GRID — fixed 140px rows = all 4 Lad cards equal size
   ═══════════════════════════════════════════════════════════════ */
#lad-cards {
  display:grid;
  grid-template-columns:1fr 1.15fr 1fr;
  grid-template-rows:155px 155px;
  gap:8px; width:100%;
  position:relative; z-index:1;
}
#card-smart  { grid-column:1; grid-row:1; }
#card-cute   { grid-column:3; grid-row:1; }
#rita-center { grid-column:2; grid-row:1/3; }
#card-quiet  { grid-column:1; grid-row:2; }
#card-funny  { grid-column:3; grid-row:2; }

/* LAD CORNER CARDS */
.lad-card {
  background:transparent;
  border:none;
  border-radius:14px; padding:9px 5px 7px;
  display:flex; flex-direction:column; align-items:center;
  gap:4px; position:relative;
  box-shadow:none;
  transition:transform .35s ease, box-shadow .3s, opacity .35s;
  overflow:visible; cursor:default;
}
.lad-card.clickable { cursor:pointer; }
.lad-card.clickable:hover { box-shadow:0 0 18px var(--glow); background:rgba(255,255,255,.07); }
.lad-card.highlighted {
  box-shadow:0 0 24px var(--glow),0 0 48px var(--glow) !important;
  background:rgba(255,255,255,.12) !important;
}
.lad-card.chosen {
  transform:scale(1.12);
  box-shadow:0 0 38px var(--glow),0 0 75px var(--glow) !important;
  background:rgba(255,255,255,.16) !important;
  cursor:pointer;
}
.lad-card.locked { opacity:0.18; cursor:not-allowed; }
.lad-card img { width:63px; height:63px; object-fit:contain; flex-shrink:0; }
.lad-card-name { font-size:10px; font-weight:bold; color:#fff !important; letter-spacing:.3px; text-align:center; line-height:1.2; white-space:nowrap; }

/* Score bar — number only, no BC suffix */
.lad-score-bar {
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.38); border:1px solid rgba(255,255,255,.1);
  border-radius:6px; padding:3px 5px; width:calc(100% - 4px);
}
.lad-score-val { font-size:16px; font-weight:bold; color:var(--accent); letter-spacing:.5px; line-height:1; }

/* "BeatCoins" badge (replaces old "Pick me!") */
.pick-me-bubble {
  font-size:9px; color:#fff !important;
  background:var(--btn-grad); border-radius:6px;
  padding:2px 8px; text-align:center; letter-spacing:.3px;
}

/* Diamond gems at card corners */
.gem { display:none; }
.gem-tl { top:3px; left:3px; } .gem-tr { top:3px; right:3px; }
.gem-bl { bottom:3px; left:3px; } .gem-br { bottom:3px; right:3px; }

/* ═══════════════════════════════════════════════════════════════
   RITA CENTRE CARD — spans both grid rows (288px tall)
   ═══════════════════════════════════════════════════════════════ */
#rita-center {
  background:transparent;
  border:none; border-radius:18px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; padding:12px 6px; position:relative;
  box-shadow:none;
  overflow:visible;
}
#rita-center::before { display:none; }
#rita-center::after  { display:none; }
#rita-avatar { width:auto; height:175px; object-fit:contain; filter:drop-shadow(0 0 10px rgba(255,255,255,.25)) drop-shadow(0 4px 14px rgba(0,0,0,.55)); position:relative; z-index:1; }
.rita-center-name { font-size:11px; font-weight:bold; color:#ffd700; letter-spacing:1.3px; text-align:center; text-shadow:0 0 10px rgba(255,215,0,.7); }
.rita-center-role { font-size:7.5px; color:rgba(255,255,255,.38); letter-spacing:.8px; text-align:center; }

/* ═══════════════════════════════════════════════════════════════
   SPIN PLATFORM — circular button, word PLAY, no arrows
   ═══════════════════════════════════════════════════════════════ */
#spin-platform { display:flex; align-items:center; justify-content:center; width:100%; }

#pick-lad-btn {
  width:66px; height:66px; border-radius:50%;
  background:radial-gradient(circle at 38% 35%,var(--spin-color),#4a006a);
  border:none; outline:3px solid #ffd700; outline-offset:2px;
  box-shadow:0 0 26px var(--rita-glow),0 0 55px rgba(255,60,200,.25),inset 0 2px 10px rgba(255,255,255,.14),0 5px 18px rgba(0,0,0,.6);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:bold; color:#ffd700; letter-spacing:1.5px;
  font-family:Georgia,serif;
  transition:transform .15s, box-shadow .2s, opacity .3s;
}
#pick-lad-btn:hover:not(:disabled) { transform:scale(1.07); box-shadow:0 0 38px var(--rita-glow),0 0 80px rgba(255,60,200,.35); }
#pick-lad-btn:active:not(:disabled) { transform:scale(.94); }
#pick-lad-btn:disabled { opacity:0.3; cursor:not-allowed; filter:grayscale(0.5); }
@keyframes level-pulse {
  0%,100% { box-shadow:0 0 8px var(--accent); transform:scale(1); }
  50% { box-shadow:0 0 18px var(--accent),0 0 30px var(--accent); transform:scale(1.04); }
}
.theme-btn.pulse { animation:level-pulse 1.2s ease-in-out infinite; }

/* ═══════════════════════════════════════════════════════════════
   BEATCOINS TOTAL BAR
   ═══════════════════════════════════════════════════════════════ */
#bc-wrap {
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  border-radius:10px; padding:8px 14px;
  display:flex; align-items:center; justify-content:space-between; width:100%;
}
.bc-label { font-size:16px; font-weight:bold; color:var(--accent); letter-spacing:0.4px; }
.bc-count { font-size:16px; font-weight:bold; color:var(--accent); letter-spacing:1px; }

/* ═══════════════════════════════════════════════════════════════
   RITA TEXT BOX — response text lives here
   ID rita-response-text preserved so JS works unchanged
   ═══════════════════════════════════════════════════════════════ */
#rita-text-box {
  background:transparent; border:none;
  border-radius:0; padding:6px 4px; width:100%;
  min-height:36px; display:flex; align-items:center;
}
#rita-response-text {
  font-size:13px; color:rgba(255,255,255,.65); line-height:1.5; font-style:italic;
  width:100%; text-align:center;
}

#nav-bar {
  display:flex; justify-content:space-around; align-items:center;
  padding:10px 0 14px;
  background:rgba(0,0,0,0.4); border-top:1px solid rgba(255,255,255,0.06);
  flex-shrink:0;
}
.nav-btn {
  background:none; border:none; color:rgba(255,255,255,0.4);
  font-size:9px; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; gap:3px; padding:4px 8px;
  transition:color 0.2s; font-family:Georgia,serif;
}
.nav-btn:hover { color:var(--accent); }
.nav-btn.nav-home { color:var(--accent); }
.nav-icon { font-size:18px; }

#toast {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.85); color:#fff; padding:10px 20px;
  border-radius:20px; font-size:13px; opacity:0;
  transition:opacity 0.3s; pointer-events:none; z-index:999;
  font-family:Georgia,serif;
}
#size-label { color:#333; font-size:10px; font-family:monospace; margin-top:8px; letter-spacing:1px; }

/* Tap overlay removed — audio unlock via PLAY button */

#tap-stars{font-size:11px;color:#ffd700;letter-spacing:6px;margin-bottom:8px;opacity:.7;}
#tap-app-title{
  font-size:24px;font-weight:bold;letter-spacing:2px;text-align:center;
  background:linear-gradient(135deg,#ff6ef7,#ffd700);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 16px rgba(255,110,247,.5));
  margin-bottom:4px;
}
#tap-app-sub{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:2px;margin-bottom:20px;}
#tap-rita{
  width:140px;height:140px;object-fit:contain;
  filter:drop-shadow(0 0 20px rgba(255,110,247,.6));
  margin-bottom:20px;
}
#tap-bubble{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,110,247,.4);
  border-radius:16px;padding:12px 18px;max-width:240px;text-align:center;
  font-size:11px;color:rgba(255,255,255,.8);font-style:italic;line-height:1.6;
  margin-bottom:24px;
}
#tap-btn{
  background:linear-gradient(135deg,#ff6ef7,#a855f7);
  border:none;border-radius:28px;
  padding:16px 40px;
  color:#000;font-weight:bold;font-size:15px;
  cursor:pointer;font-family:Georgia,serif;
  box-shadow:0 0 30px rgba(255,110,247,.7),0 4px 20px rgba(0,0,0,.4);
  letter-spacing:1px;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 30px rgba(255,110,247,.7),0 4px 20px rgba(0,0,0,.4);}
  50%{box-shadow:0 0 50px rgba(255,110,247,.95),0 4px 30px rgba(0,0,0,.5);}
}
#tap-btn:hover{transform:scale(1.05);}
#tap-version{font-size:8px;color:rgba(255,255,255,.2);margin-top:20px;letter-spacing:1px;}
</style>
</head>
<body>

<div id="device-bar">
  <span>PREVIEW:</span>
  <button class="dev-btn active" onclick="setDevice(393,852,'iPhone 14 Pro')">iPhone 14 Pro · 393×852</button>
  <button class="dev-btn" onclick="setDevice(390,844,'iPhone 14')">iPhone 14 · 390×844</button>
  <button class="dev-btn" onclick="setDevice(375,812,'iPhone 12')">iPhone 12 · 375×812</button>
  <button class="dev-btn" onclick="setDevice(414,896,'iPhone 11')">iPhone 11 · 414×896</button>
  <button class="dev-btn" onclick="setDevice(360,800,'Android')">Android · 360×800</button>
  <button class="dev-btn" onclick="setDevice(320,568,'iPhone SE')">iPhone SE · 320×568</button>
</div>

<div id="phone-outer">
<div id="phone" class="theme-youngsters">



  <div id="phone-scroll">

    <div id="header">
      <div id="title-wrap">
        <div id="main-title">Lovely Rita Adventures</div>
        <div id="subtitle">Learning with Music for Generations</div>
      </div>

      <div id="rita-box">
        <button id="mic-btn" onclick="toggleMic()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <rect x="9" y="2" width="6" height="11" rx="3" fill="var(--accent)"/>
            <path d="M5 11a7 7 0 0 0 14 0" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" fill="none"/>
            <line x1="12" y1="18" x2="12" y2="22" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="22" x2="16" y2="22" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <input id="rita-input" type="text" placeholder="Speak or type any question..." autocomplete="off">
        <button id="rita-btn" onclick="askRita()">ASK RITA ♪</button>
      </div>

    </div>

    <div id="scroll-body">

      <div id="theme-bar">
        <button class="theme-btn active" id="tbtn-y" onclick="switchTheme('youngsters')">🟣 YOUNGSTERS</button>
        <button class="theme-btn" id="tbtn-g" onclick="switchTheme('grownups')">🟡 GROWN UPS</button>
        <button class="theme-btn" id="tbtn-e" onclick="switchTheme('experts')">⭐ EXPERTS</button>
      </div>

      <div id="lad-section">

        <div id="lad-cards">

          <div class="lad-card" id="card-smart" onclick="chooseLad('smart')">
            <span class="gem gem-tl"></span><span class="gem gem-tr"></span>
            <span class="gem gem-bl"></span><span class="gem gem-br"></span>
            <img id="lad-smart" src="https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/lad-smart-regular.png" alt="Smart Lad">
            <div class="lad-card-name">THE SMART ONE</div>
            <div class="lad-score-bar"><span class="lad-score-val" id="score-smart">0</span></div>
            <div class="pick-me-bubble">BeatCoins</div>
          </div>

          <div class="lad-card" id="card-cute" onclick="chooseLad('cute')">
            <span class="gem gem-tl"></span><span class="gem gem-tr"></span>
            <span class="gem gem-bl"></span><span class="gem gem-br"></span>
            <img id="lad-cute" src="https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/lad-cute-regular.png" alt="Cute Lad">
            <div class="lad-card-name">THE CUTE ONE</div>
            <div class="lad-score-bar"><span class="lad-score-val" id="score-cute">0</span></div>
            <div class="pick-me-bubble">BeatCoins</div>
          </div>

<div id="toast"></div>

<script>
const BASE = 'https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/';

const LADS_IMG = {
  regular:{ smart:'lad-smart-regular.png', cute:'lad-cute-regular.png', quiet:'lad-quiet-regular.png', funny:'lad-funny-regular.png' },
  pepper:{  smart:'lad-smart-pepper.png',  cute:'lad-cute-pepper.png',  quiet:'lad-quiet-pepper.png',  funny:'lad-funny-pepper.png' },
  abbey:{   smart:'lad-smart-abbey.png',   cute:'lad-cute-abbey.png',   quiet:'lad-quiet-abbey.png',   funny:'lad-funny-abbey.png' }
};
const OUTFIT_MAP = { youngsters:'regular', grownups:'pepper', experts:'abbey' };
const LAD_QUOTES = {
  smart: "Together we shall be brilliant!",
  cute:  "We will charm our way to the top!",
  quiet: "Silence speaks volumes!",
  funny: "Laughter is the best lesson!"
};
const LAD_NAMES = { smart:"Smart Lad", cute:"Cute Lad", quiet:"Quiet Lad", funny:"Funny Lad" };

let isSpinning=false, chosenLad=null, playlistOpen=false, muteState=false;
let activeLevel='youngsters';
const LADS = ['smart','cute','quiet','funny'];

let levelChosen = false;
function switchTheme(t, fromInit) {
  // Only enable PLAY if player actually clicked — not from init
  if(!fromInit && !levelChosen){
    levelChosen = true;
    const playBtn = document.getElementById('pick-lad-btn');
    if(playBtn){ playBtn.disabled = false; }
    // Stop pulsing
    document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('pulse'));
  }
  activeLevel = t;
  document.getElementById('phone').className = 'theme-'+t;
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.remove('active'));
  const map = { youngsters:'y', grownups:'g', experts:'e' };
  document.getElementById('tbtn-'+map[t]).classList.add('active');
  const outfit = OUTFIT_MAP[t];
  LADS.forEach(l => { document.getElementById('lad-'+l).src = BASE + LADS_IMG[outfit][l]; });
  localStorage.setItem('askLovelyRitaV4_level', t);
  // Rita text box free-flows with page background — keep transparent
  const rtb = document.getElementById('rita-text-box');
  if(rtb) rtb.style.background = 'transparent';
}

function spinLads() {
  if(isSpinning) return;
  isSpinning = true;
  chosenLad = null;
  LADS.forEach(l => {
    const c = document.getElementById('card-'+l);
    c.classList.remove('highlighted','chosen','locked','clickable');
  });
  playSpinSound();
  playLevelMusic();
  const btn = document.getElementById('pick-lad-btn');
  btn.style.transform = 'scale(0.88)';
  setTimeout(()=>{ btn.style.transform = ''; }, 180);

  let idx = 0;
  const totalTicks = 18 + Math.floor(Math.random()*10);
  let ticks = 0;
  const iv = setInterval(()=>{
    LADS.forEach(l => document.getElementById('card-'+l).classList.remove('highlighted'));
    document.getElementById('card-'+LADS[idx%4]).classList.add('highlighted');
    idx++; ticks++;
    if(ticks >= totalTicks) {
      clearInterval(iv);
      isSpinning = false;
      const winner = LADS[(idx-1)%4];
      LADS.forEach(l => {
        const c = document.getElementById('card-'+l);
        c.classList.remove('highlighted');
        if(l === winner) c.classList.add('chosen','clickable');
        else c.classList.add('locked');
      });
      chosenLad = winner;
      const msg = "You got " + LAD_NAMES[winner] + " love! " + LAD_QUOTES[winner] + " Click on them to play or spin again!";
      updateRitaDisplay("♪ " + msg);
      ritaSpeak(msg);
      toast('🎵 ' + LAD_NAMES[winner] + ' is your companion!');
    }
  }, 80);
}

function chooseLad(lad) {
  if(lad !== chosenLad) {
    if(!chosenLad) toast('🎲 Spin first to pick your Lad!');
    else toast('⚠️ Spin again to choose a different Lad!');
    return;
  }
  localStorage.setItem('askLovelyRitaV4_lad', lad);
  localStorage.setItem('askLovelyRitaV4_chosen_lad', lad);
  const msg = "Brilliant choice love! Off we go with " + LAD_NAMES[lad] + "!";
  ritaSpeak(msg);
  updateRitaDisplay("♪ " + msg);
  toast('🎵 Off we go with ' + LAD_NAMES[lad] + '!');
  setTimeout(()=>{
    window.location.href = 'https://alexmonteiro65.github.io/ask-lovely-rita/src/page5_worlds.html?level='+activeLevel+'&lad='+lad;
  }, 1200);
}

const BASE_MUSIC = 'https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/music/';
let spinAudio = null;
const LEVEL_TRACKS = {
  youngsters: BASE_MUSIC + 'Beatles%20Rap%20-%20Part%201.mp3',
  grownups:   BASE_MUSIC + 'Beatles%20Rap%201.mp3',
  experts:    BASE_MUSIC + 'Beatles%20Rap%20-%20Part%202.mp3'
};

function playLevelMusic() {
  if(muteState) return;
  if(spinAudio){ spinAudio.pause(); spinAudio.currentTime=0; }
  const track = LEVEL_TRACKS[activeLevel] || LEVEL_TRACKS.youngsters;
  spinAudio = new Audio(track);
  spinAudio.volume = 0.55;
  spinAudio.play().catch(()=>{});
  // Stop after 30s automatically
  setTimeout(()=>{ if(spinAudio){ spinAudio.pause(); spinAudio=null; } }, 30000);
}

function playSpinSound() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    let t = ctx.currentTime;
    for(let i=0;i<6;i++){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 400+i*80;
      g.gain.setValueAtTime(0.08, t+i*0.07);
      g.gain.exponentialRampToValueAtTime(0.001, t+i*0.07+0.06);
      o.start(t+i*0.07); o.stop(t+i*0.07+0.07);
    }
  } catch(e){}
}

function ritaSpeak(text) {
  if(muteState || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=0.92; u.pitch=1.1;
  function doSpeak(){
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(v=>v.lang==='en-GB'&&/female|woman/i.test(v.name))
           || voices.find(v=>v.lang==='en-GB')
           || voices.find(v=>v.lang.startsWith('en-'))
           || voices.find(v=>v.lang.startsWith('en'))
           || (voices.length ? voices[0] : null);
    if(v) u.voice=v;
    if(window.speechSynthesis.paused) window.speechSynthesis.resume();
    window.speechSynthesis.speak(u);
  }
  const voices = window.speechSynthesis.getVoices();
  if(voices && voices.length > 0){ doSpeak(); }
  else {
    window.speechSynthesis.addEventListener('voiceschanged', doSpeak, {once:true});
    setTimeout(doSpeak, 600); // fallback if event never fires
  }
}
// Android keepalive — prevent mid-sentence pause on older devices
setInterval(()=>{
  if(window.speechSynthesis&&window.speechSynthesis.speaking&&
     window.speechSynthesis.paused) window.speechSynthesis.resume();
},3000);

const RITA_DEFAULT = "Millions of Fans Learning Worldwide";

function updateRitaDisplay(text) {
  document.getElementById('rita-response-text').textContent = text || RITA_DEFAULT;
}
function clearRitaDisplay() {
  document.getElementById('rita-response-text').textContent = RITA_DEFAULT;
}

window.addEventListener('load', ()=>{
  // Migration v5: one-time reset to ensure clean start from 0
  if(!localStorage.getItem('lra_bc_migrated_v5')){
    localStorage.setItem('lra_bc_migrated_v5','1');
    localStorage.setItem('askLovelyRitaV4_bc','0');
  }
  switchTheme('youngsters', true);
  muteState = localStorage.getItem('askLovelyRitaV4_mute') === '1';
  document.getElementById('sound-icon').textContent = muteState ? '🔇' : '🔊';
  const bc = Number(localStorage.getItem('askLovelyRitaV4_bc') || 0);
  document.getElementById('bc-display').textContent = bc.toLocaleString();
  loadLadScores();
  clearRitaDisplay();
  // Rita text box transparent on load
  const rtb0 = document.getElementById('rita-text-box');
  if(rtb0) rtb0.style.background = 'transparent';
  const greeting = "Hello love! Welcome to the world's first interactive music-powered learning platform. Choose your level, spin to meet your companion, ask me anything, or explore Music and Videos. Your adventure begins now!";
  window._ritaGreeting = greeting;
  // Try speaking on load (works on desktop/iOS after previous gesture)
  const trySpeak = () => { if(!muteState) ritaSpeak(greeting); };
  if(window.speechSynthesis.getVoices().length > 0) {
    setTimeout(trySpeak, 800);
  } else {
    window.speechSynthesis.onvoiceschanged = () => setTimeout(trySpeak, 800);
  }
  // Start pulsing level buttons to guide player (only if not already chosen)
  setTimeout(()=>{
    if(!levelChosen){
      document.querySelectorAll('.theme-btn').forEach(b=>b.classList.add('pulse'));
    }
  }, 1500);
});

function toggleMic() {
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('⚠️ Speech not supported'); return; }
  const r=new SR(); r.lang='en-US'; r.interimResults=false;
  r.onresult=(e)=>{ document.getElementById('rita-input').value=e.results[0][0].transcript; setTimeout(()=>askRita(),300); };
  r.onerror=()=>toast('⚠️ Could not hear clearly');
  r.start();
  document.getElementById('mic-btn').style.opacity='0.5';
  ritaSpeak("Brilliant! Ask away love! Im all ears!");
  toast('🎤 Listening... speak now');
  r.onend=()=>document.getElementById('mic-btn').style.opacity='1';
}

const RITA_SYSTEM = `You are Lovely Rita, the charming British hostess of Ask Lovely Rita Adventures — the world's first interactive music-powered learning platform. You speak warm British English, always ending phrases with "love" occasionally. You are knowledgeable about the platform and answer questions about it clearly and enthusiastically.

KEY PLATFORM FACTS:
- Ask Lovely Rita Adventures teaches music history, geography, science and world culture through games, collectibles and a virtual economy
- Currency: Educational BeatCoins (EBCs) — players invest EBCs, never "spend" them
- Players start with 10,000 bonus EBCs as a welcome gift — these are protected and cannot be used in the Beat Shop
- To invest in the Beat Shop, players must EARN EBCs by playing games. They can invest up to 50% of what they earned in that session
- Three levels: Youngsters (ages 6-12), Grown Ups (ages 13-17), Experts (18+)
- Four companion characters called The Lads: Smart, Cute, Quiet and Funny — each with unique personalities
- Five adventure worlds: Octopus's Garden (ocean), Across the Universe (space), The Inner Light (India), Penny Lane (city), and Rita's World
- MyBank: players track their portfolio — EBCs available, session earnings, collection value, and total portfolio worth. Items can go up or down in value on the simulated market
- Beat Shop: exclusive collectibles including Rita Posters, VW Beetles, World Badges, Lad Posters, and Sticker Sheets. Buy, hold, sell for profit or exchange with 20% restocking fee
- After visiting all 5 worlds, players unlock the ability to choose their favourite Lad directly
- Rita never says "I don't know" — always answer helpfully and connect to the platform when possible
- Keep answers concise (2-4 sentences max), warm, and educational`;

async function askRita() {
  const q = document.getElementById('rita-input').value.trim();
  if(!q) return;
  updateRitaDisplay("♪ Let me think about that love...");
  ritaSpeak("Let me think about that love!");
  toast('♪ Rita is thinking...');
  try {
    const resp = await fetch("https://empty-leaf-6e4b.alexmonteironeto.workers.dev/", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ question: q, system: RITA_SYSTEM })
    });
    const data = await resp.json();
    updateRitaDisplay("♪ " + data.answer);
    ritaSpeak(data.answer);
    document.getElementById('rita-input').value = '';
  } catch(err) {
    const ans = "I am having a little trouble connecting love! Please try again in a moment.";
    updateRitaDisplay("♪ " + ans);
    document.getElementById('rita-input').value = '';
    setTimeout(()=>ritaSpeak(ans), 400);
  }
}

function goVideo() { toast('🎬 Video content coming soon love!'); }
function goMusic(){ window.location.href='page_music.html'; }
function goVideo(){ window.location.href='page_videos.html'; }
function goHome() {
  document.getElementById('phone-scroll').scrollTop=0;
  toast('🏠 Home!');
}
function goNext() {
  const lad = chosenLad || 'smart';
  const msg = "Off we go love! Let the adventure begin!";
  ritaSpeak(msg); updateRitaDisplay("♪ " + msg);
  setTimeout(()=>{ window.location.href='https://alexmonteiro65.github.io/ask-lovely-rita/src/page5_worlds.html?level='+activeLevel+'&lad='+lad; }, 800);
}
function toggleMute() {
  muteState=!muteState;
  localStorage.setItem('askLovelyRitaV4_mute', muteState?'1':'0');
  document.getElementById('sound-icon').textContent=muteState?'🔇':'🔊';
  if(muteState) {
    updateRitaDisplay("♪ Going quietly love! I will be here when you are ready!");
    setTimeout(()=>window.speechSynthesis&&window.speechSynthesis.cancel(), 100);
    toast('🔇 Going quietly...');
  } else {
    const msg="Hello love! I am back! Let us make some music magic!";
    setTimeout(()=>{ ritaSpeak(msg); updateRitaDisplay("♪ "+msg); }, 200);
    toast('🔊 Sound on!');
  }
}

const PLAYLIST = [
  BASE+'Beatles%20Rap%20-%20Part%201.mp3',
  BASE+'Beatles%20Rap%20-%20Part%202.mp3',
  BASE+'Beatles%20Rap%201.mp3',
  BASE+'Beatles%20Rap%201%20part%20B.mp3'
];
let audio=null, currentTrack=-1;

function togglePlaylist() {
  playlistOpen=!playlistOpen;
  document.getElementById('pl-arrow').textContent=playlistOpen?'▼':'▶';
  document.getElementById('playlist-dropdown').classList.toggle('open', playlistOpen);
}
function playTrack(i) {
  if(audio){ audio.pause(); audio.currentTime=0; }
  for(let j=0;j<4;j++){
    const el=document.getElementById('icon-'+j);
    if(el) el.textContent='▶';
    document.querySelectorAll('.pl-track')[j]?.classList.remove('playing');
  }
  if(currentTrack===i){ currentTrack=-1; audio=null; return; }
  currentTrack=i;
  audio=new Audio(PLAYLIST[i]); audio.volume=0.7;
  audio.onended=()=>{ document.getElementById('icon-'+i).textContent='▶'; document.querySelectorAll('.pl-track')[i]?.classList.remove('playing'); currentTrack=-1; };
  audio.play().catch(()=>toast('⚠️ Tap again to play'));
  document.getElementById('icon-'+i).textContent='⏸';
  document.querySelectorAll('.pl-track')[i]?.classList.add('playing');
}

function setDevice(w,h,name) {
  document.getElementById('phone').style.width=w+'px';
  document.getElementById('phone').style.height=h+'px';
  document.getElementById('size-label').textContent=name+' · '+w+' × '+h+' px';
  document.querySelectorAll('.dev-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}

function goHowToPlay() {
  const msg = "Of course love! Let me show you how to play!";
  ritaSpeak(msg); updateRitaDisplay("♪ " + msg);
  setTimeout(()=>{ window.location.href='how_to_play.html'; }, 800);
}

function loadLadScores() {
  const lads = ['smart','cute','quiet','funny'];
  // Total = exact sum of all 4 Lads
  let total = 0;
  lads.forEach(l => {
    const val = Number(localStorage.getItem('askLovelyRitaV4_bc_'+l)||0);
    document.getElementById('score-'+l).textContent = val.toLocaleString();
    total += val;
  });
  // Educational BeatCoins Total = sum of Lads (guaranteed match)
  document.getElementById('bc-display').textContent = total.toLocaleString();
  // Also sync the central BC key to match
  localStorage.setItem('askLovelyRitaV4_bc', total);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadLadScores();
});
window.addEventListener('pageshow', () => loadLadScores());
window.addEventListener('focus', () => loadLadScores());

function toast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.opacity='0',3000);
}

// ── AUDIO UNLOCK + SPIN — triggered by PLAY button ──────────
let audioUnlocked = false;

function unlockAudio(){
  if(audioUnlocked) return;
  try {
    const ctx = new(window.AudioContext||window.webkitAudioContext)();
    const buf = ctx.createBuffer(1,1,22050);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
    audioUnlocked = true;
  } catch(e){}
}

function unlockAndSpin(){
  unlockAudio();
  // Also unlock speechSynthesis on Android with a silent utterance first
  try {
    const u = new SpeechSynthesisUtterance('');
    window.speechSynthesis.speak(u);
  } catch(e){}
  spinLads();
  // Speak Rita greeting after gesture unlock
  setTimeout(()=>{
    if(!muteState && window._ritaGreeting) ritaSpeak(window._ritaGreeting);
  }, 1200);
}

</script>
