<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovely Rita Adventures — World Beats</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#3d1a00; display:flex; flex-direction:column; align-items:center; min-height:100vh; font-family:Georgia,serif; }

#phone {
  background:linear-gradient(180deg,#3d1a00,#1a0800); width:393px; min-height:852px;
  border-radius:48px; position:relative; overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 0 0 10px #1a1a1a,0 0 0 12px #333,0 30px 80px rgba(0,0,0,0.8); margin:20px 0 40px;
}
#phone::before { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:34px; background:#0a0a0a; border-radius:0 0 20px 20px; z-index:100; }

/* THEMES */
:root { --accent:#ff6b35; --accent2:#c8a96e; --glow:#ff6b35; --btn-grad:linear-gradient(135deg,#ff6b35,#c8a96e); }
.theme-youngsters { --accent:#ff6ef7; --accent2:#ffde59; --glow:#ff6ef7; --btn-grad:linear-gradient(135deg,#ff6ef7,#a855f7); }
.theme-grownups   { --accent:#ffde59; --accent2:#fff3a0; --glow:#ffde59; --btn-grad:linear-gradient(135deg,#ffde59,#c8860a); }
.theme-experts    { --accent:#c8a96e; --accent2:#e8d5b0; --glow:#c8a96e; --btn-grad:linear-gradient(135deg,#c8a96e,#6677aa); }

/* PETALS */
.petal { position:absolute; font-size:16px; animation:petalfall var(--pf,3s) ease-in infinite; opacity:0.6; pointer-events:none; z-index:0; }
@keyframes petalfall { 0%{transform:translateY(-20px) rotate(0deg);opacity:.8;} 100%{transform:translateY(900px) rotate(360deg);opacity:0;} }

#phone-scroll { flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; padding-top:44px; padding-bottom:70px; position:relative; z-index:1; }
#phone-scroll::-webkit-scrollbar { display:none; }

/* TOP BAR */
#top-bar { display:flex; align-items:center; gap:8px; padding:8px 14px; background:rgba(0,0,0,0.4); border-bottom:1px solid rgba(255,255,255,0.08); }
.stat-card { flex:1; background:rgba(255,255,255,0.06); border-radius:8px; padding:5px 8px; text-align:center; }
.stat-label { font-size:8px; color:rgba(255,255,255,0.5); letter-spacing:1px; }
.stat-val { font-size:15px; font-weight:bold; color:var(--accent); }
#bc-val { color:#ffde59; }

/* LEVEL TABS */
#level-tabs { display:flex; gap:5px; padding:8px 12px; }
#level-tabs button {
  flex:1; padding:6px 4px; border:1px solid rgba(255,255,255,0.15);
  border-radius:8px; background:rgba(255,255,255,0.05);
  color:rgba(255,255,255,0.5); font-size:9px; cursor:pointer;
  font-family:Georgia,serif; transition:all 0.2s;
}
#level-tabs button.active { background:var(--btn-grad); color:#000; border-color:transparent; font-weight:bold; }

/* LAD ROW */
#lad-rita-row { display:flex; align-items:center; gap:10px; padding:8px 14px; background:rgba(0,0,0,0.3); border-bottom:1px solid rgba(255,255,255,0.06); }
#lad-img { width:52px; height:52px; object-fit:contain; filter:drop-shadow(0 0 8px var(--glow)); }
#rita-text { flex:1; font-size:11px; color:#ddd; line-height:1.5; font-style:italic; }

/* INSTRUMENT CARD */
#game-area { padding:12px 14px; display:flex; flex-direction:column; gap:12px; }

#progress-bar { height:3px; background:rgba(255,255,255,0.1); border-radius:2px; margin:0 14px 4px; }
#progress-fill { height:100%; background:var(--btn-grad); border-radius:2px; transition:width 0.4s; }

#q-counter { text-align:center; font-size:9px; color:rgba(255,255,255,0.4); letter-spacing:1px; }

/* SOUND BUTTON (Grown Ups/Experts) */
#sound-btn-wrap { display:none; justify-content:center; margin-bottom:4px; }
#sound-btn {
  width:60px; height:60px; border-radius:50%;
  background:rgba(0,0,0,0.6); border:2px solid var(--accent);
  color:var(--accent); font-size:28px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 20px var(--glow); transition:transform 0.15s;
}
#sound-btn:hover { transform:scale(1.1); }
.sound-waves { display:flex; gap:3px; align-items:center; position:absolute; }

/* INSTRUMENT IMAGE */
#instrument-card {
  background:linear-gradient(135deg,rgba(255,165,0,0.15),rgba(200,130,0,0.1));
  border:2px solid rgba(255,165,0,0.4); border-radius:16px;
  padding:14px; display:flex; align-items:center; justify-content:center;
  min-height:200px;
}
#instrument-img { max-width:100%; max-height:180px; object-fit:contain; filter:drop-shadow(0 0 16px rgba(255,165,0,0.5)); }
#instrument-name-exp { display:none; text-align:center; margin-top:8px; }
#instrument-name-input {
  width:100%; background:rgba(255,255,255,0.07); border:1px solid var(--accent);
  border-radius:10px; padding:8px 12px; color:#fff; font-size:13px;
  outline:none; font-family:Georgia,serif; text-align:center;
}

/* FLAGS / OPTIONS */
#flags-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.flag-btn {
  background:rgba(255,255,255,0.06); border:2px solid rgba(255,255,255,0.15);
  border-radius:12px; padding:10px 8px; cursor:pointer; transition:all 0.2s;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.flag-btn:hover:not(:disabled) { border-color:var(--accent); transform:scale(1.03); }
.flag-btn:disabled { cursor:default; }
.flag-btn.correct { border-color:#4ade80; background:rgba(74,222,128,0.15); }
.flag-btn.wrong   { border-color:#f87171; background:rgba(248,113,113,0.1); }

.flag-emoji { font-size:36px; }
.flag-label { font-size:11px; color:#ddd; font-weight:bold; }

/* RESULT PANEL */
#result-panel {
  display:none; flex-direction:column; align-items:center;
  background:rgba(0,0,0,0.8); border:2px solid var(--accent);
  border-radius:16px; padding:14px; gap:8px; text-align:center;
}
#result-panel.show { display:flex; }
#result-icon { font-size:36px; }
#result-title { font-size:14px; font-weight:bold; color:#fff; }
#result-fact { font-size:11px; color:rgba(255,255,255,0.7); line-height:1.5; font-style:italic; }
#result-pts { font-size:14px; font-weight:bold; }
#result-correct-img { display:none; width:80px; height:80px; object-fit:contain; margin:4px auto; }

#bonus-area { display:none; margin-top:10px; text-align:center; width:100%; }
#bonus-area .bonus-title { font-size:13px; font-weight:bold; color:#ffde59; margin-bottom:4px; }
#bonus-countdown { font-size:11px; color:rgba(255,255,255,0.6); margin-bottom:8px; }
#bonus-btn-wb {
  background:linear-gradient(135deg,#c8a96e,#6677aa); border:none; border-radius:20px;
  padding:10px 20px; color:#000; font-weight:bold; font-size:12px;
  cursor:pointer; font-family:Georgia,serif; width:100%;
}

#start-btn, #next-btn {
  background:var(--btn-grad); border:none; border-radius:20px;
  padding:12px; color:#000; font-weight:bold; font-size:13px;
  cursor:pointer; font-family:Georgia,serif; width:100%;
  box-shadow:0 0 16px var(--glow);
}
#next-btn { display:none; background:linear-gradient(135deg,#4ade80,#16a34a); }

/* CELEBRATE */
#celebrate { position:absolute; inset:0; pointer-events:none; z-index:25; overflow:hidden; border-radius:40px; }
.cp { position:absolute; width:8px; height:8px; border-radius:50%; animation:conffall 1.4s ease-in forwards; }
@keyframes conffall { 0%{opacity:1;transform:translateY(-20px) rotate(0deg);} 100%{opacity:0;transform:translateY(900px) rotate(720deg);} }

/* NAV */
#nav-bar { flex-shrink:0; display:flex; align-items:center; justify-content:space-around; padding:10px 0 14px; border-top:1px solid rgba(255,255,255,.06); background:rgba(0,0,0,.4); position:relative; z-index:10; }
.nav-btn { display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:rgba(255,255,255,.4); cursor:pointer; padding:4px 14px; font-size:9px; font-family:Georgia,serif; transition:color 0.2s; }
.nav-btn:hover { color:var(--accent); }
.nav-btn.nav-home { color:var(--accent); }
.nav-icon { font-size:20px; }

#toast { position:absolute; top:54px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.9); color:#fff; font-size:11px; padding:6px 16px; border-radius:20px; z-index:300; opacity:0; transition:opacity 0.3s; white-space:nowrap; border:1px solid var(--accent); pointer-events:none; }
#toast.show { opacity:1; }
</style>
</head>
<body>
<div id="phone" class="theme-youngsters">
  <!-- PETALS -->
  <div class="petal" style="left:8%;--pf:3.2s;animation-delay:0s">🌸</div>
  <div class="petal" style="left:25%;--pf:4.1s;animation-delay:0.8s">🌺</div>
  <div class="petal" style="left:55%;--pf:2.8s;animation-delay:1.5s">🌸</div>
  <div class="petal" style="left:78%;--pf:3.7s;animation-delay:0.3s">🌼</div>
  <div class="petal" style="left:42%;--pf:5s;animation-delay:2s">🌸</div>
  <div id="celebrate"></div>

  <div id="phone-scroll">
    <div id="top-bar">
      <div class="stat-card"><div class="stat-label">BeatCoins</div><div class="stat-val" id="bc-val">25,000</div></div>
      <div class="stat-card"><div class="stat-label">Score</div><div class="stat-val" id="score-val">0</div></div>
      <div class="stat-card"><div class="stat-label">Question</div><div class="stat-val" id="q-val" style="color:#7bc67e">0/8</div></div>
    </div>

    <div id="level-tabs">
      <button onclick="setLevel('youngsters')" id="tab-y">🟣 Youngsters</button>
      <button onclick="setLevel('grownups')" id="tab-g">🟡 Grown Ups</button>
      <button onclick="setLevel('experts')" id="tab-e">⭐ Experts</button>
    </div>

    <div id="lad-rita-row">
      <img id="lad-img" src="https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/Quite_Peaceful_Lad.png" alt="Quiet Lad" onerror="this.style.display='none'">
      <span id="rita-text">Hello love! Welcome to World Beats! The Quiet Lad will take you on a journey through world music. See the instrument and choose which country it comes from!</span>
    </div>

    <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
    <div id="q-counter" style="margin:4px 14px;">Question 0 of 8</div>

    <div id="game-area">
      <!-- Sound button (Grown Ups / Experts) -->
      <div id="sound-btn-wrap">
        <button id="sound-btn" onclick="playInstrumentSound()">🔊</button>
      </div>

      <div id="instrument-card">
        <img id="instrument-img" src="https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/world_beats_question.png" alt="Instrument">
      </div>

      <!-- Expert: type instrument name -->
      <div id="instrument-name-exp">
        <input id="instrument-name-input" type="text" placeholder="Type the instrument name..." autocomplete="off">
      </div>

      <div id="flags-grid"></div>

      <div id="result-panel">
        <div id="result-icon">🪷</div>
        <div id="result-title"></div>
        <img id="result-correct-img" src="" alt="">
        <div id="result-fact"></div>
        <div id="result-pts"></div>
        <div id="bonus-area">
          <div class="bonus-title">🎮 BONUS GAME UNLOCKED!</div>
          <div id="bonus-countdown"></div>
          <button id="bonus-btn-wb" onclick="goToBonusGame()">🎵 Play The Turntable!</button>
        </div>
      </div>

      <button id="start-btn" onclick="startGame()">🪷 Begin World Beats!</button>
      <button id="next-btn" onclick="nextQuestion()">▶ Next Instrument</button>
    </div>
  </div>

  <nav id="nav-bar">
    <button class="nav-btn" onclick="goBack()"><span class="nav-icon">◀️</span><span>Back</span></button>
    <button class="nav-btn nav-home" onclick="goHome()"><span class="nav-icon">🏠</span><span>Home</span></button>
    <button class="nav-btn" onclick="goForward()"><span class="nav-icon">▶️</span><span>Next</span></button>
  </nav>
</div>
<div id="toast"></div>

<script>
const BASE = 'https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/';

// ── DATA ──────────────────────────────────────────────────
const INSTRUMENTS = [
  {
    name:'Sitar', country:'India', flag:'🇮🇳',
    img: BASE+'world_beats_question.png',
    correctImg: BASE+'world_beats_correct.png',
    opts:[{flag:'🇮🇳',label:'India'},{flag:'🇯🇵',label:'Japan'},{flag:'🇧🇷',label:'Brazil'},{flag:'🇪🇬',label:'Egypt'}],
    ans:0,
    fact:"The sitar is a plucked string instrument from India with a beautiful resonating sound. It became famous in Western music when the Quiet Lad learned to play it during his spiritual journey to India."
  },
  {
    name:'Koto', country:'Japan', flag:'🇯🇵',
    img: BASE+'world_beats_question.png',
    correctImg: BASE+'world_beats_correct.png',
    opts:[{flag:'🇨🇳',label:'China'},{flag:'🇯🇵',label:'Japan'},{flag:'🇰🇷',label:'Korea'},{flag:'🇻🇳',label:'Vietnam'}],
    ans:1,
    fact:"The koto is Japan's national instrument — a long zither with 13 strings played with picks on the fingers. Its delicate sound has been heard in Japanese music for over 1,300 years."
  },
  {
    name:'Djembe', country:'West Africa', flag:'🥁',
    img: BASE+'world_beats_question.png',
    correctImg: BASE+'world_beats_correct.png',
    opts:[{flag:'🇸🇳',label:'West Africa'},{flag:'🇧🇷',label:'Brazil'},{flag:'🇨🇺',label:'Cuba'},{flag:'🇯🇲',label:'Jamaica'}],
    ans:0,
    fact:"The djembe is a rope-tuned skin-covered drum from West Africa. Its name means 'everyone gather together in peace' and it has been played for centuries in ceremonies and celebrations."
  },
  {
    name:'Bouzouki', country:'Greece', flag:'🇬🇷',
    img: BASE+'world_beats_question.png',
    correctImg: BASE+'world_beats_correct.png',
    opts:[{flag:'🇹🇷',label:'Turkey'},{flag:'🇮🇹',label:'Italy'},{flag:'🇬🇷',label:'Greece'},{flag:'🇮🇪',label:'Ireland'}],
    ans:2,
    fact:"The bouzouki is a long-necked string instrument central to Greek music. Its bright, ringing sound defines traditional Greek folk music and was even adopted into Irish music in the 1960s!"
  },
  {
    name:'Sitar', country:'India', flag:'🇮🇳',
    img: BASE+'world_beats_question.png',
    correctImg: BASE+'world_beats_correct.png',
    opts:[{flag:'🇮🇳',label:'India'},{flag:'🇵🇰',label:'Pakistan'},{flag:'🇳🇵',label:'Nepal'},{flag:'🇧🇩',label:'Bangladesh'}],
    ans:0,
    fact:"The sitar has 18-21 strings and a gourd resonator. The Quiet Lad brought its mesmerising sound to millions of Western ears, blending Eastern spirituality with modern music forever."
  },
  {
    name:'Charango', country:'Bolivia/Peru', flag:'🇧🇴',
    img: BASE+'world_beats_question.png',
    correctImg: BASE+'world_beats_correct.png',
    opts:[{flag:'🇲🇽',label:'Mexico'},{flag:'🇦🇷',label:'Argentina'},{flag:'🇧🇴',label:'Bolivia'},{flag:'🇨🇴',label:'Colombia'}],
    ans:2,
    fact:"The charango is a small Andean lute from Bolivia and Peru, traditionally made from an armadillo shell. It has 10 strings arranged in 5 pairs and produces a bright, joyful sound."
  },
  {
    name:'Oud', country:'Middle East', flag:'🎸',
    img: BASE+'world_beats_question.png',
    correctImg: BASE+'world_beats_correct.png',
    opts:[{flag:'🇸🇦',label:'Middle East'},{flag:'🇮🇷',label:'Iran'},{flag:'🇬🇷',label:'Greece'},{flag:'🇮🇳',label:'India'}],
    ans:0,
    fact:"The oud is one of the oldest instruments in the world — ancestor of the European lute. It has no frets, allowing players to slide between notes and create the distinctive sound of Arabic music."
  },
  {
    name:'Didgeridoo', country:'Australia', flag:'🇦🇺',
    img: BASE+'world_beats_question.png',
    correctImg: BASE+'world_beats_correct.png',
    opts:[{flag:'🇳🇿',label:'New Zealand'},{flag:'🇦🇺',label:'Australia'},{flag:'🇵🇬',label:'Papua New Guinea'},{flag:'🇫🇯',label:'Fiji'}],
    ans:1,
    fact:"The didgeridoo is the world's oldest wind instrument, developed by Aboriginal Australians over 40,000 years ago. Players use circular breathing to produce its continuous, droning sound without stopping."
  }
];

const RITA_INTRO = {
  youngsters: "Hello love! Welcome to World Beats! The Quiet Lad will show you wonderful instruments from around the world. Look at the picture and choose which country it comes from. No worries if you get one wrong darling — I will teach you!",
  grownups: "Hello there! World Beats for Grown Ups! Listen to the description and choose the correct country. Each instrument has a fascinating story darling!",
  experts: "Right then! Expert musicologists only! You will need to name the instrument AND choose its country of origin. The Quiet Lad says only true music scholars will ace this love!"
};
const RITA_CORRECT=["Magnificent love! You know your world music!","The Quiet Lad is impressed darling!","Peaceful and correct love! Beautiful!","Brilliant knowledge darling!"];
const RITA_WRONG=["Not quite love — but now you know!","Close darling! Here is the story behind this instrument...","Good try love! Let me share a musical fact..."];
const RITA_COMPLETE=["Wonderful love! You travelled the world through music! The Quiet Lad bows to you!","Magnificent darling! Eight instruments from eight corners of the world! You are a true world music scholar!","Peaceful and brilliant love! The Inner Light shines through you!"];

const LEVEL_CFG = {
  youngsters:{ bonus:25, bonusAll:100 },
  grownups:  { bonus:40, bonusAll:150 },
  experts:   { bonus:70, bonusAll:250 },
};

let S={ level:'youngsters', beatcoins:25000, score:0, qIndex:0, order:[], gameActive:false, answered:false, fromWorld:null };

window.addEventListener('load',()=>{
  const params=new URLSearchParams(window.location.search);
  if(params.get('level')&&['youngsters','grownups','experts'].includes(params.get('level'))) S.level=params.get('level');
  if(params.get('from')) S.fromWorld=params.get('from');
  S.beatcoins=Number(localStorage.getItem('askLovelyRitaV4_bc')||25000);
  document.getElementById('bc-val').textContent=S.beatcoins.toLocaleString();
  setLevel(S.level);
  const doSpeak=()=>speak(RITA_INTRO[S.level]);
  if(window.speechSynthesis.getVoices().length>0) setTimeout(doSpeak,800);
  else window.speechSynthesis.onvoiceschanged=()=>setTimeout(doSpeak,800);
});

function setLevel(lvl){
  S.level=lvl;
  document.getElementById('phone').className='theme-'+lvl;
  ['y','g','e'].forEach(t=>document.getElementById('tab-'+t).classList.remove('active'));
  const m={youngsters:'y',grownups:'g',experts:'e'};
  document.getElementById('tab-'+m[lvl]).classList.add('active');
  // Show/hide sound button and name input
  document.getElementById('sound-btn-wrap').style.display=lvl==='youngsters'?'none':'flex';
  document.getElementById('instrument-name-exp').style.display=lvl==='experts'?'block':'none';
  localStorage.setItem('askLovelyRitaV4_level',lvl);
  if(S.gameActive) resetGame();
  speak(RITA_INTRO[lvl]);
  setRitaText(RITA_INTRO[lvl]);
}

function startGame(){
  S.gameActive=true; S.qIndex=0; S.score=0;
  S.order=[...Array(INSTRUMENTS.length).keys()].sort(()=>Math.random()-0.5);
  document.getElementById('start-btn').style.display='none';
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('bonus-area').style.display='none';
  loadQuestion();
}

function loadQuestion(){
  if(S.qIndex>=8){ finishGame(); return; }
  S.answered=false;
  const instr=INSTRUMENTS[S.order[S.qIndex]];
  const lvl=S.level;

  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('next-btn').style.display='none';
  document.getElementById('q-counter').textContent=`Question ${S.qIndex+1} of 8`;
  document.getElementById('q-val').textContent=`${S.qIndex}/8`;
  document.getElementById('progress-fill').style.width=`${(S.qIndex/8)*100}%`;

  // Show instrument image (always for youngsters, after answer for others)
  const imgEl=document.getElementById('instrument-img');
  if(lvl==='youngsters'){
    imgEl.src=instr.img; imgEl.style.opacity='1';
  } else {
    imgEl.src=BASE+'world_beats_question.png'; imgEl.style.opacity='0.3';
  }

  // Sound btn
  document.getElementById('sound-btn-wrap').style.display=lvl==='youngsters'?'none':'flex';

  // Expert: show name input
  const nameExp=document.getElementById('instrument-name-exp');
  nameExp.style.display=lvl==='experts'?'block':'none';
  if(lvl==='experts') document.getElementById('instrument-name-input').value='';

  // Build flag grid
  const grid=document.getElementById('flags-grid');
  grid.innerHTML='';
  instr.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='flag-btn';
    btn.innerHTML=`<div class="flag-emoji">${opt.flag}</div><div class="flag-label">${opt.label}</div>`;
    btn.onclick=()=>answer(i,instr);
    grid.appendChild(btn);
  });

  // Rita speaks instrument hint for grown ups
  if(lvl==='grownups'){
    const hint=`This instrument comes from a country with a rich musical tradition. Listen to the name: ${instr.name}. Now choose the correct country love!`;
    setTimeout(()=>speak(hint),400);
    setRitaText(hint);
  } else if(lvl==='youngsters'){
    const hint=`Look at this beautiful instrument love! It is called a ${instr.name}. Can you guess which country it comes from?`;
    setTimeout(()=>speak(hint),400);
    setRitaText(hint);
  } else {
    const hint=`A challenge for experts! Name this instrument and choose its country of origin. Type your answer and then tap the flag!`;
    setTimeout(()=>speak(hint),400);
    setRitaText(hint);
  }
}

function playInstrumentSound(){
  // Synthesise a simple tone to suggest the instrument
  try {
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='triangle';
    o.frequency.setValueAtTime(220,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(440,ctx.currentTime+0.5);
    g.gain.setValueAtTime(0.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1.5);
    o.start(ctx.currentTime); o.stop(ctx.currentTime+1.5);
    document.getElementById('sound-btn').textContent='🎵';
    setTimeout(()=>document.getElementById('sound-btn').textContent='🔊',1600);
  } catch(e){}
}

function answer(chosen,instr){
  if(S.answered) return;
  S.answered=true;
  const correct=chosen===instr.ans;
  const btns=document.querySelectorAll('.flag-btn');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===instr.ans) b.classList.add('correct');
    else if(i===chosen&&!correct) b.classList.add('wrong');
  });

  // Reveal instrument image for grown ups/experts
  if(S.level!=='youngsters'){
    document.getElementById('instrument-img').src=instr.img;
    document.getElementById('instrument-img').style.opacity='1';
    setTimeout(()=>{
      document.getElementById('instrument-img').style.opacity='0.3';
    },3500);
  }

  const earned=correct?LEVEL_CFG[S.level].bonus:0;
  if(correct){ S.beatcoins+=earned; S.score+=earned; saveBC(); celebrate(); }

  const rp=document.getElementById('result-panel');
  document.getElementById('result-icon').textContent=correct?'✅':'🪷';
  document.getElementById('result-title').textContent=correct?pick(RITA_CORRECT):pick(RITA_WRONG);
  document.getElementById('result-fact').textContent=instr.fact;
  document.getElementById('result-pts').textContent=correct?`+${earned} BeatCoins!`:'+0 BeatCoins';
  document.getElementById('result-pts').style.color=correct?'#ffde59':'rgba(255,255,255,0.4)';

  const ri=document.getElementById('result-correct-img');
  if(correct){ ri.src=instr.correctImg; ri.style.display='block'; setTimeout(()=>ri.style.display='none',3000); }
  else ri.style.display='none';

  rp.classList.add('show');
  speak((correct?pick(RITA_CORRECT)+' ':pick(RITA_WRONG)+' ')+instr.fact);
  setRitaText(instr.fact);
  document.getElementById('bc-val').textContent=S.beatcoins.toLocaleString();
  document.getElementById('score-val').textContent=S.score;
  S.qIndex++;
  setTimeout(()=>{
    if(S.qIndex>=8) setTimeout(finishGame,800);
    else document.getElementById('next-btn').style.display='block';
  },1200);
}

function nextQuestion(){ document.getElementById('next-btn').style.display='none'; loadQuestion(); }

function finishGame(){
  S.gameActive=false;
  const bonus=LEVEL_CFG[S.level].bonusAll;
  S.beatcoins+=bonus; S.score+=bonus; saveBC();
  document.getElementById('bc-val').textContent=S.beatcoins.toLocaleString();
  document.getElementById('score-val').textContent=S.score;
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('q-val').textContent='8/8';
  const rp=document.getElementById('result-panel');
  document.getElementById('result-icon').textContent='🏆';
  document.getElementById('result-title').textContent='World Music Master!';
  document.getElementById('result-fact').textContent='You discovered instruments from across the globe! The Quiet Lad bows in respect!';
  document.getElementById('result-pts').textContent=`+${bonus} Bonus BeatCoins!`;
  document.getElementById('result-pts').style.color='#ffde59';
  document.getElementById('result-correct-img').style.display='none';
  rp.classList.add('show');
  document.getElementById('next-btn').style.display='none';
  document.getElementById('start-btn').textContent='🔄 Play Again!';
  document.getElementById('start-btn').style.display='block';
  document.getElementById('start-btn').onclick=()=>{ resetGame(); startGame(); };
  celebrate(); speak(pick(RITA_COMPLETE));
  setTimeout(showBonusGame,2000);
}

function showBonusGame(){
  const area=document.getElementById('bonus-area');
  if(!area) return;
  area.style.display='block';
  const msgs={
    youngsters:"Wonderful love! The Turntable bonus game is yours! Going there in 5 seconds!",
    grownups:"Magnificent darling! The Turntable awaits! Off we go in 5 seconds!",
    experts:"Outstanding love! The Turntable bonus is unlocked! Going in 5 seconds!"
  };
  speak(msgs[S.level]);
  let count=5;
  const cd=document.getElementById('bonus-countdown');
  if(cd) cd.textContent='Going there in '+count+' seconds...';
  const iv=setInterval(()=>{
    count--;
    if(cd) cd.textContent=count>0?'Going there in '+count+' seconds...':'Off we go!';
    if(count<=0){ clearInterval(iv); goToBonusGame(); }
  },1000);
}
function goToBonusGame(){ window.location.href='page3_turntable.html?level='+S.level+'&from=india'; }

function resetGame(){
  S.gameActive=false; S.qIndex=0; S.score=0; S.answered=false;
  document.getElementById('flags-grid').innerHTML='';
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('bonus-area').style.display='none';
  document.getElementById('result-correct-img').style.display='none';
  document.getElementById('instrument-img').src=BASE+'world_beats_question.png';
  document.getElementById('instrument-img').style.opacity='1';
  document.getElementById('q-counter').textContent='Question 0 of 8';
  document.getElementById('q-val').textContent='0/8';
  document.getElementById('score-val').textContent='0';
  document.getElementById('progress-fill').style.width='0%';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('start-btn').textContent='🪷 Begin World Beats!';
  document.getElementById('start-btn').onclick=startGame;
  document.getElementById('start-btn').style.display='block';
}

function saveBC(){ localStorage.setItem('askLovelyRitaV4_bc',S.beatcoins); }

function celebrate(){
  const layer=document.getElementById('celebrate'); layer.innerHTML='';
  const cols=['#ff6b35','#c8a96e','#ffde59','#ff9ef9','#fff','#ffd700'];
  for(let i=0;i<40;i++){
    const el=document.createElement('div'); el.className='cp';
    el.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*20}%;background:${cols[Math.floor(Math.random()*cols.length)]};animation-delay:${Math.random()*.7}s;animation-duration:${1.2+Math.random()*.9}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'};`;
    layer.appendChild(el);
  }
  setTimeout(()=>layer.innerHTML='',2500);
}

function speak(text){
  if(localStorage.getItem('askLovelyRitaV4_mute')==='1') return;
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=0.9; u.pitch=1.1;
  const voices=window.speechSynthesis.getVoices();
  const v=voices.find(v=>v.lang==='en-GB'&&/female|woman/i.test(v.name))||voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'));
  if(v) u.voice=v;
  window.speechSynthesis.speak(u);
}

function setRitaText(t){ document.getElementById('rita-text').textContent=t; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function toast(msg){ const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000); }


// Save BeatCoins per chosen Lad for global scoreboard
function saveLadBC(amount) {
  try {
    const lad = localStorage.getItem('askLovelyRitaV4_chosen_lad') || 'smart';
    const key = 'askLovelyRitaV4_bc_' + lad;
    const current = Number(localStorage.getItem(key) || 0);
    localStorage.setItem(key, current + amount);
  } catch(e) {}
}

function goBack(){
  if(S.fromWorld==='india') { window.location.href='page8_india.html'; return; }
  window.location.href='page5_worlds.html';
}
function goHome()    { window.location.href='page1_landing.html'; }
function goForward() { window.location.href='page9_city.html'; }
</script>
