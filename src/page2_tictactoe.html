<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Lovely Rita - Beat the Beetles!</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; display:flex; flex-direction:column; align-items:center; min-height:100vh; font-family:Georgia,serif; }
:root { --bg:#1a0040; --accent:#ff6ef7; --accent2:#ffde59; --btn-grad:linear-gradient(135deg,#ff6ef7,#a855f7); --glow:#ff6ef7; --mx:#ff6ef7; --mo:#ffde59; }
.theme-grownups { --bg:#0d0d1e; --accent:#c8a96e; --accent2:#e8d5b0; --btn-grad:linear-gradient(135deg,#c8a96e,#6677aa); --glow:#c8a96e; --mx:#c8a96e; --mo:#e8d5b0; }
.theme-experts { --bg:#050510; --accent:#ffd700; --accent2:#ffd700; --btn-grad:linear-gradient(135deg,#ffd700,#c8860a); --glow:#ffd700; --mx:#ffd700; --mo:#fff; }
#phone { background:var(--bg); width:393px; min-height:852px; border-radius:48px; box-shadow:0 0 0 10px #1a1a1a,0 0 0 12px #333,0 30px 80px rgba(0,0,0,0.8); position:relative; overflow:hidden; display:flex; flex-direction:column; transition:background 0.5s; margin:20px 0 40px; }
#phone::before { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:34px; background:#0a0a0a; border-radius:0 0 20px 20px; z-index:100; }
#phone-scroll { overflow-y:auto; flex:1; scrollbar-width:none; padding-bottom:70px; }
#phone-scroll::-webkit-scrollbar { display:none; }
#top-bar { display:flex; align-items:center; justify-content:space-between; padding:44px 16px 12px; background:var(--bg); position:sticky; top:0; z-index:50; transition:background 0.5s; border-bottom:1px solid rgba(255,255,255,0.08); }
#back-btn { background:rgba(255,255,255,0.08); border:1px solid var(--accent); color:var(--accent); font-size:0.65rem; padding:6px 12px; border-radius:20px; cursor:pointer; letter-spacing:1px; }
#page-title { font-size:1rem; color:#fff; font-weight:bold; text-align:center; }
#page-subtitle { font-size:0.55rem; color:var(--accent2); letter-spacing:2px; text-align:center; text-transform:uppercase; }

/* LAD SELECTION SCREEN */
#lad-select-screen { padding:16px; }
#lad-select-title { text-align:center; font-size:0.9rem; color:#fff; margin-bottom:6px; }
#lad-select-sub { text-align:center; font-size:1.05rem; color:#ff6ef7; font-style:italic; margin-bottom:10px; font-weight:700; text-shadow:0 0 10px #ff6ef7; }
#lad-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 12px; }
.lad-card { background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.1); border-radius:12px; padding:10px 8px; text-align:center; cursor:pointer; transition:all 0.2s; }
.lad-card:hover { border-color:var(--accent); background:rgba(255,255,255,0.1); transform:scale(1.03); box-shadow:0 0 16px var(--glow); }
.lad-card img { width:56px; height:56px; border-radius:50%; object-fit:cover; border:2px solid var(--accent); margin-bottom:6px; }
.lad-card-name { font-size:0.7rem; color:#ffffff !important; font-weight:bold; margin-bottom:2px; }
.lad-card-desc { font-size:0.55rem; color:rgba(255,255,255,0.8) !important; font-style:italic; line-height:1.3; }
#rita-float-p2 { display:none; }
#rita-greeting {
  margin: 10px 12px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--accent);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 10px; color: #ffffff;
  line-height: 1.5;
  font-weight: 400;
  box-shadow: 0 0 12px rgba(255,110,247,.15);
  min-height: 52px;
  display: flex; align-items: center;
}
#rita-greet-img { width:44px; height:44px; flex-shrink:0; filter:drop-shadow(0 0 8px var(--glow)); animation:float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }

/* GAME SCREEN */
#game-screen { display:none; }
#selected-lad-row { display:flex; align-items:center; gap:10px; padding:10px 16px; background:rgba(255,255,255,0.04); border-bottom:1px solid rgba(255,255,255,0.08); }
#selected-lad-img { width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid var(--accent); }
#selected-lad-name { font-size:0.7rem; color:var(--accent); letter-spacing:1px; text-transform:uppercase; }
#selected-lad-vs { font-size:0.65rem; color:rgba(255,255,255,0.4); }
#score-bar { display:flex; justify-content:space-around; align-items:center; padding:10px 20px; margin:8px 16px; background:rgba(255,255,255,0.05); border-radius:12px; border:1px solid rgba(255,255,255,0.1); }
.score-item { text-align:center; }
.score-label { font-size:0.55rem; color:rgba(255,255,255,0.5); letter-spacing:1px; text-transform:uppercase; }
.score-num { font-size:1.4rem; font-weight:bold; }
#score-you { color:var(--mx); }
#score-rita { color:var(--mo); }
#score-draws { color:rgba(255,255,255,0.4); font-size:1rem; }
.score-div { color:rgba(255,255,255,0.2); font-size:1.2rem; }
#game-status { text-align:center; padding:8px 16px; font-size:0.78rem; color:var(--accent2); font-style:italic; min-height:32px; }
#ttt-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:0 16px; margin:4px 0; }
.ttt-cell { aspect-ratio:1; border-radius:12px; overflow:hidden; position:relative; cursor:pointer; border:2px solid rgba(255,255,255,0.1); transition:transform 0.15s,border-color 0.2s; }
.ttt-cell:hover:not(.taken) { transform:scale(1.03); border-color:var(--accent); }
.ttt-cell.taken { cursor:default; }
.ttt-cell img.album-img { width:100%; height:100%; object-fit:cover; display:block; transition:filter 0.3s; }
.ttt-cell.taken img.album-img { filter:brightness(0.35); }
.mark { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2.8rem; font-weight:bold; opacity:0; transition:opacity 0.3s,transform 0.3s; transform:scale(0.5); }
.mark.show { opacity:1; transform:scale(1); }
.mark-x { color:var(--mx); text-shadow:0 0 20px var(--mx); }
.mark-o { color:var(--mo); text-shadow:0 0 20px var(--mo); }
.ttt-cell.winner { border-color:var(--accent2); animation:pulse 0.6s ease infinite alternate; }
@keyframes pulse { from{box-shadow:0 0 8px var(--glow);} to{box-shadow:0 0 24px var(--glow);} }
#rita-comment { margin:8px 16px; padding:10px 14px; background:rgba(255,255,255,0.05); border-radius:12px; border-left:3px solid var(--accent); font-size:0.72rem; color:#fff; line-height:1.5; min-height:52px; display:flex; align-items:center; gap:10px; }
#rita-mini { width:38px; height:38px; flex-shrink:0; filter:drop-shadow(0 0 6px var(--glow)); animation:float 3s ease-in-out infinite; }
#bc-mini { display:flex; justify-content:space-between; align-items:center; margin:6px 16px; padding:8px 14px; background:rgba(255,255,255,0.04); border-radius:10px; border:1px solid rgba(255,255,255,0.08); }
#bc-mini-label { font-size:0.65rem; color:var(--accent); letter-spacing:1px; }
#bc-mini-count { font-size:0.85rem; color:var(--accent2); font-weight:bold; }

#nav-bar { flex-shrink:0; display:flex; align-items:center; justify-content:space-around; padding:10px 20px 14px; border-top:1px solid rgba(255,255,255,.08); background:rgba(0,0,0,.35); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.nav-btn { display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:rgba(255,255,255,.5); cursor:pointer; padding:6px 14px; border-radius:12px; transition:all .2s; font-size:10px; letter-spacing:.3px; }
.nav-btn:hover { background:rgba(255,255,255,.08); color:#fff; } .nav-btn .nav-icon { font-size:20px; line-height:1; } .nav-btn.nav-home .nav-icon { color:var(--accent); } .nav-btn.nav-home { color:var(--accent); }
#toast { position:absolute; top:50px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.9); color:#fff; font-size:0.65rem; padding:7px 16px; border-radius:20px; z-index:300; opacity:0; transition:opacity 0.3s; white-space:nowrap; border:1px solid var(--accent); pointer-events:none; }
#toast.show { opacity:1; }
#result-overlay { display:none; position:absolute; inset:0; z-index:250; background:rgba(0,0,0,0.88); flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; }
#result-overlay.show { display:flex; animation:popIn 0.4s ease; }
@keyframes popIn { from{opacity:0;transform:scale(0.9);} to{opacity:1;transform:scale(1);} }
#result-emoji { font-size:4rem; margin-bottom:12px; }
#result-title { font-size:1.6rem; font-weight:bold; color:#fff; margin-bottom:6px; }
#result-sub { font-size:0.78rem; color:var(--accent2); margin-bottom:8px; font-style:italic; line-height:1.5; max-width:280px; }
#result-bc { font-size:1rem; color:var(--accent); margin-bottom:20px; font-weight:bold; }
.result-buttons { display:flex; flex-direction:column; gap:10px; width:100%; max-width:260px; }
.result-btn { border:none; color:#fff; font-size:0.8rem; font-weight:bold; letter-spacing:1px; padding:14px 32px; border-radius:28px; cursor:pointer; text-transform:uppercase; }
#btn-play-again { background:var(--btn-grad); }
#btn-next-game { background:rgba(255,255,255,0.15); border:1px solid var(--accent); }

  /* Pick Me text — always visible at top of card */
  .pick-me-bubble {
    display: block !important;
    font-size: 0.65rem;
    color: #ffffff !important;
    font-weight: 600;
    text-align: center;
    padding: 4px 2px 8px;
    line-height: 1.3;
  }
