<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovely Rita Adventures — Tic-Tac-Toe</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; display:flex; flex-direction:column; align-items:center; min-height:100vh; font-family:Georgia,serif; }
:root { --bg:#1a0040; --accent:#ff6ef7; --accent2:#ffde59; --btn-grad:linear-gradient(135deg,#ff6ef7,#a855f7); --glow:#ff6ef7; --mx:#ff6ef7; --mo:#ffde59; }
.theme-grownups { --bg:#1a1200; --accent:#ffde59; --accent2:#fff3a0; --btn-grad:linear-gradient(135deg,#c8a96e,#6677aa); --glow:#ffde59; --mx:#ffde59; --mo:#fff3a0; }
.theme-experts { --bg:#0d0d1e; --accent:#c8a96e; --accent2:#e8d5b0; --btn-grad:linear-gradient(135deg,#ffd700,#c8860a); --glow:#c8a96e; --mx:#c8a96e; --mo:#e8d5b0; }

#phone {
  background:var(--bg); width:393px; min-height:852px;
  border-radius:48px;
  box-shadow:0 0 0 10px #1a1a1a,0 0 0 12px #333,0 30px 80px rgba(0,0,0,0.8);
  position:relative; overflow:hidden; display:flex; flex-direction:column;
  transition:background 0.5s; margin:20px 0 40px;
}
#phone::before {
  content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:120px; height:34px; background:#0a0a0a;
  border-radius:0 0 20px 20px; z-index:100;
}
#phone-scroll { overflow-y:auto; flex:1; scrollbar-width:none; padding-bottom:70px; }
#phone-scroll::-webkit-scrollbar { display:none; }

/* TOP BAR */
#top-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:44px 16px 12px; background:var(--bg); position:sticky; top:0;
  z-index:50; transition:background 0.5s; border-bottom:1px solid rgba(255,255,255,0.08);
}
#back-btn {
  background:rgba(255,255,255,0.08); border:1px solid var(--accent);
  color:var(--accent); font-size:0.65rem; padding:6px 12px;
  border-radius:20px; cursor:pointer; letter-spacing:1px;
}
#page-title { font-size:1rem; color:#fff; font-weight:bold; text-align:center; }
#page-subtitle { font-size:0.55rem; color:var(--accent2); letter-spacing:2px; text-align:center; }

/* LEVEL TABS */
#level-tabs {
  display:flex; gap:6px; padding:10px 16px;
  background:rgba(255,255,255,0.03); border-bottom:1px solid rgba(255,255,255,0.06);
}
#level-tabs button {
  flex:1; padding:7px 4px; border:1px solid rgba(255,255,255,0.15);
  border-radius:8px; background:rgba(255,255,255,0.05);
  color:rgba(255,255,255,0.5); font-size:9px; cursor:pointer;
  font-family:Georgia,serif; transition:all 0.2s;
}
#level-tabs button.active {
  background:var(--btn-grad); color:#000; border-color:transparent; font-weight:bold;
}

/* SCORE BAR */
#score-bar {
  display:flex; justify-content:space-around; align-items:center;
  padding:10px 20px; margin:10px 16px;
  background:rgba(255,255,255,0.05); border-radius:12px;
  border:1px solid rgba(255,255,255,0.1);
}
.score-item { text-align:center; }
.score-label { font-size:0.55rem; color:rgba(255,255,255,0.5); letter-spacing:1px; }
.score-num { font-size:1.4rem; font-weight:bold; }
#score-you { color:var(--mx); }
#score-rita { color:var(--mo); }
#score-draws { color:rgba(255,255,255,0.4); font-size:1rem; }
.score-div { color:rgba(255,255,255,0.2); font-size:1.2rem; }

/* RITA COMMENT */
#rita-comment {
  margin:8px 16px; padding:10px 14px;
  background:rgba(255,255,255,0.05); border-radius:12px;
  border-left:3px solid var(--accent);
  font-size:0.72rem; color:#fff; line-height:1.5;
  min-height:52px; display:flex; align-items:center; gap:10px;
}
#rita-mini {
  width:38px; height:38px; flex-shrink:0;
  filter:drop-shadow(0 0 6px var(--glow));
  animation:float 3s ease-in-out infinite;
}
@keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }

/* STATUS */
#game-status {
  text-align:center; padding:6px 16px;
  font-size:0.78rem; color:var(--accent2); font-style:italic; min-height:28px;
}

/* GRID */
#ttt-grid {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:6px; padding:0 16px; margin:4px 0;
}
.ttt-cell {
  aspect-ratio:1; border-radius:12px; overflow:hidden;
  position:relative; cursor:pointer;
  border:2px solid rgba(255,255,255,0.1);
  transition:transform 0.15s, border-color 0.2s;
  background:rgba(255,255,255,0.05);
  display:flex; align-items:center; justify-content:center;
}
.ttt-cell:hover:not(.taken) { transform:scale(1.03); border-color:var(--accent); }
.ttt-cell.taken { cursor:default; }
.cell-bg {
  position:absolute; inset:0;
  font-size:48px; display:flex; align-items:center; justify-content:center;
  opacity:0.25;
}
.mark {
  position:absolute; inset:0; display:flex;
  align-items:center; justify-content:center;
  font-size:2.8rem; font-weight:bold;
  opacity:0; transition:opacity 0.3s, transform 0.3s; transform:scale(0.5);
  z-index:2;
}
.mark.show { opacity:1; transform:scale(1); }
.mark-x { color:var(--mx); text-shadow:0 0 20px var(--mx); }
.mark-o { color:var(--mo); text-shadow:0 0 20px var(--mo); }
.ttt-cell.winner { border-color:var(--accent2); animation:pulse 0.6s ease infinite alternate; }
@keyframes pulse { from{box-shadow:0 0 8px var(--glow);} to{box-shadow:0 0 24px var(--glow);} }

/* NEW GAME BTN */
#new-game-btn {
  display:block; margin:10px 16px;
  background:var(--btn-grad); border:none; border-radius:20px;
  padding:12px; color:#000; font-weight:bold; font-size:13px;
  cursor:pointer; font-family:Georgia,serif; letter-spacing:0.5px;
  width:calc(100% - 32px);
}

/* BEATCOINS */
#bc-mini {
  display:flex; justify-content:space-between; align-items:center;
  margin:6px 16px; padding:8px 14px;
  background:rgba(255,255,255,0.04); border-radius:10px;
  border:1px solid rgba(255,255,255,0.08);
}
#bc-mini-label { font-size:0.65rem; color:var(--accent); letter-spacing:1px; }
#bc-mini-count { font-size:0.85rem; color:var(--accent2); font-weight:bold; }

/* NAV BAR */
#nav-bar {
  flex-shrink:0; display:flex; align-items:center; justify-content:space-around;
  padding:10px 20px 14px; border-top:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.35);
}
.nav-btn {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:rgba(255,255,255,.5);
  cursor:pointer; padding:6px 14px; border-radius:12px;
  transition:all .2s; font-size:10px; font-family:Georgia,serif;
}
.nav-btn:hover { color:#fff; }
.nav-icon { font-size:20px; line-height:1; }
.nav-btn.nav-home .nav-icon, .nav-btn.nav-home { color:var(--accent); }

#toast {
  position:absolute; top:50px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.9); color:#fff; font-size:0.65rem;
  padding:7px 16px; border-radius:20px; z-index:300; opacity:0;
  transition:opacity 0.3s; white-space:nowrap; border:1px solid var(--accent);
  pointer-events:none;
}
#toast.show { opacity:1; }
</style>
</head>
<body>
<div id="phone">
  <div id="phone-scroll">

    <div id="top-bar">
      <button id="back-btn" onclick="goBack()">◀ BACK</button>
      <div>
        <div id="page-title">Tic-Tac-Toe</div>
        <div id="page-subtitle">UNDERWATER EDITION</div>
      </div>
      <div style="width:60px"></div>
    </div>

    <!-- LEVEL TABS -->
    <div id="level-tabs">
      <button onclick="setLevel('youngsters')" id="tab-y">🟣 Youngsters</button>
      <button onclick="setLevel('grownups')" id="tab-g">🟡 Grown Ups</button>
      <button onclick="setLevel('experts')" id="tab-e">⭐ Experts</button>
    </div>

    <!-- SCORE BAR -->
    <div id="score-bar">
      <div class="score-item">
        <div class="score-label">YOU</div>
        <div class="score-num" id="score-you">0</div>
      </div>
      <div class="score-div">|</div>
      <div class="score-item">
        <div class="score-label">DRAWS</div>
        <div class="score-num" id="score-draws" style="color:rgba(255,255,255,0.4);font-size:1rem">0</div>
      </div>
      <div class="score-div">|</div>
      <div class="score-item">
        <div class="score-label">RITA</div>
        <div class="score-num" id="score-rita">0</div>
      </div>
    </div>

    <!-- RITA COMMENT -->
    <div id="rita-comment">
      <img id="rita-mini" src="https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/rita_beatcorps_clean.png" alt="Rita">
      <span id="rita-text">Hello love! Welcome to Tic-Tac-Toe Underwater! You are X and I am O. Tap any square to begin. Can you beat me darling?</span>
    </div>

    <!-- STATUS -->
    <div id="game-status">Your turn — tap a square!</div>

    <!-- BEATCOINS -->
    <div id="bc-mini">
      <span id="bc-mini-label">Educational BeatCoins Total</span>
      <span id="bc-mini-count">25,000</span>
    </div>

    <!-- GRID -->
    <div id="ttt-grid">
      <div class="ttt-cell" id="c0" onclick="playerMove(0)"><div class="cell-bg">🐙</div><div class="mark mark-x" id="m0x">X</div><div class="mark mark-o" id="m0o">O</div></div>
      <div class="ttt-cell" id="c1" onclick="playerMove(1)"><div class="cell-bg">🐠</div><div class="mark mark-x" id="m1x">X</div><div class="mark mark-o" id="m1o">O</div></div>
      <div class="ttt-cell" id="c2" onclick="playerMove(2)"><div class="cell-bg">🦑</div><div class="mark mark-x" id="m2x">X</div><div class="mark mark-o" id="m2o">O</div></div>
      <div class="ttt-cell" id="c3" onclick="playerMove(3)"><div class="cell-bg">🪸</div><div class="mark mark-x" id="m3x">X</div><div class="mark mark-o" id="m3o">O</div></div>
      <div class="ttt-cell" id="c4" onclick="playerMove(4)"><div class="cell-bg">🐡</div><div class="mark mark-x" id="m4x">X</div><div class="mark mark-o" id="m4o">O</div></div>
      <div class="ttt-cell" id="c5" onclick="playerMove(5)"><div class="cell-bg">🦀</div><div class="mark mark-x" id="m5x">X</div><div class="mark mark-o" id="m5o">O</div></div>
      <div class="ttt-cell" id="c6" onclick="playerMove(6)"><div class="cell-bg">🌊</div><div class="mark mark-x" id="m6x">X</div><div class="mark mark-o" id="m6o">O</div></div>
      <div class="ttt-cell" id="c7" onclick="playerMove(7)"><div class="cell-bg">🐚</div><div class="mark mark-x" id="m7x">X</div><div class="mark mark-o" id="m7o">O</div></div>
      <div class="ttt-cell" id="c8" onclick="playerMove(8)"><div class="cell-bg">⭐</div><div class="mark mark-x" id="m8x">X</div><div class="mark mark-o" id="m8o">O</div></div>
    </div>

    <button id="new-game-btn" onclick="resetGame()">🔄 New Game</button>

  </div>

  <!-- NAV BAR -->
  <nav id="nav-bar">
    <button class="nav-btn" onclick="goBack()"><span class="nav-icon">◀️</span><span>Back</span></button>
    <button class="nav-btn nav-home" onclick="goHome()"><span class="nav-icon">🏠</span><span>Home</span></button>
    <button class="nav-btn" onclick="goForward()"><span class="nav-icon">▶️</span><span>Next</span></button>
  </nav>
</div>

<div id="toast"></div>

<script>
const BASE = 'https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/';

let board = Array(9).fill(null);
let gameActive = true;
let playerTurn = true;
let scores = { you:0, rita:0, draws:0 };
let level = 'youngsters';
let fromWorld = null;
let beatcoins = 25000;

const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

const RITA_MSGS = {
  yourTurn: ["Your turn love! Choose wisely!", "Come on darling! Pick your square!", "Where will you go love?", "The ocean is yours to conquer!"],
  ritaTurn: ["My turn love! Let me think...", "Ooh I see a good move darling!", "Rita is thinking...", "Watch this love!"],
  youWin:   ["Well done love! You beat me fair and square!", "Brilliant move darling! You won!", "Oh you are good! I need to practice more!", "You outsmarted me love! Well played!"],
  ritaWin:  ["Oh love I won this one! Better luck next time!", "Rita wins! But you played brilliantly darling!", "Gotcha love! Shall we play again?", "I got you this time darling!"],
  draw:     ["It is a draw love! We are perfectly matched!", "Neither of us wins this one darling! Again?", "A draw! You are as clever as me love!", "Tied! We are equals darling!"],
};

// Level difficulty: youngsters=easy, grownups=medium, experts=hard
function aiMove() {
  if (level === 'experts') return bestMove();
  if (level === 'grownups') return Math.random() > 0.4 ? bestMove() : randomMove();
  return randomMove(); // youngsters
}

function bestMove() {
  // Try to win
  for (let i=0;i<9;i++) {
    if (!board[i]) {
      board[i]='O';
      if (checkWinner()==='O') { board[i]=null; return i; }
      board[i]=null;
    }
  }
  // Block player
  for (let i=0;i<9;i++) {
    if (!board[i]) {
      board[i]='X';
      if (checkWinner()==='X') { board[i]=null; return i; }
      board[i]=null;
    }
  }
  // Take center
  if (!board[4]) return 4;
  // Take corner
  const corners = [0,2,6,8].filter(i=>!board[i]);
  if (corners.length) return corners[Math.floor(Math.random()*corners.length)];
  return randomMove();
}

function randomMove() {
  const empty = board.map((v,i)=>v?null:i).filter(v=>v!==null);
  return empty[Math.floor(Math.random()*empty.length)];
}

function checkWinner() {
  for (const [a,b,c] of WINS) {
    if (board[a] && board[a]===board[b] && board[a]===board[c]) return board[a];
  }
  return board.every(v=>v) ? 'draw' : null;
}

function getWinLine() {
  for (const line of WINS) {
    const [a,b,c] = line;
    if (board[a] && board[a]===board[b] && board[a]===board[c]) return line;
  }
  return null;
}

function playerMove(idx) {
  if (!gameActive || !playerTurn || board[idx]) return;
  board[idx] = 'X';
  showMark(idx, 'X');
  document.getElementById('c'+idx).classList.add('taken');
  const result = checkWinner();
  if (result) { endGame(result); return; }
  playerTurn = false;
  setStatus("Rita is thinking...");
  ritaSay(pick(RITA_MSGS.ritaTurn));
  setTimeout(doAiMove, 600 + Math.random()*400);
}

function doAiMove() {
  const idx = aiMove();
  if (idx === undefined || idx === null) { endGame('draw'); return; }
  board[idx] = 'O';
  showMark(idx, 'O');
  document.getElementById('c'+idx).classList.add('taken');
  const result = checkWinner();
  if (result) { endGame(result); return; }
  playerTurn = true;
  setStatus("Your turn — tap a square!");
  ritaSay(pick(RITA_MSGS.yourTurn));
}

function showMark(idx, mark) {
  const el = document.getElementById('m'+idx+(mark==='X'?'x':'o'));
  if (el) el.classList.add('show');
}

function endGame(result) {
  gameActive = false;
  const line = getWinLine();
  if (line) line.forEach(i => document.getElementById('c'+i).classList.add('winner'));

  if (result === 'X') {
    scores.you++;
    const bonus = level==='youngsters'?50:level==='grownups'?100:200;
    beatcoins += bonus;
    ritaSay(pick(RITA_MSGS.youWin));
    setStatus("🏆 You win! +" + bonus + " BeatCoins!");
    saveBeatcoins();
  } else if (result === 'O') {
    scores.rita++;
    ritaSay(pick(RITA_MSGS.ritaWin));
    setStatus("Rita wins this round! No BeatCoins lost — try again!");
  } else {
    scores.draws++;
    ritaSay(pick(RITA_MSGS.draw));
    setStatus("It's a draw! Well matched love!");
  }
  updateScores();
}

function resetGame() {
  board = Array(9).fill(null);
  gameActive = true;
  playerTurn = true;
  for (let i=0;i<9;i++) {
    const c = document.getElementById('c'+i);
    c.classList.remove('taken','winner');
    ['x','o'].forEach(m => {
      const el = document.getElementById('m'+i+m);
      if (el) el.classList.remove('show');
    });
  }
  setStatus("Your turn — tap a square!");
  ritaSay("Right then love! New game! You go first. Choose your square!");
}

function updateScores() {
  document.getElementById('score-you').textContent = scores.you;
  document.getElementById('score-rita').textContent = scores.rita;
  document.getElementById('score-draws').textContent = scores.draws;
  document.getElementById('bc-mini-count').textContent = beatcoins.toLocaleString();
}

function setStatus(txt) {
  document.getElementById('game-status').textContent = txt;
}

function ritaSay(txt) {
  document.getElementById('rita-text').textContent = txt;
  speak(txt);
}

function setLevel(lvl) {
  level = lvl;
  document.getElementById('phone').className = 'theme-' + (lvl==='youngsters'?'':lvl);
  ['y','g','e'].forEach(t => document.getElementById('tab-'+t).classList.remove('active'));
  const map = {youngsters:'y', grownups:'g', experts:'e'};
  document.getElementById('tab-'+map[lvl]).classList.add('active');
  localStorage.setItem('askLovelyRitaV4_level', lvl);
  resetGame();
  const msgs = {
    youngsters: "Youngsters level love! I will go easy on you. Have fun!",
    grownups: "Grown Ups level darling! I will put up a proper fight now!",
    experts: "Experts level love! I play to win now. Good luck darling!"
  };
  ritaSay(msgs[lvl]);
}

function saveBeatcoins() {
  localStorage.setItem('askLovelyRitaV4_bc', beatcoins);
  document.getElementById('bc-mini-count').textContent = beatcoins.toLocaleString();
}

function speak(text) {
  if (localStorage.getItem('askLovelyRitaV4_mute')==='1') return;
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=0.92; u.pitch=1.1;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(v=>v.lang==='en-GB'&&/female|woman/i.test(v.name))
         || voices.find(v=>v.lang==='en-GB')
         || voices.find(v=>v.lang.startsWith('en'));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

function toast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}


// Save BeatCoins per chosen Lad for global scoreboard

function postGlobalScore(amount) {
  try {
    const lad = localStorage.getItem('askLovelyRitaV4_chosen_lad') || 'smart';
    fetch('https://empty-leaf-6e4b.alexmonteironeto.workers.dev/score', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ lad: lad, amount: amount })
    }).catch(()=>{});
  } catch(e) {}
}

function saveEBC(amount) {
  try {
    const cur = Number(localStorage.getItem('lra_ebc_balance') || 0);
    localStorage.setItem('lra_ebc_balance', cur + amount);
  } catch(e) {}
}

function goBack() {
  if (fromWorld==='ocean') { window.location.href='page6_octopus.html'; return; }
  window.location.href='page5_worlds.html';
}
function goHome() { window.location.href='page1_landing.html'; }
function goForward(){const lv=localStorage.getItem('askLovelyRitaV4_level')||'youngsters';localStorage.setItem('lra_current_world','octopus');localStorage.setItem('lra_shop_visit','1');window.location.href='page_shop.html?world=octopus&visit=1&level='+lv;}

// INIT
window.addEventListener('load', () => {
  const params = new URLSearchParams(window.location.search);
  if (params.get('level') && ['youngsters','grownups','experts'].includes(params.get('level'))) {
    level = params.get('level');
  }
  if (params.get('from')) fromWorld = params.get('from');

  // Load beatcoins
  beatcoins = Number(localStorage.getItem('askLovelyRitaV4_bc') || 25000);

  // Load scores from storage
  const sc = JSON.parse(localStorage.getItem('askLovelyRitaV4_ttt_scores')||'{}');
  scores.you   = sc.you   || 0;
  scores.rita  = sc.rita  || 0;
  scores.draws = sc.draws || 0;

  setLevel(level);
  updateScores();

  const greet = "Hello love! Welcome to Tic-Tac-Toe Underwater! You are X and I am O. Tap any square to begin!";
  const doSpeak = () => speak(greet);
  if (window.speechSynthesis.getVoices().length > 0) setTimeout(doSpeak, 800);
  else window.speechSynthesis.onvoiceschanged = () => setTimeout(doSpeak, 800);
});
</script>
</body>
</html>
