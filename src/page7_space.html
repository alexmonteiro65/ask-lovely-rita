<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lovely Rita Adventures — Star Words</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#060618; display:flex; flex-direction:column; align-items:center; min-height:100vh; font-family:Georgia,serif; }

#phone {
  background:#060618; width:393px; min-height:852px; border-radius:48px; position:relative;
  overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 0 0 10px #1a1a1a,0 0 0 12px #333,0 30px 80px rgba(0,0,0,0.8);
  margin:20px 0 40px;
}
#phone::before {
  content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:120px; height:34px; background:#0a0a0a; border-radius:0 0 20px 20px; z-index:100;
}

/* THEMES */
:root { --accent:#a855f7; --accent2:#ffde59; --glow:#a855f7; --btn-grad:linear-gradient(135deg,#a855f7,#1a0040); }
.theme-youngsters { --accent:#ff6ef7; --accent2:#ffde59; --glow:#ff6ef7; --btn-grad:linear-gradient(135deg,#ff6ef7,#a855f7); }
.theme-grownups   { --accent:#ffde59; --accent2:#fff3a0; --glow:#ffde59; --btn-grad:linear-gradient(135deg,#ffde59,#c8860a); }
.theme-experts    { --accent:#c8a96e; --accent2:#e8d5b0; --glow:#c8a96e; --btn-grad:linear-gradient(135deg,#c8a96e,#6677aa); }

#starfield { position:absolute; inset:0; pointer-events:none; z-index:0; }
.star { position:absolute; border-radius:50%; background:#fff; animation:twinkle var(--d,2s) ease-in-out infinite alternate; }
@keyframes twinkle { from{opacity:.2;} to{opacity:1;} }

#phone-scroll { flex:1; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; padding-top:44px; padding-bottom:70px; position:relative; z-index:1; }
#phone-scroll::-webkit-scrollbar { display:none; }

/* TOP BAR */
#top-bar {
  display:flex; align-items:center; gap:8px; padding:8px 14px;
  background:rgba(0,0,0,0.5); border-bottom:1px solid rgba(255,255,255,0.08);
}
.stat-card { flex:1; background:rgba(255,255,255,0.06); border-radius:8px; padding:5px 8px; text-align:center; }
.stat-label { font-size:8px; color:rgba(255,255,255,0.5); letter-spacing:1px; }
.stat-val { font-size:15px; font-weight:bold; color:var(--accent); }
#bc-val { color:#ffde59; }
#score-val { color:#a855f7; }

/* LEVEL TABS */
#level-tabs { display:flex; gap:5px; padding:8px 12px; }
#level-tabs button {
  flex:1; padding:6px 4px; border:1px solid rgba(255,255,255,0.15);
  border-radius:8px; background:rgba(255,255,255,0.05);
  color:rgba(255,255,255,0.5); font-size:9px; cursor:pointer;
  font-family:Georgia,serif; transition:all 0.2s;
}
#level-tabs button.active { background:var(--btn-grad); color:#000; border-color:transparent; font-weight:bold; }

/* LAD + RITA */
#lad-rita-row {
  display:flex; align-items:center; gap:10px; padding:8px 14px;
  background:rgba(255,255,255,0.03); border-bottom:1px solid rgba(255,255,255,0.06);
}
#lad-bottom-img { width:52px; height:52px; object-fit:contain; filter:drop-shadow(0 0 8px var(--glow)); }
#rita-text { flex:1; font-size:11px; color:#ddd; line-height:1.5; font-style:italic; }

/* QUESTION CARD */
#question-area { padding:12px 14px; }

#question-card {
  background:rgba(0,0,0,0.6); border:2px solid var(--accent);
  border-radius:16px; overflow:hidden; margin-bottom:12px;
  box-shadow:0 0 20px rgba(168,85,247,0.3);
}
#question-img-wrap {
  display:none; width:100%; height:160px; overflow:hidden; position:relative;
}
#question-img-wrap img { width:100%; height:100%; object-fit:cover; }
#question-img-overlay {
  position:absolute; inset:0;
  background:linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.8));
}

#question-text-wrap { padding:14px 16px; }
#question-counter { font-size:9px; color:rgba(255,255,255,0.4); letter-spacing:1px; margin-bottom:6px; }
#question-text { font-size:14px; color:#fff; line-height:1.5; font-weight:bold; }

/* PROGRESS */
#progress-bar { height:3px; background:rgba(255,255,255,0.1); border-radius:2px; margin:0 14px 12px; }
#progress-fill { height:100%; background:var(--btn-grad); border-radius:2px; transition:width 0.4s; }

/* OPTIONS */
#options-grid { display:flex; flex-direction:column; gap:8px; padding:0 14px 14px; }

.option-btn {
  display:flex; align-items:center; gap:12px;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.15);
  border-radius:12px; padding:12px 14px; cursor:pointer;
  transition:all 0.2s; text-align:left;
}
.option-btn:hover:not(:disabled) { border-color:var(--accent); background:rgba(255,255,255,0.1); }
.option-btn:disabled { cursor:default; }
.option-btn.correct { border-color:#4ade80; background:rgba(74,222,128,0.15); }
.option-btn.wrong   { border-color:#f87171; background:rgba(248,113,113,0.15); }

.opt-letter {
  width:28px; height:28px; border-radius:50%; flex-shrink:0;
  background:var(--btn-grad); display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:bold; color:#000;
}
.opt-text { font-size:13px; color:#ddd; flex:1; line-height:1.4; }

/* RESULT PANEL */
#result-panel {
  display:none; flex-direction:column; align-items:center;
  background:rgba(0,0,0,0.85); border:2px solid var(--accent);
  border-radius:16px; padding:16px; margin:0 14px 14px; gap:8px; text-align:center;
}
#result-panel.show { display:flex; }
#result-icon { font-size:36px; }
#result-title { font-size:15px; font-weight:bold; color:#fff; }
#result-fact { font-size:11px; color:rgba(255,255,255,0.7); line-height:1.5; font-style:italic; }
#result-pts { font-size:14px; font-weight:bold; color:#ffde59; }
#result-image { display:none; width:100%; border-radius:10px; max-height:140px; object-fit:cover; margin-top:4px; }

#bonus-area { display:none; margin-top:10px; text-align:center; width:100%; }
#bonus-area .bonus-title { font-size:13px; font-weight:bold; color:#ffde59; margin-bottom:4px; }
#bonus-countdown { font-size:11px; color:rgba(255,255,255,0.6); margin-bottom:8px; }
#bonus-btn-sw {
  background:linear-gradient(135deg,#a855f7,#1a0040); border:none; border-radius:20px;
  padding:10px 20px; color:#fff; font-weight:bold; font-size:12px;
  cursor:pointer; font-family:Georgia,serif; width:100%;
}

/* START / NEXT BTN */
#start-btn, #next-btn {
  display:block; margin:0 14px 10px;
  background:var(--btn-grad); border:none; border-radius:20px;
  padding:12px; color:#000; font-weight:bold; font-size:13px;
  cursor:pointer; font-family:Georgia,serif; width:calc(100% - 28px);
  box-shadow:0 0 16px var(--glow);
}
#next-btn { display:none; background:linear-gradient(135deg,#4ade80,#16a34a); color:#000; }

/* CELEBRATE */
#celebrate { position:absolute; inset:0; pointer-events:none; z-index:25; overflow:hidden; border-radius:40px; }
.cp { position:absolute; width:8px; height:8px; border-radius:50%; animation:conffall 1.4s ease-in forwards; }
@keyframes conffall { 0%{opacity:1;transform:translateY(-20px) rotate(0deg);} 100%{opacity:0;transform:translateY(900px) rotate(720deg);} }

/* NAV */
#nav-bar {
  flex-shrink:0; display:flex; align-items:center; justify-content:space-around;
  padding:10px 0 14px; border-top:1px solid rgba(255,255,255,.06);
  background:rgba(0,0,0,.4); position:relative; z-index:10;
}
.nav-btn {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:rgba(255,255,255,.4);
  cursor:pointer; padding:4px 14px; font-size:9px; font-family:Georgia,serif;
  transition:color 0.2s;
}
.nav-btn:hover { color:var(--accent); }
.nav-btn.nav-home { color:var(--accent); }
.nav-icon { font-size:20px; line-height:1; }

#toast {
  position:absolute; top:54px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.9); color:#fff; font-size:11px;
  padding:6px 16px; border-radius:20px; z-index:300; opacity:0;
  transition:opacity 0.3s; white-space:nowrap; border:1px solid var(--accent);
  pointer-events:none;
}
#toast.show { opacity:1; }
</style>
</head>
<body>
<div id="phone" class="theme-youngsters">
  <div id="starfield"></div>
  <div id="celebrate"></div>

  <div id="phone-scroll">
    <!-- TOP BAR -->
    <div id="top-bar">
      <div class="stat-card"><div class="stat-label">BeatCoins</div><div class="stat-val" id="bc-val">25,000</div></div>
      <div class="stat-card"><div class="stat-label">Score</div><div class="stat-val" id="score-val">0</div></div>
      <div class="stat-card"><div class="stat-label">Question</div><div class="stat-val" id="q-val" style="color:#60a5fa">0/8</div></div>
    </div>

    <!-- LEVEL TABS -->
    <div id="level-tabs">
      <button onclick="setLevel('youngsters')" id="tab-y">🟣 Youngsters</button>
      <button onclick="setLevel('grownups')" id="tab-g">🟡 Grown Ups</button>
      <button onclick="setLevel('experts')" id="tab-e">⭐ Experts</button>
    </div>

    <!-- LAD + RITA -->
    <div id="lad-rita-row">
      <img id="lad-bottom-img" src="https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/Smart_Space_Lad.png" alt="Smart Lad" onerror="this.style.display='none'">
      <span id="rita-text">Hello love! Welcome to Star Words! The Smart Lad will guide you through the cosmos. Answer 8 questions to unlock your bonus game!</span>
    </div>

    <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>

    <!-- QUESTION CARD -->
    <div id="question-area">
      <div id="question-card">
        <div id="question-img-wrap">
          <img id="question-img" src="" alt="">
          <div id="question-img-overlay"></div>
        </div>
        <div id="question-text-wrap">
          <div id="question-counter">Question 0 of 8</div>
          <div id="question-text">Press Start to begin your cosmic adventure!</div>
        </div>
      </div>

      <div id="options-grid"></div>

      <div id="result-panel">
        <div id="result-icon">⭐</div>
        <div id="result-title"></div>
        <img id="result-image" src="" alt="">
        <div id="result-fact"></div>
        <div id="result-pts"></div>
        <div id="bonus-area">
          <div class="bonus-title">🎮 BONUS GAME UNLOCKED!</div>
          <div id="bonus-countdown"></div>
          <button id="bonus-btn-sw" onclick="goToBonusGame()">🎵 Play The Turntable!</button>
        </div>
      </div>

      <button id="start-btn" onclick="startGame()">🚀 Begin Star Words!</button>
      <button id="next-btn" onclick="nextQuestion()">▶ Next Question</button>
    </div>

  </div>

  <nav id="nav-bar">
    <button class="nav-btn" onclick="goBack()"><span class="nav-icon">◀️</span><span>Back</span></button>
    <button class="nav-btn nav-home" onclick="goHome()"><span class="nav-icon">🏠</span><span>Home</span></button>
    <button class="nav-btn" onclick="goForward()"><span class="nav-icon">▶️</span><span>Next</span></button>
  </nav>
</div>
<div id="toast"></div>

<script>
const BASE = 'https://raw.githubusercontent.com/alexmonteiro65/ask-lovely-rita/main/src/';

// ── QUESTIONS ─────────────────────────────────────────────
const QUESTIONS = {
  youngsters: [
    { q:"The Sun is a ___", img:BASE+'star_words_question.png', opts:["Star","Planet","Moon"], ans:0, fact:"The Sun is a star at the centre of our solar system. It is so big that one million Earths could fit inside it!" },
    { q:"How many planets are in our solar system?", img:BASE+'star_words_question.png', opts:["8","10","12"], ans:0, fact:"There are 8 planets — Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune." },
    { q:"Which planet has rings around it?", img:BASE+'star_words_question.png', opts:["Saturn","Jupiter","Mars"], ans:0, fact:"Saturn is famous for its beautiful rings made of ice and rock. You can even see them with a small telescope!" },
    { q:"What do we call a group of stars that form a picture?", img:BASE+'star_words_question.png', opts:["Constellation","Galaxy","Comet"], ans:0, fact:"Constellations are patterns of stars. Ancient sailors used them to navigate across the seas!" },
    { q:"The Moon travels around which planet?", img:BASE+'star_words_question.png', opts:["Earth","Mars","Venus"], ans:0, fact:"Our Moon takes about 27 days to travel all the way around Earth. That is why we have lunar months!" },
    { q:"What is the closest star to Earth?", img:BASE+'star_words_question.png', opts:["The Sun","Sirius","Alpha Centauri"], ans:0, fact:"The Sun is our closest star — just 150 million kilometres away. The next closest star would take 70,000 years to reach by spacecraft!" },
    { q:"What do we call a shooting star?", img:BASE+'star_words_question.png', opts:["Meteor","Comet","Asteroid"], ans:0, fact:"A meteor is a piece of rock that burns up as it enters Earth's atmosphere. Most are no bigger than a grain of sand!" },
    { q:"Which planet is the largest in our solar system?", img:BASE+'star_words_question.png', opts:["Jupiter","Saturn","Neptune"], ans:0, fact:"Jupiter is so enormous that all the other planets could fit inside it! It also has 95 known moons." },
  ],
  grownups: [
    { q:"How long does light take to travel from the Sun to Earth?", img:'', opts:["About 8 minutes","About 8 hours","About 8 seconds"], ans:0, fact:"Light travels at 300,000 km per second, covering the 150 million km from Sun to Earth in just over 8 minutes." },
    { q:"What is a light-year?", img:'', opts:["Distance light travels in a year","Time it takes to reach a star","Speed of the universe"], ans:0, fact:"A light-year is about 9.46 trillion kilometres — the distance light covers in one year at 300,000 km per second." },
    { q:"What is the Milky Way?", img:'', opts:["Our galaxy","A type of nebula","A black hole"], ans:0, fact:"The Milky Way is our home galaxy containing over 200 billion stars. Our Sun is just one of them, about halfway from the centre." },
    { q:"What force keeps planets in orbit around the Sun?", img:'', opts:["Gravity","Magnetism","Solar wind"], ans:0, fact:"Gravity is the invisible force that keeps all planets, moons and satellites in their orbits. Isaac Newton described it in 1687." },
    { q:"What is a black hole?", img:'', opts:["A region where gravity is so strong nothing escapes","A dead star","An empty area of space"], ans:0, fact:"Black holes form when massive stars collapse. Their gravity is so intense that even light cannot escape — which is why we cannot see them directly." },
    { q:"Which planet rotates on its side?", img:'', opts:["Uranus","Neptune","Venus"], ans:0, fact:"Uranus has an axial tilt of 98 degrees — it essentially rolls around the Sun on its side. Scientists think a massive collision caused this." },
    { q:"What is the Big Bang theory?", img:'', opts:["The universe began from a single point about 13.8 billion years ago","Stars explode and create new galaxies","Planets were formed by giant explosions"], ans:0, fact:"The Big Bang describes how the universe expanded from an incredibly dense, hot state about 13.8 billion years ago. Evidence comes from the cosmic microwave background radiation." },
    { q:"What phrase from the song Across the Universe translates as 'I bow to the divine guru'?", img:'', opts:["Jai Guru Deva Om","Nothing's gonna change my world","Limitless undying love"], ans:0, fact:"Jai Guru Deva Om is a Sanskrit mantra. The Quiet Lad learned it during his travels in India and the phrase inspired one of the most beloved songs ever written." },
  ],
  experts: [
    { q:"What is the Schwarzschild radius?", img:'', opts:["The radius at which an object becomes a black hole","The distance from Earth to the Sun","The size of the observable universe"], ans:0, fact:"The Schwarzschild radius defines the event horizon of a black hole — the point of no return. For Earth, it would be about 9mm." },
    { q:"What is cosmic inflation?", img:'', opts:["The rapid expansion of the universe fractions of a second after the Big Bang","The gradual expansion of galaxies","The expansion of stars before they explode"], ans:0, fact:"Cosmic inflation occurred in the first 10⁻³² seconds after the Big Bang, expanding the universe by a factor of at least 10²⁶. It explains the uniformity of the cosmic microwave background." },
    { q:"The phrase 'Across the Universe' — what concept does it embody according to its writer?", img:'', opts:["The infinite, unstoppable nature of love and creativity","The physical vastness of space","The journey through meditation"], ans:0, fact:"The writer described the song as capturing 'the highest state of consciousness' — the idea that thoughts and love flow endlessly outward like light, unchanged and unchanging across the universe." },
    { q:"What is a neutron star?", img:'', opts:["The ultra-dense remnant of a supernova explosion","A star with no nuclear fusion","A star made entirely of dark matter"], ans:0, fact:"Neutron stars are the densest objects known — a teaspoon of neutron star material would weigh about a billion tonnes. They spin incredibly fast, some hundreds of times per second." },
    { q:"What is dark matter?", img:'', opts:["Matter that does not interact with light but exerts gravitational effects","The space between galaxies","Matter inside black holes"], ans:0, fact:"Dark matter makes up about 27% of the universe but has never been directly detected. We know it exists because of its gravitational effects on visible matter." },
    { q:"What is a parsec?", img:'', opts:["About 3.26 light-years","One billion kilometres","The distance from Earth to Mars"], ans:0, fact:"A parsec equals about 3.26 light-years or 30.9 trillion kilometres. It is defined by the parallax angle of one arcsecond as seen from Earth." },
    { q:"What wavelength does the cosmic microwave background radiation peak at?", img:'', opts:["Microwave — about 1.9mm","Radio waves — about 10m","Infrared — about 10 micrometres"], ans:0, fact:"The CMB is the thermal echo of the Big Bang, now cooled to just 2.725 Kelvin. It was accidentally discovered in 1965 by Penzias and Wilson who initially thought it was pigeon droppings on their antenna." },
    { q:"In 'Across the Universe', the words flow like 'endless rain into a paper cup'. This describes what philosophical concept?", img:'', opts:["The futility of trying to contain infinite thought","Water conservation","The passage of time"], ans:0, fact:"The writer described the image as expressing how thoughts and words are ultimately inadequate vessels for infinite consciousness — a concept rooted in Transcendental Meditation philosophy." },
  ]
};

const RITA_INTRO = {
  youngsters: "Hello love! Welcome to Star Words! The Smart Lad will guide you through the cosmos. Answer the questions and earn Educational BeatCoins! No worries if you get one wrong — I will teach you darling!",
  grownups: "Hello there! Star Words for Grown Ups! These cosmic questions will test your science knowledge darling. Think carefully and reach for the stars!",
  experts: "Right then! Expert astronomers only! These questions combine deep space science with the philosophy behind one of the most cosmic songs ever written. Good luck love!"
};

const RITA_CORRECT = [
  "Brilliant love! You are a true star!",
  "Cosmic! Well done darling!",
  "Out of this world! Correct!",
  "The Smart Lad is impressed love!",
  "Magnificent! You know your cosmos darling!"
];

const RITA_WRONG = [
  "Not quite love — but now you know!",
  "Close darling! Here is what I know about this...",
  "Good try love! Let me explain...",
  "The cosmos is full of surprises darling!"
];

const RITA_COMPLETE = [
  "Stellar work love! You completed Star Words! The entire universe is proud of you!",
  "Mission complete darling! The Smart Lad says you are ready to explore the real cosmos!",
  "Outstanding love! Eight questions answered! You are a true astronaut of knowledge!"
];

const LEVEL_CFG = {
  youngsters: { bonus:30, bonusAll:120 },
  grownups:   { bonus:50, bonusAll:180 },
  experts:    { bonus:80, bonusAll:280 },
};

let S = { level:'youngsters', beatcoins:25000, score:0, qIndex:0, order:[], gameActive:false, answered:false, fromWorld:null };

// ── INIT ──────────────────────────────────────────────────
window.addEventListener('load', ()=>{
  buildStars();
  const params = new URLSearchParams(window.location.search);
  if(params.get('level') && ['youngsters','grownups','experts'].includes(params.get('level'))) {
    S.level = params.get('level');
  }
  if(params.get('from')) S.fromWorld = params.get('from');
  S.beatcoins = Number(localStorage.getItem('askLovelyRitaV4_bc')||25000);
  document.getElementById('bc-val').textContent = S.beatcoins.toLocaleString();
  setLevel(S.level);
  const doSpeak = ()=>speak(RITA_INTRO[S.level]);
  if(window.speechSynthesis.getVoices().length>0) setTimeout(doSpeak,800);
  else window.speechSynthesis.onvoiceschanged=()=>setTimeout(doSpeak,800);
});

function buildStars() {
  const f=document.getElementById('starfield');
  for(let i=0;i<60;i++){
    const s=document.createElement('div'); s.className='star';
    const sz=1+Math.random()*2.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${1.5+Math.random()*3}s;animation-delay:${Math.random()*3}s;`;
    f.appendChild(s);
  }
}

function setLevel(lvl) {
  S.level = lvl;
  document.getElementById('phone').className = 'theme-'+lvl;
  ['y','g','e'].forEach(t=>document.getElementById('tab-'+t).classList.remove('active'));
  const m={youngsters:'y',grownups:'g',experts:'e'};
  document.getElementById('tab-'+m[lvl]).classList.add('active');
  localStorage.setItem('askLovelyRitaV4_level', lvl);
  if(S.gameActive) { resetGame(); }
  speak(RITA_INTRO[lvl]);
  setRitaText(RITA_INTRO[lvl]);
}

function startGame() {
  S.gameActive=true; S.qIndex=0; S.score=0;
  const qs=QUESTIONS[S.level];
  S.order=[...Array(qs.length).keys()].sort(()=>Math.random()-0.5);
  document.getElementById('start-btn').style.display='none';
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('bonus-area').style.display='none';
  loadQuestion();
}

function loadQuestion() {
  if(S.qIndex>=8){ finishGame(); return; }
  S.answered=false;
  const qs=QUESTIONS[S.level];
  const q=qs[S.order[S.qIndex]];
  const lvl=S.level;

  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('next-btn').style.display='none';
  document.getElementById('question-counter').textContent=`Question ${S.qIndex+1} of 8`;
  document.getElementById('question-text').textContent=q.q;
  document.getElementById('progress-fill').style.width=`${(S.qIndex/8)*100}%`;
  document.getElementById('q-val').textContent=`${S.qIndex}/8`;

  // Image: Youngsters see before question
  const imgWrap=document.getElementById('question-img-wrap');
  const imgEl=document.getElementById('question-img');
  if(lvl==='youngsters' && q.img){
    imgEl.src=q.img; imgWrap.style.display='block';
  } else {
    imgWrap.style.display='none';
  }

  // Options
  const grid=document.getElementById('options-grid');
  grid.innerHTML='';
  const letters=['A','B','C'];
  q.opts.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='option-btn';
    btn.innerHTML=`<div class="opt-letter">${letters[i]}</div><div class="opt-text">${opt}</div>`;
    btn.onclick=()=>answer(i, q);
    grid.appendChild(btn);
  });
}

function answer(chosen, q) {
  if(S.answered) return;
  S.answered=true;
  const correct=chosen===q.ans;
  const btns=document.querySelectorAll('.option-btn');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.ans) b.classList.add('correct');
    else if(i===chosen && !correct) b.classList.add('wrong');
  });

  const earned=correct?LEVEL_CFG[S.level].bonus:0;
  if(correct){ S.beatcoins+=earned; S.score+=earned; saveBC(); celebrate(); }

  // Show result panel
  const rp=document.getElementById('result-panel');
  document.getElementById('result-icon').textContent=correct?'✅':'💫';
  document.getElementById('result-title').textContent=correct?pick(RITA_CORRECT):pick(RITA_WRONG);
  document.getElementById('result-fact').textContent=q.fact;
  document.getElementById('result-pts').textContent=correct?`+${earned} BeatCoins!`:'+0 BeatCoins';
  document.getElementById('result-pts').style.color=correct?'#ffde59':'rgba(255,255,255,0.4)';

  // Grown Ups / Experts: show image after answer
  const ri=document.getElementById('result-image');
  if(S.level!=='youngsters' && q.img){
    ri.src=q.img; ri.style.display='block';
    setTimeout(()=>{ ri.style.display='none'; }, 3500);
  } else { ri.style.display='none'; }

  rp.classList.add('show');
  speak(correct?pick(RITA_CORRECT)+' '+q.fact : pick(RITA_WRONG)+' '+q.fact);
  setRitaText(correct?pick(RITA_CORRECT):q.fact);

  document.getElementById('bc-val').textContent=S.beatcoins.toLocaleString();
  document.getElementById('score-val').textContent=S.score;
  S.qIndex++;

  setTimeout(()=>{
    if(S.qIndex>=8){ setTimeout(finishGame,800); }
    else {
      document.getElementById('next-btn').style.display='block';
    }
  }, 1200);
}

function nextQuestion() {
  document.getElementById('next-btn').style.display='none';
  loadQuestion();
}

function finishGame() {
  S.gameActive=false;
  const bonus=LEVEL_CFG[S.level].bonusAll;
  S.beatcoins+=bonus; S.score+=bonus;
  saveBC(); saveLadBC(bonus);
  document.getElementById('bc-val').textContent=S.beatcoins.toLocaleString();
  document.getElementById('score-val').textContent=S.score;
  document.getElementById('progress-fill').style.width='100%';
  document.getElementById('q-val').textContent='8/8';

  const rp=document.getElementById('result-panel');
  document.getElementById('result-icon').textContent='🏆';
  document.getElementById('result-title').textContent='Mission Complete!';
  document.getElementById('result-fact').textContent='You explored the entire universe! The Smart Lad salutes you!';
  document.getElementById('result-pts').textContent=`+${bonus} Bonus BeatCoins!`;
  document.getElementById('result-pts').style.color='#ffde59';
  document.getElementById('result-image').style.display='none';
  rp.classList.add('show');
  document.getElementById('next-btn').style.display='none';
  document.getElementById('start-btn').textContent='🔄 New Mission!';
  document.getElementById('start-btn').style.display='block';
  document.getElementById('start-btn').onclick=()=>{ resetGame(); startGame(); };
  celebrate(); speak(pick(RITA_COMPLETE));
  setTimeout(showBonusGame, 2000);
}

function showBonusGame() {
  const area=document.getElementById('bonus-area');
  if(!area) return;
  area.style.display='block';
  const msgs={
    youngsters:"Stellar work love! The Turntable bonus game is yours! Going there in 5 seconds!",
    grownups:"Magnificent darling! The Turntable bonus awaits! Off we go in 5 seconds!",
    experts:"Outstanding love! The Turntable is unlocked! Going there in 5 seconds!"
  };
  speak(msgs[S.level]);
  let count=5;
  const cd=document.getElementById('bonus-countdown');
  if(cd) cd.textContent='Going there in '+count+' seconds...';
  const iv=setInterval(()=>{
    count--;
    if(cd) cd.textContent=count>0?'Going there in '+count+' seconds...':'Off we go!';
    if(count<=0){ clearInterval(iv); goToBonusGame(); }
  },1000);
}
function goToBonusGame(){ window.location.href='page3_turntable.html?level='+S.level+'&from=space'; }

function resetGame() {
  S.gameActive=false; S.qIndex=0; S.score=0; S.answered=false;
  document.getElementById('options-grid').innerHTML='';
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('bonus-area').style.display='none';
  document.getElementById('result-image').style.display='none';
  document.getElementById('question-img-wrap').style.display='none';
  document.getElementById('question-counter').textContent='Question 0 of 8';
  document.getElementById('question-text').textContent='Press Start to begin your cosmic adventure!';
  document.getElementById('progress-fill').style.width='0%';
  document.getElementById('q-val').textContent='0/8';
  document.getElementById('score-val').textContent='0';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('start-btn').textContent='🚀 Begin Star Words!';
  document.getElementById('start-btn').onclick=startGame;
  document.getElementById('start-btn').style.display='block';
}

function saveBC() { localStorage.setItem('askLovelyRitaV4_bc', S.beatcoins); }

function celebrate() {
  const layer=document.getElementById('celebrate'); layer.innerHTML='';
  const cols=['#a855f7','#ff6ef7','#ffde59','#4ade80','#60a5fa','#fff'];
  for(let i=0;i<40;i++){
    const el=document.createElement('div'); el.className='cp';
    el.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*20}%;background:${cols[Math.floor(Math.random()*cols.length)]};animation-delay:${Math.random()*.7}s;animation-duration:${1.2+Math.random()*.9}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'};`;
    layer.appendChild(el);
  }
  setTimeout(()=>layer.innerHTML='',2500);
}

function speak(text) {
  if(localStorage.getItem('askLovelyRitaV4_mute')==='1') return;
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=0.9; u.pitch=1.1;
  const voices=window.speechSynthesis.getVoices();
  const v=voices.find(v=>v.lang==='en-GB'&&/female|woman/i.test(v.name))||voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'));
  if(v) u.voice=v;
  window.speechSynthesis.speak(u);
}

function setRitaText(t) { document.getElementById('rita-text').textContent=t; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function toast(msg){ const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000); }


// Save BeatCoins per chosen Lad for global scoreboard
function saveLadBC(amount) {
  try {
    const lad = localStorage.getItem('askLovelyRitaV4_chosen_lad') || 'smart';
    const key = 'askLovelyRitaV4_bc_' + lad;
    const current = Number(localStorage.getItem(key) || 0);
    localStorage.setItem(key, current + amount);
  } catch(e) {}
}

function goBack() {
  if(S.fromWorld==='space') { window.location.href='page7_space.html'; return; }
  window.location.href='page5_worlds.html';
}
function goHome()    { window.location.href='page1_landing.html'; }
function goForward() { window.location.href='page8_india.html'; }
</script>
