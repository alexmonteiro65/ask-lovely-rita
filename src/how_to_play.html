<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to Play — Lovely Rita Adventures</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0a;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Georgia,serif;}
#phone-outer{display:flex;justify-content:center;padding:20px 0 40px;width:100%;}
#phone{background:#1a0040;width:393px;min-height:852px;border-radius:48px;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 10px #1a1a1a,0 0 0 12px #333,0 30px 80px rgba(0,0,0,0.8);}
#phone::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#0a0a0a;border-radius:0 0 20px 20px;z-index:100;}
#phone-scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-top:44px;padding-bottom:10px;}
#phone-scroll::-webkit-scrollbar{display:none;}

/* HEADER */
#htp-header{text-align:center;padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,0.08);position:relative;}
#htp-title{font-size:22px;font-weight:bold;color:#ff6ef7;text-shadow:0 0 24px #ff6ef7;letter-spacing:2px;}
#htp-sub{font-size:10px;color:#ffde59;letter-spacing:1.5px;margin-top:3px;opacity:.8;}

/* LANGUAGE TOGGLE */
#lang-toggle{display:flex;gap:6px;justify-content:center;margin-top:10px;}
.lang-btn{
  padding:5px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);
  font-size:11px;cursor:pointer;transition:all .2s;font-family:Georgia,serif;
}
.lang-btn.active{
  background:rgba(255,110,247,.2);border-color:#ff6ef7;
  color:#ff6ef7;font-weight:bold;
}
.lang-btn:hover{background:rgba(255,110,247,.12);border-color:rgba(255,110,247,.5);}

#rita-htp-row{display:flex;align-items:center;gap:10px;padding:10px 16px 0;}
#rita-htp-img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(255,110,247,.6));flex-shrink:0;}
#rita-htp-say{font-size:10px;color:rgba(255,255,255,.7);font-style:italic;line-height:1.5;}

/* STEPS */
#steps-container{padding:12px 16px;display:flex;flex-direction:column;gap:12px;}
.step-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,110,247,0.3);border-radius:16px;overflow:hidden;transition:border-color .3s;}
.step-card.active{border-color:#ff6ef7;box-shadow:0 0 20px rgba(255,110,247,.3);}
.step-header{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:rgba(255,255,255,.03);}
.step-num{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ff6ef7,#a855f7);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#000;flex-shrink:0;}
.step-title{flex:1;font-size:12px;font-weight:bold;color:#fff;letter-spacing:.5px;}
.step-arrow{font-size:11px;color:rgba(255,110,247,.7);transition:transform .3s;}
.step-arrow.open{transform:rotate(180deg);}
.step-body{display:none;padding:11px 14px;border-top:1px solid rgba(255,255,255,.06);}
.step-body.show{display:block;}
.step-desc{font-size:10px;color:rgba(255,255,255,.75);line-height:1.7;margin-bottom:7px;}
.step-tip{font-size:9px;color:#ffde59;background:rgba(255,222,89,.08);border-radius:8px;padding:7px 10px;margin-top:6px;line-height:1.5;}
.step-hl{font-size:10px;font-weight:bold;color:#ff6ef7;}
.world-row{font-size:10px;color:#ddd;margin:3px 0;line-height:1.5;}
.level-box{border-radius:9px;padding:7px 9px;margin-bottom:6px;}

#start-btn{display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:13px;background:linear-gradient(135deg,#ff6ef7,#a855f7);border:none;border-radius:28px;color:#000;font-size:13px;font-weight:bold;letter-spacing:1px;cursor:pointer;font-family:Georgia,serif;box-shadow:0 4px 20px rgba(255,110,247,.4);}


#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
</style>
</head>

    </div>

<button id="start-btn" onclick="goHome()">🎵 Let's Play!</button>

</div></div>
</div>

// ── STATE ─────────────────────────────────────────────────────
let currentLang = localStorage.getItem('lra_htp_lang') || 'en';

// ── SWITCH LANGUAGE ────────────────────────────────────────────
function switchLang(lang) {
  currentLang = lang;
  localStorage.setItem('lra_htp_lang', lang);

  const c = CONTENT[lang];

  // Page title
  document.getElementById('htp-title').textContent = c.page_title;

  // Rita greeting
  document.getElementById('rita-htp-say').textContent = c.rita_say_load;

  // Step titles and bodies (populate all)
  c.steps.forEach((step, i) => {
    const n = i + 1;
    const titleEl = document.getElementById('title-' + n);
    const bodyEl  = document.getElementById('body-' + n);
    if (titleEl) titleEl.textContent = step.title;
    if (bodyEl)  bodyEl.innerHTML    = step.body;
  });

  // Start button
  document.getElementById('start-btn').textContent = c.start_btn;

  // Toggle button active state
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-pt').classList.toggle('active', lang === 'pt');

  // Rita speaks welcome in correct language
  speakRita(c.rita_say_load, lang);
}

// ── TOGGLE STEP ────────────────────────────────────────────────
function toggleStep(n) {
  const body  = document.getElementById('body-' + n);
  const arrow = document.getElementById('arrow-' + n);
  const card  = document.getElementById('card-' + n);
  const isOpen = body.classList.contains('show');
  body.classList.toggle('show', !isOpen);
  arrow.classList.toggle('open', !isOpen);
  card.classList.toggle('active', !isOpen);
  // Speak step description in current language
  if (!isOpen) {
    const step = CONTENT[currentLang].steps[n - 1];
    if (step && step.speak) speakRita(step.speak, currentLang);
  }
}

// ── SPEAK (language-aware, avoids mispronunciation) ────────────
function speakRita(text, lang) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  // PT-BR text is written to avoid English words, so pt-BR voice is safe
  u.lang  = (lang === 'pt') ? 'pt-BR' : 'en-GB';
  u.rate  = 0.90;
  u.pitch = 1.1;

  function doSpeak() {
    const voices = window.speechSynthesis.getVoices();
    const targetLang = (lang === 'pt') ? 'pt-BR' : 'en-GB';
    const voice = voices.find(v => v.lang === targetLang)
               || voices.find(v => v.lang.startsWith(lang === 'pt' ? 'pt' : 'en'))
               || (voices.length ? voices[0] : null);
    if (voice) u.voice = voice;
    if (window.speechSynthesis.paused) window.speechSynthesis.resume();
    window.speechSynthesis.speak(u);
  }

  const voices = window.speechSynthesis.getVoices();
  if (voices && voices.length > 0) { doSpeak(); }
  else {
    window.speechSynthesis.addEventListener('voiceschanged', doSpeak, {once: true});
    setTimeout(doSpeak, 500);
  }
}

function goHome() { window.location.href = 'page1_landing.html'; }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.opacity = '0', 3000);
}

// ── INIT ───────────────────────────────────────────────────────
window.addEventListener('load', () => {
  switchLang(currentLang); // applies saved preference or default EN
});
</script>
